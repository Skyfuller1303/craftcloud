[workspace]
resolver = "3"
members = [
    "apps/craftcloud-server",
    "apps/craftcloud-egui-demo",
    "crates/craftcloud-client",
    "crates/craftcloud-client-native",
    "crates/craftcloud-egui",
    "crates/craftcloud-core",
    "crates/craftcloud-api",
    "crates/craftcloud-backup",
    "crates/craftcloud-auth",
    "crates/craftcloud-db",
    "crates/craftcloud-storage",
    "crates/craftcloud-figcraft",
    "crates/craftcloud-mail",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
craftcloud-core = { path = "crates/craftcloud-core" }
craftcloud-api = { path = "crates/craftcloud-api" }
craftcloud-backup = { path = "crates/craftcloud-backup" }
craftcloud-db = { path = "crates/craftcloud-db" }
craftcloud-auth = { path = "crates/craftcloud-auth" }
craftcloud-storage = { path = "crates/craftcloud-storage" }
craftcloud-figcraft = { path = "crates/craftcloud-figcraft" }
craftcloud-mail = { path = "crates/craftcloud-mail" }
lettre = { version = "=0.11.23", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
argon2 = { version = "0.5", features = ["std"] }
aes-gcm = "0.10"
hmac = "0.12"
sha1 = "0.10"
sha2 = { version = "0.10", default-features = false }
subtle = "2"
base64 = { version = "0.22", default-features = false, features = ["std"] }
libc = "0.2"
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros", "uuid", "time"] }
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "json"] }
url = { version = "2", default-features = false, features = ["std"] }
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
zip = { version = "=2.6.1", default-features = false, features = ["deflate"] }
figcraft-collab = { git = "https://github.com/storytold/figcraft", rev = "ddda495a6ff40c326a117fbc393a8cfaa319f529" }
figcraft-doc = { git = "https://github.com/storytold/figcraft", rev = "ddda495a6ff40c326a117fbc393a8cfaa319f529" }
figcraft-format = { git = "https://github.com/storytold/figcraft", rev = "ddda495a6ff40c326a117fbc393a8cfaa319f529" }
ipnet = "2"
zeroize = "1"
unicode-normalization = { version = "0.1", default-features = false, features = ["std"] }
http-body-util = "0.1"
http-body = "1"
bytes = "1"
uuid = { version = "1", default-features = false, features = ["v4"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
futures-util = "0.3"
fs2 = "=0.4.3"
russh = { version = "=0.65.0", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "=3.0.1"
aws-sdk-s3 = { version = "=1.122.0", default-features = false, features = ["behavior-version-latest", "http-1x", "rt-tokio", "rustls"] }
aws-smithy-http-client = { version = "=1.1.9", default-features = false, features = ["rustls-ring"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.dev]
debug = "line-tables-only"

# Password hashing is memory-hard; unoptimized builds make tests very slow.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Streaming checksums over large files.
[profile.dev.package.sha2]
opt-level = 3
