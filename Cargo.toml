[workspace]
resolver = "3"
members = [
    "apps/craftcloud-server",
    "crates/craftcloud-core",
    "crates/craftcloud-api",
    "crates/craftcloud-auth",
    "crates/craftcloud-db",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
# No `license` field on purpose: the license is undecided (ADR-0008).

[workspace.dependencies]
craftcloud-core = { path = "crates/craftcloud-core" }
craftcloud-api = { path = "crates/craftcloud-api" }
craftcloud-db = { path = "crates/craftcloud-db" }
craftcloud-auth = { path = "crates/craftcloud-auth" }
argon2 = { version = "0.5", features = ["std"] }
sha2 = { version = "0.10", default-features = false }
subtle = "2"
libc = "0.2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros", "uuid", "time"] }
time = { version = "0.3", default-features = false, features = ["std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "json"] }
url = { version = "2", default-features = false, features = ["std"] }
ipnet = "2"
zeroize = "1"
uuid = { version = "1", default-features = false, features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.dev]
debug = "line-tables-only"

# Password hashing is memory-hard; unoptimized builds make tests very slow.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
