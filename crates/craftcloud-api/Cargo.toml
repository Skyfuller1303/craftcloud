publish.workspace = true

[dependencies]
craftcloud-core.workspace = true
craftcloud-auth.workspace = true
craftcloud-storage.workspace = true
http-body-util.workspace = true
craftcloud-db.workspace = true
serde = { workspace = true }
zeroize.workspace = true
base64.workspace = true
axum.workspace = true
serde_json.workspace = true
ipnet.workspace = true
tokio = { workspace = true, features = ["time", "rt", "sync"] }
tower-http = { workspace = true, features = ["request-id", "limit", "trace", "set-header"] }
tracing.workspace = true
uuid.workspace = true
time.workspace = true

[dev-dependencies]
craftcloud-storage = { workspace = true, features = ["fault-injection"] }
http-body.workspace = true
bytes.workspace = true
sha2.workspace = true
