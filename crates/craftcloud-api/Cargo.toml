[package]
name = "craftcloud-api"
description = "CraftCloud HTTP router, handlers and middleware (library only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
test-util = []

[dependencies]
openidconnect = { version = "=4.0.1", default-features = false }
reqwest = { version = "=0.12.23", default-features = false, features = ["rustls-tls", "stream"] }
url.workspace = true
craftcloud-core.workspace = true
craftcloud-auth.workspace = true
craftcloud-storage.workspace = true
http-body-util.workspace = true
http-body.workspace = true
sha2.workspace = true
subtle.workspace = true
sqlx.workspace = true
craftcloud-db.workspace = true
craftcloud-figcraft.workspace = true
serde = { workspace = true }
zeroize.workspace = true
base64.workspace = true
axum.workspace = true
serde_json.workspace = true
ipnet.workspace = true
tokio = { workspace = true, features = ["time", "rt", "sync", "net"] }
tower-http = { workspace = true, features = ["request-id", "limit", "trace", "set-header"] }
tracing.workspace = true
uuid = { workspace = true, features = ["serde"] }
time.workspace = true

[dev-dependencies]
reqwest = { version = "=0.12.23", default-features = false, features = ["json"] }
sha1.workspace = true
hmac.workspace = true
# The SDK is exercised against the real router (tests/sdk_second_factor.rs); path-only, not shipped.
craftcloud-client = { path = "../craftcloud-client" }
craftcloud-backup.workspace = true
craftcloud-storage = { workspace = true, features = ["fault-injection"] }
bytes.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
tower.workspace = true
sqlx.workspace = true
argon2.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
# Contract tests only (parses contracts/openapi.yaml); not part of the shipped binary.
serde_yaml_ng = "0.10"
figcraft-collab.workspace = true
figcraft-doc.workspace = true
figcraft-format.workspace = true
tungstenite.workspace = true
zip.workspace = true

[lints]
workspace = true
