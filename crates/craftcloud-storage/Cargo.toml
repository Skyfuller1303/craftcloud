[package]
name = "craftcloud-storage"
description = "CraftCloud object storage: local filesystem adapter with checksums and bounded streams (no HTTP)"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
aws-sdk-s3.workspace = true
aws-smithy-http-client.workspace = true
chacha20poly1305.workspace = true
futures-util.workspace = true
hmac.workspace = true
fastcdc = "=3.1.0"
zstd.workspace = true
russh.workspace = true
russh-sftp.workspace = true
sha2.workspace = true
zeroize.workspace = true
uuid.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync", "time"] }
url.workspace = true

[features]
# Lets tests arm injected failures. The server never enables it.
fault-injection = []

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
craftcloud-storage = { path = ".", features = ["fault-injection"] }
tokio = { workspace = true, features = ["fs", "io-util", "rt", "rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
