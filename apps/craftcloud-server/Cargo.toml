[package]
name = "craftcloud-server"
description = "CraftCloud server binary (composition root)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
craftcloud-api.workspace = true
craftcloud-auth.workspace = true
craftcloud-backup.workspace = true
craftcloud-core.workspace = true
craftcloud-figcraft.workspace = true
craftcloud-mail.workspace = true
time.workspace = true
uuid.workspace = true
craftcloud-db.workspace = true
craftcloud-storage.workspace = true
ipnet.workspace = true
url.workspace = true
base64.workspace = true
sha2.workspace = true
zeroize.workspace = true
fs2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "process"] }
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix.workspace = true

[features]
# Test builds only: lets crash tests abort the process at named points
# (`CC_FAULT_ABORT_AT`). Never enabled in a normal build.
fault-injection = ["craftcloud-storage/fault-injection"]

[[test]]
name = "crash"
required-features = ["fault-injection"]

[dev-dependencies]
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }
sqlx.workspace = true

[lints]
workspace = true
