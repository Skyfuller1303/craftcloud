      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        target_kind: {type: string, enum: [project, file]}
        target_id: {type: string, format: uuid}
        grantee:
          type: object
          required: [user_id, display_name, email]
          properties:
            user_id: {type: string, format: uuid}
            display_name: {type: string}
            email: {type: string}
        role: {type: string, enum: [viewer, editor]}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
    SharedWithMeResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/SharedTarget'}
        next_cursor: {type: [string, 'null']}
    SharedTarget:
      type: object
      required: [target_kind, target_id, role, workspace, project, file]
      properties:
        target_kind: {type: string, enum: [project, file]}
        target_id: {type: string, format: uuid}
        role: {type: string, enum: [viewer, editor]}
        workspace:
          type: object
          required: [id, name]
          description: The workspace name is null for organization guests.
          properties:
            id: {type: string, format: uuid}
            name: {type: [string, 'null']}
        project:
          type: [object, 'null']
          required: [id, name]
          description: >-
            For organization guests only present for project grants (null for a file grant); members always
            get the parent project of a file grant.
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
        file:
          type: [object, 'null']
          required: [id, name]
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
    LockAcquireRequest:
      type: object
      additionalProperties: false
      required: [client_id]
      properties:
        client_id: {type: string, pattern: '^[a-z0-9-]{1,32}$'}
        takeover: {type: boolean, default: false}
    FileLock:
      type: object
      required: [holder_display_name, since, expires_at, mine, held_by_current_session]
      properties:
        holder_display_name: {type: string}
        since: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        mine: {type: boolean}
        held_by_current_session: {type: boolean}
    File:
      type: object
      required: [id, organization_id, workspace_id, project_id, name, app, format, size_bytes, sha256, head_version_id, version, created_by, created_at, updated_by, updated_at, deleted_at]
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 255, description: Untrusted display metadata; never a path}
        app: {type: string, pattern: '^[a-z0-9-]{1,32}$'}
        format: {type: string, pattern: '^[a-z0-9.+-]{1,64}$'}
        size_bytes: {type: integer, minimum: 0, description: 0 until a version exists}
        sha256: {type: [string, 'null'], description: Lowercase hex; null until a version exists}
        head_version_id: {type: [string, 'null'], format: uuid, description: Null until the first commit}
        version: {type: integer, minimum: 1}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_by: {type: string, format: uuid}
        updated_at: {type: string, format: date-time}
        deleted_at: {type: [string, 'null'], format: date-time}
        can_share: {type: boolean, description: Server-calculated grant-management capability}
        can_force_lock: {type: boolean, description: Server-calculated force-release capability}
        lock: {oneOf: [{$ref: '#/components/schemas/FileLock'}, {type: 'null'}]}
        project: {type: object, required: [id, name], properties: {id: {type: string, format: uuid}, name: {type: [string, 'null'], description: Null for an organization guest without a grant on the project}}, description: Minimal parent metadata included on authorized file reads}
    FilePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/File'}
        next_cursor: {type: [string, 'null']}
    CreateFileRequest:
      type: object
      additionalProperties: false
      required: [name, app, format]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        app: {type: string, pattern: '^[a-z0-9-]{1,32}$'}
        format: {type: string, pattern: '^[a-z0-9.+-]{1,64}$'}
    UpdateFileRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
    CreateUploadRequest:
      type: object
      additionalProperties: false
      required: [size_bytes, sha256]
      properties:
        size_bytes: {type: integer, minimum: 0, description: Exact size of the content that will be sent}
        sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$', description: Hex SHA-256 of the content}
    Upload:
      type: object
      required: [upload_id, file_id, project_id, workspace_id, state, size_bytes, sha256, max_bytes, created_by, created_at, expires_at]
      properties:
        upload_id: {type: string, format: uuid}
        file_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        state: {type: string, enum: [created, receiving, stored, committed, aborted, expired, failed]}
        size_bytes: {type: integer, minimum: 0}
        sha256: {type: string}
        max_bytes: {type: integer, minimum: 0, description: Most bytes the content route accepts (the declared size)}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    QuotaRequest:
      type: object
      additionalProperties: false
      required: [quota_bytes]
      properties:
        quota_bytes: {type: [integer, 'null'], minimum: 0}
    QuotaResponse:
      type: object
      required: [quota_bytes]
      properties:
        quota_bytes: {type: [integer, 'null'], minimum: 0}
    UsageEntry:
      type: object
      required: [quota_bytes, reserved_bytes, committed_bytes]
      properties:
        quota_bytes: {type: [integer, 'null'], minimum: 0}
        reserved_bytes: {type: integer, minimum: 0}
        committed_bytes: {type: integer, minimum: 0}
    WorkspaceUsageEntry:
      type: object
      required: [workspace_id, effective_limit_bytes, quota_bytes, reserved_bytes, committed_bytes]
      properties:
        workspace_id: {type: string, format: uuid}
        effective_limit_bytes: {type: [integer, 'null'], minimum: 0, description: The smaller of the workspace and the organization quota; null when neither is set}
        quota_bytes: {type: [integer, 'null'], minimum: 0}
        reserved_bytes: {type: integer, minimum: 0}
        committed_bytes: {type: integer, minimum: 0}
    UsagePage:
      type: object
      required: [organization, workspaces, next_cursor]
      properties:
        organization: {$ref: '#/components/schemas/UsageEntry'}
        workspaces:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/WorkspaceUsageEntry'}
        next_cursor: {type: [string, 'null']}
    CommitVersionRequest:
      type: object
      additionalProperties: false
      required: [upload_id]
      properties:
        upload_id: {type: string, format: uuid}
    Version:
      type: object
      required: [id, file_id, number, size_bytes, sha256, base_version_id, restored_from_version_id, upload_id, created_by, actor_kind, created_at]
      properties:
        id: {type: string, format: uuid}
        file_id: {type: string, format: uuid}
        number: {type: integer, minimum: 1}
        size_bytes: {type: integer, minimum: 0}
        sha256: {type: string}
        base_version_id: {type: [string, 'null'], format: uuid}
        restored_from_version_id: {type: [string, 'null'], format: uuid}
        upload_id: {type: [string, 'null'], format: uuid}
        created_by: {type: string, format: uuid}
        actor_kind: {type: string, enum: [user, figcraft_live]}
        created_at: {type: string, format: date-time}
    FigCraftLiveRequest:
      type: object
      additionalProperties: false
      properties:
        renew: {type: boolean, default: false}
    FigCraftLiveLink:
      type: object
      required: [join_url, access]
      properties:
        join_url: {type: string, format: uri}
        web_url: {type: [string, 'null'], format: uri}
        access: {type: string, enum: [edit, view]}
    FigCraftLiveStatus:
      type: object
      required: [state, access, can_snapshot, can_stop, last_snapshot_at, participants]
      properties:
        state: {type: string, enum: [inactive, publishing, active, stopping, republish]}
        access: {type: string, enum: [edit, view]}
        can_snapshot: {type: boolean}
        can_stop: {type: boolean}
        last_snapshot_at: {type: [string, 'null'], format: date-time}
        participants: {type: [integer, 'null'], minimum: 0}
    VersionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Version'}
        next_cursor: {type: [string, 'null']}
    AdminUser:
      type: object
      required: [id, email, display_name, created_at, disabled, email_verified, origin]
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        display_name: {type: string}
        created_at: {type: string, format: date-time}
        disabled: {type: boolean}
        email_verified: {type: boolean}
        origin:
          description: Set for accounts created by accepting an invitation, otherwise null
          oneOf:
            - type: 'null'
            - type: object
              required: [organization_id, invited_by_user_id, invitation_id]
              properties:
                organization_id: {type: [string, 'null'], format: uuid}
                invited_by_user_id: {type: [string, 'null'], format: uuid}
                invitation_id: {type: string, format: uuid}
    Readiness:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ready, degraded]}
    HealthLevel:
      type: string
      enum: [ok, degraded, down, not_configured]
    AdminHealth:
      type: object
      required: [status, checked_at, components, uploads, maintenance, audit, server, backup]
      properties:
        status: {$ref: '#/components/schemas/HealthLevel'}
        checked_at: {type: string, format: date-time}
        components:
          type: object
          required: [database, migrations, storage, two_factor]
          properties:
            two_factor:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [ok, not_configured], description: Availability of the current second-factor encryption key; never includes key material or file paths}
            database:
              type: object
              required: [status, pool]
              properties:
                status: {$ref: '#/components/schemas/HealthLevel'}
                pool:
                  type: object
                  required: [size, idle, in_use, max]
                  properties:
                    size: {type: integer, minimum: 0, description: Connections currently open.}
                    idle: {type: integer, minimum: 0}
                    in_use: {type: integer, minimum: 0}
                    max: {type: integer, minimum: 1, description: Configured pool size.}
            migrations:
              type: object
              required: [status]
              properties:
                status: {$ref: '#/components/schemas/HealthLevel'}
            storage:
              type: object
              required: [status, binding, free_bytes]
              properties:
                status: {$ref: '#/components/schemas/HealthLevel'}
                binding:
                  type: string
                  enum: [matches, unbound, epoch_conflict, mismatch, error, unknown, not_configured]
                free_bytes:
                  type: [integer, 'null']
                  format: int64
                  minimum: 0
                  description: Free bytes on the volume of the object store; null if it cannot be measured.
        uploads:
          type: object
          required: [open_sessions, overdue_sessions]
          properties:
            open_sessions: {type: [integer, 'null'], minimum: 0, description: 'Created, receiving or stored; null if the query failed.'}
            overdue_sessions: {type: [integer, 'null'], minimum: 0, description: 'Open and past their expiry (the maintenance job expires them).'}
        maintenance:
          type: object
          required: [last_run, last_run_ok, epoch_conflict]
          properties:
            last_run:
              oneOf:
                - {type: 'null'}
                - {$ref: '#/components/schemas/MaintenanceRun'}
            last_run_ok: {type: [boolean, 'null'], description: 'Null until a run has finished; false if any step reported an error code.'}
            epoch_conflict: {type: boolean, description: True while the database and the object store disagree about their epoch.}
        audit:
          type: object
          required: [dropped_events_total, dropped_events_lossy, dropped_events_important]
          description: Best-effort audit events dropped under load since this process started.
          properties:
            dropped_events_total: {type: integer, format: int64, minimum: 0}
            dropped_events_lossy: {type: integer, format: int64, minimum: 0}
            dropped_events_important: {type: integer, format: int64, minimum: 0}
        server:
          type: object
          required: [version, uptime_seconds]
          properties:
            version: {type: string}
            uptime_seconds: {type: integer, format: int64, minimum: 0}
        backup:
          type: object
          required: [last_success_age_seconds]
          properties:
            last_success_age_seconds:
              type: [integer, 'null']
              format: int64
              minimum: 0
              description: >-
                Seconds since the newest successful `backup.created` audit event; null if there is none or it cannot be read.
    MaintenanceStatus:
      type: object
      required: [last_run]
      properties:
        last_run:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/MaintenanceRun'}
    MaintenanceRun:
      type: object
      required: [trigger, started_at, finished_at, duration_ms, steps, error_codes]
      properties:
        trigger: {type: string, enum: [scheduled, cli]}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        duration_ms: {type: integer, format: int64, minimum: 0}
        steps:
          type: object
          description: >-
            By step name (`expire_uploads`, `purge_trash`, `trim_versions`, `collect_blobs`, `reconcile_storage`,
            `verify_blobs`, `fix_usage`).
          additionalProperties:
            type: object
            required: [counts, error_code]
            properties:
              counts:
                type: object
                description: What the step did, by counter name.
                additionalProperties: {type: integer, format: int64, minimum: 0}
              error_code: {type: [string, 'null'], description: 'DATABASE_ERROR if the step stopped on a database failure.'}
        error_codes:
          type: array
          maxItems: 16
          items: {type: string}
    AdminUserPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/AdminUser'}
        next_cursor: {type: [string, 'null']}
    AdminDevicePage:
      type: object
      required: [devices, next_cursor]
      properties:
        devices:
          type: array
          maxItems: 100
          items:
            type: object
            required: [device_ref, name, client_kind, client_id, created_at, last_used_at]
            properties:
              device_ref: {type: string, pattern: '^ds_[a-f0-9]{64}$'}
              name: {type: string}
              client_kind: {type: string}
              client_id: {type: string}
              created_at: {type: string, format: date-time}
              last_used_at: {type: string, format: date-time}
        next_cursor: {type: [string, 'null']}
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, org_role]
      properties:
        email: {type: string, maxLength: 320}
        language: {type: string, enum: [en, de], description: Optional invitation message language; defaults to English}
        org_role: {type: string, enum: [admin, member, guest]}
        workspace_id: {type: [string, 'null'], format: uuid, description: Guest invitation context only without workspace_role; otherwise required together with workspace_role}
        workspace_role: {type: [string, 'null'], enum: [admin, editor, viewer, null], description: Forbidden for guest invitations; required with workspace_id for other roles}
    CreatedInvitation:
      type: object
      required: [invitation_id, invite_url, expires_at]
      properties:
        invitation_id: {type: string, format: uuid}
        invite_url:
          type: string
          description: Shown once. `<PUBLIC_URL>/invite#token=<token>`; treat as a secret.
        expires_at: {type: string, format: date-time}
    InvitationDeliveryResponse:
      type: object
      required: [invitation_id, sent_to, expires_at]
      properties:
        invitation_id: {type: string, format: uuid}
        sent_to: {type: string, format: email}
        expires_at: {type: string, format: date-time}
    Invitation:
      type: object
      required: [id, email, org_role, workspace_id, workspace_role, status, created_by, created_at, expires_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        org_role: {type: string, enum: [admin, member, guest]}
        workspace_id: {type: [string, 'null'], format: uuid}
        workspace_role: {type: [string, 'null'], enum: [admin, editor, viewer, null]}
        status: {type: string, enum: [pending, accepted, revoked, expired, invalid]}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    InvitationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Invitation'}
        next_cursor: {type: [string, 'null']}
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {type: string, writeOnly: true}
        display_name: {type: string, minLength: 1, maxLength: 100, description: Required when no account exists for the address}
        password: {type: string, writeOnly: true, description: Required when no account exists for the address}
    AcceptedInvitation:
      type: object
      required: [user_id, organization_id, workspace_id, account_created, workspace_role_applied]
      properties:
        user_id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        workspace_id: {type: [string, 'null'], format: uuid}
        account_created: {type: boolean}
        workspace_role_applied: {type: boolean, description: False when an existing equal or higher workspace role was kept}
        csrf_token: {type: string, description: Only when an account was created and logged in}
        expires_at: {type: string, format: date-time, description: Session expiry, only when a session was issued}
  responses:
    LoginChallengeOrInvalid:
      description: >-
        INVALID_CREDENTIALS for unknown account, wrong password or disabled account; or
        SECOND_FACTOR_REQUIRED after a correct password when TOTP is enabled, with the opaque
        challenge in error.details.challenge_id. No session or access token is issued by the challenge response.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TwoFactorForbidden:
      description: CSRF_FAILED. Invalid passwords and second-factor proofs return 401 INVALID_CREDENTIALS; no submitted value is echoed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AmbiguousCredentials:
      description: AMBIGUOUS_CREDENTIALS when Cookie and Bearer are supplied together; device POST routes also return DEVICE_TLS_REQUIRED when transport evidence is missing. Use exactly one authentication method.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    DeviceTlsRequired:
      description: Device credentials require TLS or an explicitly configured loopback instance (DEVICE_TLS_REQUIRED).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RefreshTokenInvalid:
      description: Unknown, malformed, expired, revoked or reused refresh token (REFRESH_TOKEN_INVALID).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ForbiddenOrCsrf:
      description: FORBIDDEN (authenticated but not allowed), CSRF_FAILED, or TWO_FACTOR_SETUP_REQUIRED for a visible organization that requires enrollment
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InvalidCursor:
      description: The cursor is malformed or belongs to another listing or scope (INVALID_CURSOR)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PayloadTooLarge:
      description: Request body exceeds the configured limit (code PAYLOAD_TOO_LARGE)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Timeout:
      description: Handler exceeded the time limit (code TIMEOUT)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalError:
      description: Internal error (INTERNAL)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ServiceUnavailable:
      description: AUTH_UNAVAILABLE (no database configured or reachable, or CRAFTCLOUD_PUBLIC_URL missing where a link must be built), TWO_FACTOR_UNAVAILABLE (required encryption key unavailable), or TIMEOUT (handler timeout)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnsupportedMediaType:
      description: Content-Type is not application/json (UNSUPPORTED_MEDIA_TYPE)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    BodyInvalid:
      description: >-
        VALIDATION_ERROR. Without details when the body cannot be parsed (invalid JSON, unknown or missing
        field); with details.fields (field names only) for semantic validation such as the password policy.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InvalidCredentials:
      description: E-mail address or password is incorrect (INVALID_CREDENTIALS); identical for every kind of failure
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    CsrfFailed:
      description: CSRF header or Origin check failed (CSRF_FAILED)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: Too many requests (RATE_LIMITED); Retry-After gives the seconds to wait. Counters are in memory (single instance) and cleared by a restart.
      headers:
        Retry-After: {schema: {type: integer, minimum: 1}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: >-
        No valid session (UNAUTHENTICATED): missing, malformed, expired (idle 8 h or absolute 7 d by default) or revoked.
        Credential verification endpoints return INVALID_CREDENTIALS for an invalid password, second-factor proof or challenge.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource not visible to requester (NOT_FOUND); unknown ids and ids of other tenants are indistinguishable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: State conflict without precondition (e.g. setup already completed, idempotency key reused with a different payload)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
