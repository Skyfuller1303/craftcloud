              - {$ref: '#/components/schemas/Grant'}
              - type: object
                required: [target_name]
                properties:
                  target_name: {type: string}
        next_cursor: {type: [string, 'null']}
    LockPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/OrganizationLock'}
        next_cursor: {type: [string, 'null']}
    OrganizationLock:
      type: object
      required: [file_id, file_name, workspace_id, holder_user_id, holder_display_name, since, expires_at, session_kind]
      properties:
        file_id: {type: string, format: uuid}
        file_name: {type: string}
        workspace_id: {type: string, format: uuid}
        holder_user_id: {type: string, format: uuid}
        holder_display_name: {type: string}
        since: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        session_kind: {type: string, enum: [browser, device]}
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name, slug, owner_user_id]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        slug: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$'}
        owner_user_id: {type: string, format: uuid}
    UpdateOrganizationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        workspace_admin_invites_enabled: {type: boolean}
        require_two_factor: {type: boolean, description: Owner or admin only; enabling requires an enabled second factor on the caller's account}
    AddMemberRequest:
      type: object
      additionalProperties: false
      required: [user_id, role]
      properties:
        user_id: {type: string, format: uuid}
        role: {type: string, enum: [owner, admin, member, guest]}
    ChangeRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: {type: string, enum: [owner, admin, member, guest]}
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          maxItems: 100
          items:
            type: object
            required: [id, created_at, last_seen_at, expires_at, current]
            properties:
              id: {type: string, format: uuid}
              created_at: {type: string, format: date-time}
              last_seen_at: {type: string, format: date-time}
              expires_at: {type: string, format: date-time, description: Earliest of idle expiry from the last recorded activity and the absolute expiry}
              current: {type: boolean}
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name: {type: string, description: 'Trimmed; 1 to 100 characters, no control or invisible formatting characters'}
