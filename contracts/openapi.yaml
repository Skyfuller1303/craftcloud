        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '200':
          description: Restored
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "prj-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '423': {description: FILE_LOCKED, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
