    patch:
      tags: [Workspaces]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Change a workspace role
      description: >-
        Organization owners and admins may set any role. A workspace admin may set editor/viewer on editors and
        viewers; it never touches workspace admins (including itself): 403. Editors and viewers: 403. An unknown
        target is 404 for managers and 403 for editors and viewers.
