  /files/{file_id}/versions:
    parameters:
      - {$ref: '#/components/parameters/FileId'}
    get:
      tags: [Versions]
      summary: List the versions of a file, newest first (workspace members, organization owner and admin)
      description: >-
        Keyset paginated by version number (the cursor holds only the number and is bound to the file). Callers who
        cannot see the workspace: 404.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VersionPage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [Versions]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Commit a stored upload as the next version (compare-and-set)
      description: >-
        Needs `If-None-Match: *` for the first version or `If-Match: "version:<uuid>"` with the current head (the
        content ETag, not the metadata ETag `"file-v<n>"`); neither: 428 PRECONDITION_REQUIRED, both: 422. `If-Match: *`, lists of
        tags and weak tags (`W/`) are 422 VALIDATION_ERROR, not preconditions. A head that
        differs, or a file that already has a version when `If-None-Match: *` is sent: 412 VERSION_CONFLICT with
        `details.current_version_id` and the current ETag header (ADR-0009); the upload stays stored and can be
        rebased, or committed with `If-None-Match: *` to another file of the same workspace (a copy). Only the creator
        of the upload may commit it, and only while still editor or better (others who see the workspace: 403;
        otherwise 404); roles are read fresh in the locking transaction. The upload must be `stored` and unexpired
        (409 UPLOAD_INCOMPLETE / UPLOAD_CLOSED, 410 UPLOAD_EXPIRED); file or project in the trash: 409. A commit moves
        the reserved bytes to committed (once). Retrying a finished commit with the same upload returns the same version
        with 200 whatever the preconditions are (the upload id is the idempotency token); an `Idempotency-Key` header, if
        sent, must equal the one the upload was created with (409 IDEMPOTENCY_KEY_REUSED). A quota lowered after the
        reservation does not cancel it. Moves the metadata ETag of the file too.
      parameters:
        - in: header
          name: If-Match
          required: false
          schema: {type: string}
          description: The content ETag of the current head
        - in: header
          name: If-None-Match
          required: false
          schema: {type: string}
          description: The value `*` for the first version
        - in: header
          name: Idempotency-Key
          required: false
          schema: {type: string}
          description: Must match the key of the upload when sent
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommitVersionRequest'}
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '201':
          description: Committed
          headers:
            ETag: {schema: {type: string}, description: 'Content ETag "version:<uuid>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Version'}
        '200':
          description: Replay of an earlier commit of the same upload
          headers:
            ETag: {schema: {type: string}, description: 'Content ETag "version:<uuid>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Version'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '423': {description: FILE_LOCKED, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409':
          description: UPLOAD_INCOMPLETE, UPLOAD_CLOSED, FILE_DELETED, PROJECT_DELETED or IDEMPOTENCY_KEY_REUSED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '410':
          description: UPLOAD_EXPIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '412':
          description: VERSION_CONFLICT (details.current_version_id)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '428':
          description: PRECONDITION_REQUIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /files/{file_id}/versions/{version_id}:
    parameters:
      - {$ref: '#/components/parameters/FileId'}
      - {$ref: '#/components/parameters/VersionId'}
    get:
      tags: [Versions]
      summary: Get one version (workspace members, organization owner and admin)
      description: Unknown ids, versions of other files or tenants and callers who cannot see the workspace are indistinguishable (404).
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '200':
          description: The version
          headers:
            ETag: {schema: {type: string}, description: 'Content ETag "version:<uuid>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Version'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /files/{file_id}/versions/{version_id}/restore:
    parameters:
      - {$ref: '#/components/parameters/FileId'}
      - {$ref: '#/components/parameters/VersionId'}
    post:
      tags: [Versions]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Make an older version the head again, as a new version (editor and better)
      description: >-
        Creates a new version that references the blob of the old one (`restored_from_version_id`); no new bytes are
        stored or counted. Requires `If-Match` with the current head (428 without, 422 with `If-None-Match`, 412 when
        stale). The old versions stay. A blob that failed verification answers 500 BLOB_CORRUPT. File or project in the
        trash: 409.
      parameters:
        - in: header
          name: If-Match
          required: false
          schema: {type: string}
          description: The content ETag of the current head
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '201':
          description: Restored as a new version
          headers:
            ETag: {schema: {type: string}, description: 'Content ETag "version:<uuid>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Version'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '423': {description: FILE_LOCKED, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409':
          description: FILE_DELETED or PROJECT_DELETED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '412':
          description: VERSION_CONFLICT
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '428':
          description: PRECONDITION_REQUIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: BLOB_CORRUPT or INTERNAL
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
  /files/{file_id}/content:
    parameters:
      - {$ref: '#/components/parameters/FileId'}
    get:
      tags: [Versions]
      summary: Download the head version
      description: >-
        Streams the content with bounded memory. The caller's roles are re-checked for this request (viewers and better; others 404). The response is always `application/octet-stream` with `X-Content-Type-Options: nosniff`, `Content-Security-Policy: sandbox`, `Cache-Control: no-store`, an attachment disposition built from a sanitized name (ASCII fallback plus RFC 5987 `filename*`), `Repr-Digest` (SHA-256 of the whole version) and the content ETag. A single byte range is served as 206 (`Accept-Ranges: bytes`); several ranges, other units and malformed values are ignored (the whole content is sent), an unsatisfiable range is 416 with `Content-Range: bytes */<size>`. A full download is hashed while streaming and its last chunk is held back until the digest matches: on a mismatch or a short read the body ends with an error (the connection is cut, never a clean end), the blob is marked corrupt and later requests answer 500 BLOB_CORRUPT. Ranges are not verified by the server; clients check full downloads against Repr-Digest. A file or project in the trash answers 409 FILE_DELETED / PROJECT_DELETED, a file without version 404.
      parameters:
        - in: header
          name: Range
          required: false
          schema: {type: string}
          description: A single byte range `bytes=a-b`, `bytes=a-` or `bytes=-n`
        - in: header
          name: If-Range
          required: false
          schema: {type: string}
          description: >-
            Honors Range only if it equals exactly the strong content ETag `"version:<uuid>"` of the served version;
            anything else (another tag, weak tags, dates) sends the whole content with 200.
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '200':
          description: The content
          headers:
            ETag: {schema: {type: string}, description: 'Content ETag "version:<uuid>"'}
            Repr-Digest: {schema: {type: string}, description: 'RFC 9530 digest of the whole representation: sha-256=:<base64>:'}
            Content-Disposition: {schema: {type: string}, description: 'attachment with a sanitized ASCII filename and filename*=UTF-8'''}
            X-Content-Type-Options: {schema: {type: string, enum: [nosniff]}}
            Content-Security-Policy: {schema: {type: string, enum: [sandbox]}}
            Accept-Ranges: {schema: {type: string, enum: [bytes]}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '206':
          description: One byte range
          headers:
            ETag: {schema: {type: string}, description: 'Content ETag "version:<uuid>"'}
            Repr-Digest: {schema: {type: string}, description: 'RFC 9530 digest of the whole representation: sha-256=:<base64>:'}
            Content-Disposition: {schema: {type: string}, description: 'attachment with a sanitized ASCII filename and filename*=UTF-8'''}
            X-Content-Type-Options: {schema: {type: string, enum: [nosniff]}}
            Content-Security-Policy: {schema: {type: string, enum: [sandbox]}}
            Accept-Ranges: {schema: {type: string, enum: [bytes]}}
            Content-Range: {schema: {type: string}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: FILE_DELETED or PROJECT_DELETED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '416':
          description: RANGE_NOT_SATISFIABLE
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: BLOB_CORRUPT or INTERNAL
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /files/{file_id}/versions/{version_id}/content:
    parameters:
      - {$ref: '#/components/parameters/FileId'}
      - {$ref: '#/components/parameters/VersionId'}
    get:
      tags: [Versions]
      summary: Download one version
      description: >-
        Streams the content with bounded memory. The caller's roles are re-checked for this request (viewers and better; others 404). The response is always `application/octet-stream` with `X-Content-Type-Options: nosniff`, `Content-Security-Policy: sandbox`, `Cache-Control: no-store`, an attachment disposition built from a sanitized name (ASCII fallback plus RFC 5987 `filename*`), `Repr-Digest` (SHA-256 of the whole version) and the content ETag. A single byte range is served as 206 (`Accept-Ranges: bytes`); several ranges, other units and malformed values are ignored (the whole content is sent), an unsatisfiable range is 416 with `Content-Range: bytes */<size>`. A full download is hashed while streaming and its last chunk is held back until the digest matches: on a mismatch or a short read the body ends with an error (the connection is cut, never a clean end), the blob is marked corrupt and later requests answer 500 BLOB_CORRUPT. Ranges are not verified by the server; clients check full downloads against Repr-Digest. A file or project in the trash answers 409 FILE_DELETED / PROJECT_DELETED, a file without version 404.
      parameters:
        - in: header
          name: Range
          required: false
          schema: {type: string}
          description: A single byte range `bytes=a-b`, `bytes=a-` or `bytes=-n`
        - in: header
          name: If-Range
          required: false
          schema: {type: string}
          description: >-
            Honors Range only if it equals exactly the strong content ETag `"version:<uuid>"` of the served version;
            anything else (another tag, weak tags, dates) sends the whole content with 200.
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '200':
          description: The content
          headers:
            ETag: {schema: {type: string}, description: 'Content ETag "version:<uuid>"'}
            Repr-Digest: {schema: {type: string}, description: 'RFC 9530 digest of the whole representation: sha-256=:<base64>:'}
            Content-Disposition: {schema: {type: string}, description: 'attachment with a sanitized ASCII filename and filename*=UTF-8'''}
            X-Content-Type-Options: {schema: {type: string, enum: [nosniff]}}
            Content-Security-Policy: {schema: {type: string, enum: [sandbox]}}
            Accept-Ranges: {schema: {type: string, enum: [bytes]}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '206':
          description: One byte range
          headers:
            ETag: {schema: {type: string}, description: 'Content ETag "version:<uuid>"'}
            Repr-Digest: {schema: {type: string}, description: 'RFC 9530 digest of the whole representation: sha-256=:<base64>:'}
            Content-Disposition: {schema: {type: string}, description: 'attachment with a sanitized ASCII filename and filename*=UTF-8'''}
            X-Content-Type-Options: {schema: {type: string, enum: [nosniff]}}
            Content-Security-Policy: {schema: {type: string, enum: [sandbox]}}
            Accept-Ranges: {schema: {type: string, enum: [bytes]}}
            Content-Range: {schema: {type: string}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: FILE_DELETED or PROJECT_DELETED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '416':
          description: RANGE_NOT_SATISFIABLE
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: BLOB_CORRUPT or INTERNAL
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /organizations/{org_id}/invitations:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
    get:
      tags: [Invitations]
      summary: List invitations (organization owner and admin)
      description: >-
        Status is pending, accepted, revoked, expired or invalid (the inviter lost the right to grant the roles
        before acceptance). Neither tokens nor token hashes are ever returned. Keyset paginated (id only).
        Workspace admins: 403; non-members: 404.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvitationPage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [Invitations]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Invite a person by delivery email or offline link
      description: >-
        Owners and admins may invite as admin or member (never owner), optionally with a workspace and any
        workspace role. A workspace admin may invite only as member, only into the own workspace, with at most
        editor, and only while the organization setting workspace_admin_invites_enabled is true (otherwise 403).
        With email delivery active, the outbox atomically sends the link and the response contains only the invited
        address; no account is created until the recipient opens the emailed link and sets a password. Without email
        delivery, the response preserves the one-time invite_url (`<PUBLIC_URL>/invite#token=<token>`). The link is
        valid for 72 hours, single use and revocable; only its SHA-256 is stored. One open
        invitation per organization and normalized address (409 INVITATION_PENDING), at most 1000 open invitations
        per organization (409 INVITATION_LIMIT), rate limited per user (429). 503 AUTH_UNAVAILABLE when
        CRAFTCLOUD_PUBLIC_URL is not configured. A workspace of another organization or an unknown workspace
        answers 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateInvitationRequest'}
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '201':
          description: Created with delivery disabled; one-time link shown
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedInvitation'}
        '202':
          description: Created and queued for delivery; no capability returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvitationDeliveryResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: INVITATION_PENDING or INVITATION_LIMIT
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /organizations/{org_id}/invitations/{invitation_id}:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
      - in: path
        name: invitation_id
        required: true
        schema: {type: string, format: uuid}
    delete:
      tags: [Invitations]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Revoke an open invitation
      description: >-
        Organization owners and admins may revoke any open invitation, a workspace admin only invitations they
        created. Unknown, foreign and already closed invitations answer 404.
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '204': {description: Revoked}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /organizations/{org_id}/invitations/{invitation_id}/resend:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
      - in: path
        name: invitation_id
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Invitations]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Rotate and resend an open invitation
      description: Rotates the capability and expiry atomically with the delivery outbox. Returns no token when delivery is active. Owners/admins may resend; workspace admins only invitations they create.
      responses:
        '202': {description: Queued, content: {application/json: {schema: {$ref: '#/components/schemas/InvitationDeliveryResponse'}}}}
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /projects/{project_id}/grants:
    get:
      tags: [Projects]
      summary: List active grants (workspace editor and higher)
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '200': {description: Active grants, content: {application/json: {schema: {type: object, required: [items, next_cursor], properties: {items: {type: array, items: {$ref: '#/components/schemas/Grant'}}, next_cursor: {type: [string, 'null']}}}}}}
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [Projects]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Grant project access to an organization member (409 PROJECT_DELETED for a trashed project)
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GrantCreateRequest'}
      responses:
        '201': {description: Grant created, content: {application/json: {schema: {$ref: '#/components/schemas/Grant'}}}}
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /files/{file_id}/grants:
    get:
      tags: [Files]
      summary: List active grants (workspace editor and higher)
      parameters: [{$ref: '#/components/parameters/FileId'}]
      responses:
        '200': {description: Active grants, content: {application/json: {schema: {type: object, required: [items, next_cursor], properties: {items: {type: array, items: {$ref: '#/components/schemas/Grant'}}, next_cursor: {type: [string, 'null']}}}}}}
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [Files]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Grant file access to an organization member (409 FILE_DELETED or PROJECT_DELETED for a trashed target)
      parameters: [{$ref: '#/components/parameters/FileId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GrantCreateRequest'}
      responses:
        '201': {description: Grant created, content: {application/json: {schema: {$ref: '#/components/schemas/Grant'}}}}
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /grants/{grant_id}:
    patch:
      tags: [Projects]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Change a grant role with an ETag precondition
      parameters:
        - {in: path, name: grant_id, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: If-Match, required: true, schema: {type: string, pattern: '^"grant-v[0-9]+"$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GrantChangeRequest'}
      responses:
        '200': {description: Updated grant, content: {application/json: {schema: {$ref: '#/components/schemas/Grant'}}}}
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {description: VERSION_CONFLICT, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '428': {description: PRECONDITION_REQUIRED, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      tags: [Projects]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Revoke a grant
      parameters: [{$ref: '#/components/parameters/GrantId'}]
      responses:
        '204': {description: Grant revoked}
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /files/{file_id}/lock:
    post:
      tags: [Files]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Acquire or renew the current session's (browser or device) edit lease
      parameters: [{$ref: '#/components/parameters/FileId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LockAcquireRequest'}
      responses:
        '200': {description: Lease acquired or renewed, content: {application/json: {schema: {$ref: '#/components/schemas/FileLock'}}}}
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: 'LOCK_NOT_SUPPORTED, FILE_DELETED or PROJECT_DELETED (target in the trash)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '423': {description: FILE_LOCKED, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      tags: [Files]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Release the current session's edit lease; admins may force release
      parameters:
        - {$ref: '#/components/parameters/FileId'}
        - {in: query, name: force, required: false, schema: {type: boolean}}
      responses:
        '204': {description: Lease released}
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: LOCK_NOT_SUPPORTED, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /organizations/{org_id}/shared-with-me:
    get:
      tags: [Files]
      summary: List active grants held by the current user in an organization
      parameters:
        - {$ref: '#/components/parameters/OrgId'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: Shared targets with minimal workspace and parent identity, content: {application/json: {schema: {$ref: '#/components/schemas/SharedWithMeResponse'}}}}
        '400': {description: 'INVALID_CURSOR or AMBIGUOUS_CREDENTIALS', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /invitations/accept:
    post:
      tags: [Invitations]
      security: []
      summary: Accept an invitation (token possession)
      description: >-
        Origin check like login; rate limited per client address (429). Every unusable token (unknown, malformed,
        expired, used, revoked, inviter no longer entitled, disabled target) answers an identical 400
        INVALID_INVITATION. For an address without account the body needs display_name and password (password policy
        incl. the e-mail local part; 422 VALIDATION_ERROR with details.fields otherwise): the account, the
        organization membership and the workspace role are created in one transaction and the caller is logged in
        (session cookie and csrf_token like login). For an existing account the caller must be logged in as exactly
        that account (anonymous: 401 LOGIN_REQUIRED; other account: 403 INVITATION_EMAIL_MISMATCH; with a cookie the
        CSRF header is required). An existing active member accepting an organization-only invitation gets 409
        ALREADY_MEMBER and the invitation stays open; with a workspace part the workspace role is added or raised,
        never lowered, and the organization role never changes. At acceptance the inviter's current roles are
        re-evaluated.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AcceptInvitationRequest'}
      responses:
        '200':
          description: Accepted; Set-Cookie only when an account was created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedInvitation'}
        '400':
          description: INVALID_INVITATION
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: LOGIN_REQUIRED (the address belongs to an existing account) or UNAUTHENTICATED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: INVITATION_EMAIL_MISMATCH or CSRF_FAILED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: ALREADY_MEMBER
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
components:
  parameters:
    OrgId:
      in: path
      name: org_id
      required: true
      schema: {type: string, format: uuid}
    ProjectId:
      in: path
      name: project_id
      required: true
      schema: {type: string, format: uuid}
    FileId:
      in: path
      name: file_id
      required: true
      schema: {type: string, format: uuid}
    GrantId:
      in: path
      name: grant_id
      required: true
      schema: {type: string, format: uuid}
    VersionId:
      in: path
      name: version_id
      required: true
      schema: {type: string, format: uuid}
    UploadId:
      in: path
      name: upload_id
      required: true
      schema: {type: string, format: uuid}
    Deleted:
      in: query
      name: deleted
      required: false
      schema: {type: boolean, default: false}
      description: List the trash (soft-deleted items) instead of the live ones.
    WorkspaceId:
      in: path
      name: workspace_id
      required: true
      schema: {type: string, format: uuid}
    Limit:
      in: query
      name: limit
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      description: Page size; values above 100 are clamped, 0 or non-numeric values answer 422.
    Cursor:
      in: query
      name: cursor
      required: false
      schema: {type: string}
      description: Opaque cursor from next_cursor of the previous page; bound to the listing and scope (400 INVALID_CURSOR otherwise).
    WorkspaceIdQuery:
      in: query
      name: workspace_id
      required: false
      schema: {type: string, format: uuid}
    UserIdQuery:
      in: query
      name: user_id
      required: false
      schema: {type: string, format: uuid}
    AuditAction:
      in: query
      name: action
      required: false
      schema: {type: string, pattern: '^[a-z0-9_.]{1,64}$'}
      description: Action code prefix; matches the code itself and every code below it (`member` matches `member.add`).
    AuditActor:
      in: query
      name: actor
      required: false
      schema: {type: string, format: uuid}
      description: Only events of this acting user.
    AuditTarget:
      in: query
      name: target
      required: false
      schema: {type: string, format: uuid}
      description: Only events about this object id.
    AuditWorkspace:
      in: query
      name: workspace
      required: false
      schema: {type: string, format: uuid}
    AuditResult:
      in: query
      name: result
      required: false
      schema: {type: string, enum: [success, denied, failed]}
    AuditFrom:
      in: query
      name: from
      required: false
      schema: {type: string, format: date-time}
      description: Events at or after this time (inclusive).
    AuditTo:
      in: query
      name: to
      required: false
      schema: {type: string, format: date-time}
      description: Events before this time (exclusive); must be after `from`.
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-craftcloud_session
      description: >-
        Browser session cookie: HttpOnly, Secure, SameSite=Lax, Path=/, no Domain. The name is
        __Host-craftcloud_session; only when CRAFTCLOUD_PUBLIC_URL is plain http on a loopback host
        (local development) the cookie is named craftcloud_session and has no Secure attribute. The value is
        a random 32-byte token (base64url); the server stores only its SHA-256 hash. Unsafe requests with a
        session cookie also need the X-CSRF-Token header (see csrfToken) and a matching Origin.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        Value of csrf_token from POST /auth/login or GET /auth/session. Required, together with a same-origin
        Origin header (or no Origin and a Sec-Fetch-Site other than cross-site), on every unsafe request
        authenticated by the session cookie. Failure: 403 CSRF_FAILED.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque ccd_at_ token
      description: >-
        AC-01 / ADR-0018: Authorization Bearer with an opaque ccd_at_ access token. Default lifetime 15 minutes.
        Accepted by the same actor and policy checks as cookie sessions. Bearer requests require neither
        X-CSRF-Token nor Origin. Cookie plus Bearer always answers 400 AMBIGUOUS_CREDENTIALS; query tokens
        are never accepted. Device revocation, password change/reset, account disable, logout-all and removal
        from the final organization revoke access immediately.
  schemas:
    TwoFactorStatus:
      type: object
      required: [enabled, available, recovery_codes_remaining]
      properties:
        enabled: {type: boolean}
        available: {type: boolean, description: Whether a current encryption key is available for enrollment}
        recovery_codes_remaining: {type: integer, minimum: 0, maximum: 10}
    TwoFactorSetupRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: {type: string, writeOnly: true}
    TwoFactorSetupResponse:
      type: object
      required: [secret, otpauth_url]
      properties:
        secret: {type: string, minLength: 32, maxLength: 32, description: Base32-encoded 160-bit secret for manual entry; never log or persist in browser storage}
        otpauth_url: {type: string, description: Render as a QR code locally in the browser; never send to a third-party service}
    TwoFactorConfirmRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
    SecondFactorProof:
      type: object
      additionalProperties: false
      properties:
        code: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
        recovery_code: {type: string, minLength: 10, maxLength: 10, writeOnly: true}
      oneOf:
        - required: [code]
        - required: [recovery_code]
    SecondFactorLoginRequest:
      type: object
      additionalProperties: false
      required: [challenge_id]
      properties:
        challenge_id: {type: string, writeOnly: true, description: Opaque single-use challenge; expires after five minutes and five failed attempts}
        code: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
        recovery_code: {type: string, minLength: 10, maxLength: 10, writeOnly: true}
      oneOf:
        - required: [code]
        - required: [recovery_code]
    TwoFactorDisableRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: {type: string, writeOnly: true}
        code: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
        recovery_code: {type: string, minLength: 10, maxLength: 10, writeOnly: true}
      oneOf:
        - required: [code]
        - required: [recovery_code]
    RecoveryCodesResponse:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          description: One-time display; download locally and keep offline. The server stores salted hashes only.
          items: {type: string, minLength: 10, maxLength: 10}
    IssuePasswordResetRequest:
      type: object
      additionalProperties: false
      properties:
        reset_two_factor: {type: boolean, default: false, description: Also clear TOTP and recovery codes atomically when issuing the reset link}
    DeviceLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, client_kind, client_id, device_name]
      properties:
        email: {type: string}
        password: {type: string, writeOnly: true}
        client_kind: {type: string, enum: [app, launcher, cli]}
        client_id: {type: string, pattern: '^[a-z0-9-]{1,32}$'}
        device_name: {type: string, description: Sanitized display name, stored with at most 64 characters}
    DeviceTokenResponse:
      type: object
      required: [access_token, access_expires_at, refresh_token, refresh_expires_at, device_session_id]
      properties:
        access_token: {type: string, pattern: '^ccd_at_[A-Za-z0-9_-]{43}$'}
        access_expires_at: {type: string, format: date-time}
        refresh_token: {type: string, pattern: '^ccd_rt_[A-Za-z0-9_-]{43}$'}
        refresh_expires_at: {type: string, format: date-time, description: Earliest of idle and absolute expiry}
        device_session_id: {type: string, format: uuid}
    DeviceLoginResponse:
      allOf:
        - {$ref: '#/components/schemas/DeviceTokenResponse'}
        - type: object
          required: [user]
          properties:
            user:
              type: object
              required: [user_id, email, display_name, instance_role]
              properties:
                user_id: {type: string, format: uuid}
                email: {type: string}
                display_name: {type: string}
                instance_role: {type: [string, 'null'], enum: [operator, null]}
    DeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            type: object
            required: [id, name, client_kind, client_id, created_at, last_used_at]
            properties:
              id: {type: string, format: uuid}
              name: {type: string, maxLength: 64}
              client_kind: {type: string, enum: [app, launcher, cli]}
              client_id: {type: string, pattern: '^[a-z0-9-]{1,32}$'}
              created_at: {type: string, format: date-time}
              last_used_at: {type: string, format: date-time}
    AuditEvent:
      type: object
      required: [id, created_at, last_at, count, org_id, actor_id, action, target, workspace_id, result, request_id, details]
      properties:
        id: {type: string, format: uuid}
        created_at: {type: string, format: date-time, description: When the event happened (first occurrence of an aggregated row).}
        last_at: {type: string, format: date-time, description: Latest occurrence; equals created_at for ordinary events.}
        count: {type: integer, minimum: 1, description: Occurrences folded into the row (aggregated denials and login failures).}
        org_id: {type: [string, 'null'], format: uuid, description: null for instance-level events.}
        actor_id: {type: [string, 'null'], format: uuid, description: null for the system (maintenance) and unknown accounts.}
        action: {type: string, example: member.add}
        target:
          type: [object, 'null']
          required: [type, id]
          properties:
            type: {type: [string, 'null'], example: user}
            id: {type: string, format: uuid}
        workspace_id: {type: [string, 'null'], format: uuid}
        result: {type: string, enum: [success, denied, failed]}
        request_id: {type: [string, 'null']}
        details:
          type: object
          description: >-
            Flat object of identifiers, fixed codes (such as a role), counters and flags. Never names, e-mail addresses,
            tokens, passwords, file content or IP addresses.
          additionalProperties:
            oneOf:
              - {type: string}
              - {type: integer}
              - {type: boolean}
    AuditEventPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/AuditEvent'}
        next_cursor: {type: [string, 'null']}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string, example: NOT_FOUND}
            message: {type: string}
            request_id: {type: [string, 'null']}
            details: {type: object}
    SetupCompleteRequest:
      type: object
      additionalProperties: false
      required: [bootstrap_token, email, display_name, password, organization]
      properties:
        bootstrap_token:
          type: string
          writeOnly: true
          minLength: 32
          description: Token from the operator-provided secret file.
        email:
          type: string
          maxLength: 320
          description: Trimmed and lowercased by the server; exactly one @, no whitespace or control characters.
        display_name: {type: string, minLength: 1, maxLength: 100}
        password:
          type: string
          writeOnly: true
          minLength: 12
          maxLength: 128
          description: Counted in characters. Must not equal the e-mail local part. Stored as an Argon2id hash.
        organization:
          type: object
          additionalProperties: false
          required: [name, slug]
          properties:
            name: {type: string, minLength: 1, maxLength: 100}
            slug: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$'}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string}
        password: {type: string, writeOnly: true}
    LoginResponse:
      type: object
      required: [user_id, csrf_token, expires_at]
      properties:
        user_id: {type: string, format: uuid}
        csrf_token: {type: string, description: Send as X-CSRF-Token on unsafe requests}
        expires_at: {type: string, format: date-time, description: Earliest of idle expiry from now and the absolute expiry}
    SessionInfo:
      type: object
      required: [user_id, email, email_verified, display_name, instance_role, csrf_token, created_at, expires_at]
      properties:
        user_id: {type: string, format: uuid}
        email: {type: string}
        email_verified: {type: boolean}
        display_name: {type: string}
        instance_role: {type: [string, 'null'], enum: [operator, null]}
        csrf_token: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    Organization:
      type: object
      required: [id, slug, name, role, version, workspace_admin_invites_enabled, require_two_factor, created_at]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        name: {type: string}
        role: {type: string, enum: [owner, admin, member, guest], description: The caller's role}
        version: {type: integer, minimum: 1}
        workspace_admin_invites_enabled: {type: boolean, description: Whether workspace admins may invite into their own workspace}
        require_two_factor: {type: boolean, description: Members without enabled TOTP must enroll before accessing this organization's resources}
        created_at: {type: string, format: date-time}
    CreatedOrganization:
      type: object
      required: [id, slug, name, owner_user_id, version, created_at]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        name: {type: string}
        owner_user_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
    MyOrganizationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Organization'}
        next_cursor: {type: [string, 'null']}
    OrganizationSummaryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            required: [id, slug, name, member_count, committed_bytes, reserved_bytes, quota_bytes, created_at]
            properties:
              id: {type: string, format: uuid}
              slug: {type: string}
              name: {type: string}
              member_count: {type: integer}
              committed_bytes: {type: integer, format: int64, minimum: 0}
              reserved_bytes: {type: integer, format: int64, minimum: 0}
              quota_bytes: {type: [integer, 'null'], format: int64, minimum: 0}
              created_at: {type: string, format: date-time}
        next_cursor: {type: [string, 'null']}
    Member:
      type: object
      required: [user_id, display_name, email, role, joined_at]
      properties:
        user_id: {type: string, format: uuid}
        display_name: {type: string}
        email: {type: string}
        role: {type: string, enum: [owner, admin, member, guest]}
        joined_at: {type: string, format: date-time}
    MemberPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            anyOf:
              - {$ref: '#/components/schemas/Member'}
              - {$ref: '#/components/schemas/AdminMember'}
        next_cursor: {type: [string, 'null']}
    AdminMember:
      allOf:
        - {$ref: '#/components/schemas/Member'}
        - type: object
          required: [status, account_disabled, two_factor_enabled]
          properties:
            status: {type: string, enum: [active, invited, disabled]}
            account_disabled: {type: boolean}
            two_factor_enabled: {type: boolean}
    GrantPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
