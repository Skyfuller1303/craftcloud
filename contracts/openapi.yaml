              type: object
              required: [owner, admin, member, guest]
              properties:
                owner: {type: integer, minimum: 0}
                admin: {type: integer, minimum: 0}
                member: {type: integer, minimum: 0}
                guest: {type: integer, minimum: 0}
        two_factor:
          type: object
          required: [active_members, enrolled]
          properties:
            active_members: {type: integer, minimum: 0}
            enrolled: {type: integer, minimum: 0}
        counts:
          type: object
          required: [workspaces, projects, files, active_locks, active_grants, pending_invitations]
          properties:
            workspaces: {type: integer, minimum: 0}
            projects: {type: integer, minimum: 0}
            files: {type: integer, minimum: 0}
            active_locks: {type: integer, minimum: 0}
            active_grants: {type: integer, minimum: 0}
            pending_invitations: {type: integer, minimum: 0}
        storage:
          type: object
          required: [used_bytes, committed_bytes, reserved_bytes, quota_bytes]
          properties:
            used_bytes: {type: integer, minimum: 0}
            committed_bytes: {type: integer, minimum: 0}
            reserved_bytes: {type: integer, minimum: 0}
            quota_bytes: {type: [integer, 'null'], minimum: 0}
        activity_daily:
          type: array
          minItems: 30
          maxItems: 30
          items:
            type: object
            required: [date, count]
            properties:
              date: {type: string, format: date}
              count: {type: integer, minimum: 0}
