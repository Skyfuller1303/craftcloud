        new_password: {type: string, writeOnly: true, minLength: 12, maxLength: 128}
    ResetLinkResponse:
      type: object
      required: [expires_at]
      properties:
        reset_url: {type: string, description: "Legacy mode only; shown once. Form: <public url>/reset-password#token=<token>"}
        sent_to: {type: string, format: email, description: "Delivery mode only; recipient address already supplied by operator"}
        expires_at: {type: string, format: date-time}
    EmailQueuedResponse:
      type: object
      required: [sent_to, expires_at]
      properties:
        sent_to: {type: string, format: email}
        expires_at: {type: string, format: date-time}
    EmailTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {type: string, writeOnly: true, description: Capability token from the link fragment}
    EmailRequestResponse:
      type: object
      required: [message]
      properties:
        message: {type: string}
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 320}
        password: {type: string, writeOnly: true}
        code: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
        recovery_code: {type: string, minLength: 10, maxLength: 10, writeOnly: true}
    EmailDeliveryStatus:
      type: object
      required: [configured, last_success_at, failed_count, suppressed_count]
      properties:
        configured: {type: boolean}
        last_success_at: {type: [string, 'null'], format: date-time}
        failed_count: {type: integer, format: int64, minimum: 0}
        suppressed_count:
          type: integer
          format: int64
          minimum: 0
          description: Security notices dropped by the per-recipient limit in the last seven days. The security action itself was not blocked.
    EmailVerificationBatchResponse:
      type: object
      required: [queued, next_cursor, limited, retry_after_seconds]
      properties:
        queued: {type: integer, minimum: 0}
        next_cursor: {type: [string, 'null'], format: uuid}
        limited: {type: boolean}
        retry_after_seconds: {type: [integer, 'null'], minimum: 1}
    Workspace:
      type: object
      required: [id, organization_id, slug, name, workspace_role, version, created_at]
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        slug: {type: string}
        name: {type: string}
        workspace_role: {type: [string, 'null'], enum: [admin, editor, viewer, null], description: "The caller's role in the workspace; null for organization managers without a grant"}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
    WorkspacePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Workspace'}
        next_cursor: {type: [string, 'null']}
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        slug: {type: string, description: 'Lowercase letters, digits and hyphens; unique within the organization'}
    UpdateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
    WorkspaceMember:
      type: object
      required: [user_id, display_name, email, role, joined_at]
      properties:
        user_id: {type: string, format: uuid}
        display_name: {type: string}
        email: {type: string}
        role: {type: string, enum: [admin, editor, viewer]}
        joined_at: {type: string, format: date-time}
    WorkspaceMemberPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/WorkspaceMember'}
        next_cursor: {type: [string, 'null']}
    AddWorkspaceMemberRequest:
      type: object
      additionalProperties: false
      required: [user_id, role]
      properties:
        user_id: {type: string, format: uuid}
        role: {type: string, enum: [admin, editor, viewer]}
    ChangeWorkspaceRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: {type: string, enum: [admin, editor, viewer]}
    Project:
      type: object
      required: [id, organization_id, workspace_id, name, version, created_by, created_at, updated_by, updated_at, deleted_at]
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 100}
        version: {type: integer, minimum: 1}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_by: {type: string, format: uuid}
        updated_at: {type: string, format: date-time}
        deleted_at: {type: [string, 'null'], format: date-time}
        can_share: {type: boolean, description: Server-calculated grant-management capability}
    ProjectPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
