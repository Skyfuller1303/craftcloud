            schema: {$ref: '#/components/schemas/UpdateFileRequest'}
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '200':
          description: Renamed
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "file-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/File'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '423': {description: FILE_LOCKED, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409':
