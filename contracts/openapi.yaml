openapi: 3.1.0
info:
  title: CraftCloud Core API — proposal sketch
  version: 0.0.0-rfc
  description: >-
    RFC EXAMPLE ONLY. Not deployed, not an upstream contract, deliberately incomplete. Contains only operations that the server implements (checked by crates/craftcloud-api/tests/contract.rs); upload and version endpoints are added with their features.
    Authorization details and full response schemas must be decided before implementation.
servers:
  - url: https://craftcloud.example.invalid/api/v1
security:
  - cookieAuth: []
tags:
  - name: Health
  - name: Setup
  - name: Auth
  - name: Admin
  - name: Organizations
  - name: Members
  - name: Discovery
  - name: Workspaces
  - name: Invitations
  - name: Projects
  - name: Files
  - name: Uploads
  - name: Versions
  - name: Quota
  - name: Audit
paths:
  /health/live:
    get:
      tags: [Health]
      security: []
      summary: Liveness only; no dependency details
      description: Path is relative to the server root, not /api/v1 (see CC-F15).
      servers:
        - url: https://craftcloud.example.invalid
      responses:
        '200': {description: Process is alive}
        '503': {$ref: '#/components/responses/Timeout'}
  /setup/status:
    get:
      tags: [Setup]
      security: []
      summary: Generic setup state without secrets (CC-F01)
      description: Reveals only whether setup is still required. Answers 503 SETUP_UNAVAILABLE when no database is configured or reachable.
      responses:
        '200':
          description: Setup state
          content:
            application/json:
              schema:
                type: object
                required: [setup_required]
                properties:
                  setup_required: {type: boolean}
        '500':
          description: Internal error (INTERNAL)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: SETUP_UNAVAILABLE (no database configured or reachable) or TIMEOUT
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /setup/complete:
    post:
      tags: [Setup]
      security: []
      summary: One-shot creation of the initial instance operator (CC-F01)
      description: >-
        Creates exactly one instance operator, one organization and the operator's owner membership in a
        single transaction. The bootstrap token comes from the file configured by the operator
        (CRAFTCLOUD_BOOTSTRAP_SECRET_FILE); the server never generates or prints one. No session is created.
        Order of checks: (1) 503 SETUP_UNAVAILABLE if no database is configured or reachable; (2) an
        unparsable body, unknown field or missing field (including a missing bootstrap_token) answers 422
        VALIDATION_ERROR without details, 415 or 413, before the token is looked at and independent of any
        state; (3) 403 INVALID_BOOTSTRAP_TOKEN for a wrong token and, identically, when no bootstrap secret
        is configured on the server (callers cannot tell the two apart; the reason is only logged), also
        independent of whether setup was completed; (4) 409 SETUP_ALREADY_COMPLETED, only for a valid
        token; (5) 422 VALIDATION_ERROR with details.fields for semantic field validation only. There is
        no rate limit on this route (tokens have at least 32 characters); a generic limiter follows with
        the session work.

        The request is subject to the global handler timeout (503 TIMEOUT) without exemption. If a request
        times out or the connection drops while the server was committing, setup may nevertheless have
        succeeded: the client must re-check GET /setup/status (setup_required false) before retrying.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetupCompleteRequest'}
      responses:
        '201':
          description: Initial operator and organization created; setup routes are closed afterwards
          content:
            application/json:
              schema:
                type: object
                required: [user_id, organization_id]
                properties:
                  user_id: {type: string, format: uuid}
                  organization_id: {type: string, format: uuid}
        '403':
          description: >-
            Wrong bootstrap token or no bootstrap secret configured (both INVALID_BOOTSTRAP_TOKEN, indistinguishable)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Setup already completed (SETUP_ALREADY_COMPLETED), only for a valid token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415':
          description: Content-Type is not application/json (UNSUPPORTED_MEDIA_TYPE)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: >-
            VALIDATION_ERROR. Without details when the body cannot be parsed (invalid JSON, unknown or missing
            field). With details.fields (invalid field names only, e.g. email, display_name, password,
            organization.name, organization.slug) for semantic field validation, which is only reached with a
            valid token. Values are never echoed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: Internal error (INTERNAL), for example a failed database operation or password hashing
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: >-
            SETUP_UNAVAILABLE (no database configured or reachable) or TIMEOUT (handler timeout; setup may
            have been committed, re-check GET /setup/status)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Log in with e-mail and password (CC-F02)
      description: >-
        Creates a session and sets the session cookie. Unknown e-mail, wrong password, accounts without a
        password and disabled accounts all answer an identical 401 INVALID_CREDENTIALS after the same amount
        of hashing work. Rate limits: requests per client address (IPv4 exact, IPv6 /64) and, counting only
        failed logins, per account and address (5 per 15 minutes) and per account over all addresses (50 per
        15 minutes); a successful login resets the counter of its address. Both answer 429 RATE_LIMITED with
        Retry-After, and unknown e-mail addresses behave exactly like registered ones. A login that presents a
        still valid session cookie revokes that old session. The session is only created if the password hash
        is still the verified one (a reset that commits meanwhile makes the login fail with 401). The Origin
        check applies (login CSRF); there is no CSRF token yet. No hard lockout.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Logged in; Set-Cookie carries the session cookie
          headers:
            Set-Cookie: {schema: {type: string}, description: Session cookie (see securitySchemes.cookieAuth)}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '403': {$ref: '#/components/responses/CsrfFailed'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/session:
    get:
      tags: [Auth]
      summary: Current session (CC-F02)
      description: Returns the authenticated account and the CSRF token. 401 UNAUTHENTICATED without a valid, unexpired, unrevoked session.
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionInfo'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/sessions:
    get:
      tags: [Auth]
      summary: List the own active sessions (device list)
      description: >-
        Active (not revoked, not expired) sessions of the current user, newest first, at most 100. Contains no
        network or device data (no IP address, no user agent) and never a token.
      responses:
        '200':
          description: Own active sessions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/sessions/{session_id}:
    delete:
      tags: [Auth]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Revoke one of the own sessions
      description: >-
        Only own sessions can be revoked. Another user's, unknown and already revoked sessions all answer 404.
        Revoking the current session also clears the cookie.
      parameters:
        - in: path
          name: session_id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Session revoked}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/CsrfFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/logout:
    post:
      tags: [Auth]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Log out the current session
      description: >-
        Revokes the session and clears the cookie. A 401 answer also carries a Set-Cookie that clears the
        stale cookie.
      responses:
        '204': {description: Logged out; Set-Cookie clears the session cookie}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/CsrfFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/logout-all:
    post:
      tags: [Auth]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Log out all sessions of the account
      description: Revokes every session of the account and clears the cookie (also on a 401 answer).
      responses:
        '204': {description: All sessions of the account revoked; the cookie is cleared}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/CsrfFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/password/change:
    post:
      tags: [Auth]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Change the own password
      description: >-
        Requires the current password (wrong: 403 INVALID_CURRENT_PASSWORD; rate limited to 5 per minute and
        user). Revokes all other sessions of the account and voids pending reset links; the current session
        stays valid. Policy violations of the new password answer 422 VALIDATION_ERROR with details.fields
        ["new_password"].
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses:
        '204': {description: Password changed}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: CSRF_FAILED or INVALID_CURRENT_PASSWORD
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/password-reset:
    post:
      tags: [Auth]
      security: []
      summary: Complete a password reset with a reset token
      description: >-
        Anonymous, rate limited per client address. Unknown, malformed, expired, used, voided and
        disabled-account tokens all answer an identical 400 INVALID_RESET_TOKEN. A valid token with a password
        that violates the policy answers 422 and stays usable. Success sets the password, consumes the token
        and revokes every session of the account. Tokens are single use and valid for one hour.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '204': {description: Password set; all sessions revoked}
        '400':
          description: INVALID_RESET_TOKEN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/users/{user_id}/password-reset:
    parameters:
      - in: path
        name: user_id
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Admin]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Issue a password reset link (instance operator only)
      description: >-
        Until the policy engine (PR-006) only the instance operator recorded by the one-time setup may call
        this (others: 403 FORBIDDEN). Issuing a link is a compromise response (ADR-0013): it immediately
        revokes every active session of the target account and voids older pending links of that account. The
        link is returned once; only a hash of its token is stored. The token sits in the URL fragment so it is
        not sent to servers or in Referer headers. Requires CRAFTCLOUD_PUBLIC_URL (otherwise 503
        AUTH_UNAVAILABLE). Disabled accounts: 409 ACCOUNT_DISABLED. Offline alternative:
        craftcloud-server admin issue-password-reset --email <address>.
      responses:
        '201':
          description: Reset link issued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResetLinkResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: CSRF_FAILED or FORBIDDEN (not the instance operator)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: ACCOUNT_DISABLED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      tags: [Admin]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Void pending password reset links (instance operator only)
      description: Voids every unused reset link of the account without touching its sessions. Idempotent.
      responses:
        '204': {description: Pending links voided (or none existed)}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: CSRF_FAILED or FORBIDDEN (not the instance operator)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /organizations:
    get:
      tags: [Organizations]
      summary: List the organizations the caller is a member of (CC-F04)
      description: >-
        Active memberships of the authenticated user, ordered by (created_at, id), keyset paginated. Cursors are
        opaque, bound to the listing and the user, and not signed (see api-conventions).
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MyOrganizationPage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [Organizations, Admin]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Create an organization (instance operator only)
      description: >-
        Creates the organization and the owner membership of owner_user_id (an existing, enabled user; may be the
        operator) in one transaction. Self-service creation does not exist (ADR-0013). Other callers: 403
        FORBIDDEN. Invalid name/slug, unknown or disabled owner and a taken slug answer 422 VALIDATION_ERROR with
        details.fields.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOrganizationRequest'}
      responses:
        '201':
          description: Created
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "org-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedOrganization'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: CSRF_FAILED or FORBIDDEN (not the instance operator)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /organizations/{org_id}:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
    get:
      tags: [Organizations]
      summary: Read an organization (members only)
      description: >-
        Non-members, the instance operator without membership and unknown ids all answer an identical 404
        NOT_FOUND (no existence leak). The ETag is the version for PATCH.
      responses:
        '200':
          description: The organization with the caller's role
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    patch:
      tags: [Organizations]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Rename an organization (owner and admin)
      description: >-
        Order of checks: authentication and CSRF, 404 (not a member), 403 FORBIDDEN (plain member), 422 invalid
        name, 428 PRECONDITION_REQUIRED without If-Match, 412 VERSION_CONFLICT if the If-Match ETag is not the
        current version (the current ETag is returned in the response header).
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: {type: string, example: '"org-v1"'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateOrganizationRequest'}
      responses:
        '200':
          description: Updated; the new ETag is in the header
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412':
          description: VERSION_CONFLICT
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '428':
          description: PRECONDITION_REQUIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /organizations/{org_id}/members:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
    get:
      tags: [Members]
      summary: List the members of an organization (any member)
      description: >-
        Ordered by join time and user id (stable, keyset paginated); cursors contain only a timestamp and ids, never
        names or e-mail addresses. Only active members are listed. Non-members and unknown organizations answer 404.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberPage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [Members]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Add an existing user as member (owner and admin)
      description: >-
        Owners may assign any role; admins only member and admin, never owner (403). Plain members: 403,
        non-members: 404. An unknown user id answers 404 only after the permission check passed (no user
        enumeration for others); an already active membership answers 409 ALREADY_MEMBER, a disabled account
        409 ACCOUNT_DISABLED. An invited or disabled membership row is reactivated with the given role. People without an account are onboarded by invitation (POST /organizations/{org_id}/invitations).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddMemberRequest'}
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: ALREADY_MEMBER or ACCOUNT_DISABLED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /organizations/{org_id}/members/{user_id}:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
      - in: path
        name: user_id
        required: true
        schema: {type: string, format: uuid}
    patch:
      tags: [Members]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Change a member's role (owner and admin)
      description: >-
        Owners may set any role. Admins may set member/admin on members and admins (including themselves) and never
        touch owners (403). The last *enabled* owner cannot be demoted (409 LAST_OWNER; owners whose account is
        disabled do not count); membership changes and renames of one organization are serialized so concurrent
        requests cannot leave it without an owner. Only active members can be changed. An unknown target is
        404 for owners and admins and 403 for plain members.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeRoleRequest'}
      responses:
        '200':
          description: Role changed (or already set)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: LAST_OWNER
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      tags: [Members]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Remove a member or leave the organization
      description: >-
        Owners may remove anybody, admins members and admins (not owners), and every member may remove themselves
        (leave). The user's workspace grants in the organization are removed with the membership. The last owner
        cannot be removed (409 LAST_OWNER). A membership row of any status (also invited or disabled) can be removed.
      responses:
        '204': {description: Removed}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: LAST_OWNER
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/organizations:
    get:
      tags: [Admin, Organizations]
      summary: Organization metadata of the whole instance (operator only)
      description: >-
        Id, slug, name, creation time and member count only: no member lists, no user data, no files. The operator
        has no access to organization contents through this route.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationSummaryPage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/maintenance:
    get:
      tags: [Admin]
      summary: Status of the maintenance job (operator only)
      description: >-
        The newest finished maintenance run: trigger (`scheduled` for the loop inside the server, `cli` for
        `craftcloud-server admin maintenance`), start and end time, duration, the counts per step and the error codes
        of steps that failed (`DATABASE_ERROR`). `last_run` is null until a run has finished; dry runs are not recorded.
        The report contains counts and error codes only: no organization, file, user or storage data. Other callers: 403.
      responses:
        '200':
          description: The status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MaintenanceStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/audit:
    get:
      tags: [Audit]
      summary: List the instance-level audit events (operator only)
      description: >-
        Events that belong to no organization (setup, logins and login failures, operator actions, storage binding, maintenance). Organization events are not included: the operator has no implicit access to tenant data. Append-only record of security-relevant actions: who (`actor_id`), what (`action`, a stable dotted code such as `member.add`), to which object (`target`), where (`workspace_id`), with which `result` (`success`, `denied`, `failed`) and the `request_id` of the request. Events contain identifiers and codes only: no names, e-mail addresses, tokens, passwords, file content or IP addresses (ADR-0016). Filters combine with AND: `action` matches the code and everything below it (`member` matches `member.add`), `from` is inclusive and `to` exclusive (RFC 3339). Keyset paginated by (time, id), newest first; equal timestamps keep a stable order; the cursor is bound to this listing. Denied requests and login failures are aggregated: one row per actor, action and 15-minute window with a `count`. Other callers: 403.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/AuditAction'}
        - {$ref: '#/components/parameters/AuditActor'}
        - {$ref: '#/components/parameters/AuditTarget'}
        - {$ref: '#/components/parameters/AuditWorkspace'}
        - {$ref: '#/components/parameters/AuditResult'}
        - {$ref: '#/components/parameters/AuditFrom'}
        - {$ref: '#/components/parameters/AuditTo'}
      responses:
        '200':
          description: One page, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditEventPage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/audit/export:
    get:
      tags: [Audit]
      summary: Export the instance-level audit events as NDJSON (operator only)
      description: >-
        Like the organization export, for the instance-level events. Other callers: 403.
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/AuditAction'}
        - {$ref: '#/components/parameters/AuditActor'}
        - {$ref: '#/components/parameters/AuditTarget'}
        - {$ref: '#/components/parameters/AuditWorkspace'}
        - {$ref: '#/components/parameters/AuditResult'}
        - {$ref: '#/components/parameters/AuditFrom'}
        - {$ref: '#/components/parameters/AuditTo'}
      responses:
        '200':
          description: One NDJSON line per event, newest first
          headers:
            X-Content-Type-Options: {schema: {type: string, enum: [nosniff]}}
            Content-Disposition: {schema: {type: string}, description: 'attachment; filename="audit.ndjson"'}
          content:
            application/x-ndjson:
              schema: {$ref: '#/components/schemas/AuditEvent'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/users:
    get:
      tags: [Admin]
      summary: List the accounts of the instance (operator only)
      description: >-
        Instance-level account metadata, no organization data: id, address, display name, creation time, disabled flag,
        email_verified and, for accounts created by an invitation, the origin (organization, inviting user, invitation).
        email_verified is false for every account until an e-mail verification flow exists (also for the setup
        operator). Use `?unverified=true` to list accounts without verified address. This is the operator's tool
        against account squatting: an inviter who accepts their own link creates an instance-wide account for an
        address they may not own; the operator can see who created it and disable it
        (POST /admin/users/{user_id}/disable); recovery for the real owner of the address is a manual operator
        procedure (see the deployment guide). Keyset paginated
        (creation time, id; the cursor is bound to the filter and contains no personal data). Other callers: 403.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - in: query
          name: unverified
          required: false
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUserPage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/users/{user_id}/disable:
    post:
      tags: [Admin]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Disable an account (operator only)
      description: >-
        Revokes every session of the account, voids its pending reset links and refuses further logins. Idempotent.
        The instance operator cannot be disabled (409 CANNOT_DISABLE_OPERATOR). Memberships stay, so enabling the
        account restores access. Disabling is never blocked by the last-owner rule (a security response must not be
        blocked): the 200 response lists the organizations that are left without an enabled owner
        (orphaned_organization_ids, empty if none); the server logs a warning and the host operator can recover them
        with `craftcloud-server admin set-org-owner --org <slug> --email <address>`.
      parameters:
        - {in: path, name: user_id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Disabled (or already disabled); lists organizations without an enabled owner
          content:
            application/json:
              schema:
                type: object
                required: [orphaned_organization_ids]
                properties:
                  orphaned_organization_ids:
                    type: array
                    maxItems: 1000
                    items: {type: string, format: uuid}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: CANNOT_DISABLE_OPERATOR
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/users/{user_id}/enable:
    post:
      tags: [Admin]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Enable an account (operator only)
      description: Idempotent. Earlier sessions stay revoked.
      parameters:
        - {in: path, name: user_id, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Enabled (or already enabled)}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /info:
    get:
      tags: [Discovery]
      security: []
      summary: Discover supported server/API capabilities
      responses:
        '200':
          description: Server capabilities
          content:
            application/json:
              schema:
                type: object
                required: [api_version, features, server_mode]
                properties:
                  api_version: {type: string, example: '1.0'}
                  features:
                    type: array
                    items:
                      type: string
                      pattern: '^[a-z0-9._-]+$'
                      minLength: 1
                      maxLength: 64
                  server_mode:
                    type: string
                    enum: [development-prototype]
                    description: >-
                      Additive field (PR-001). `development-prototype` marks a local, non-production
                      server. Clients must treat unknown values as a controlled fallback, not an error.
        '503': {$ref: '#/components/responses/Timeout'}
  /organizations/{org_id}/workspaces:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
    get:
      tags: [Workspaces]
      summary: List the workspaces of an organization the caller may see
      description: >-
        Organization owners and admins see every workspace of the organization, other members only the workspaces
        they belong to (workspace_role is the caller's role there, null for managers without a grant). Keyset
        paginated (creation time, id). Non-members and unknown organizations answer 404.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspacePage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [Workspaces]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Create a workspace (organization owner and admin)
      description: >-
        Other members: 403, non-members and unknown organizations: 404. Invalid name/slug or a taken slug answer 422
        VALIDATION_ERROR with details.fields. There is no workspace deletion in this phase (see docs/gaps.md).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWorkspaceRequest'}
      responses:
        '201':
          description: Created
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "ws-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /workspaces/{workspace_id}:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
    get:
      tags: [Workspaces]
      summary: Get a workspace (organization owner/admin or workspace member)
      description: >-
        The organization is taken from the workspace, never from the client. Unknown ids, workspaces of other
        organizations and workspaces the caller may not see are indistinguishable: 404.
      responses:
        '200':
          description: The workspace
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "ws-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    patch:
      tags: [Workspaces]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Rename a workspace (workspace admin, organization owner and admin)
      description: >-
        Requires If-Match with the current ETag (428 PRECONDITION_REQUIRED without, 412 VERSION_CONFLICT with a stale
        value; the response carries the current ETag). Workspace editors and viewers: 403; callers who cannot see
        the workspace: 404.
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateWorkspaceRequest'}
      responses:
        '200':
          description: Updated; the new ETag is in the header
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "ws-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412':
          description: VERSION_CONFLICT
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '428':
          description: PRECONDITION_REQUIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /workspaces/{workspace_id}/members:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
    get:
      tags: [Workspaces]
      summary: List the members of a workspace (workspace members, organization owner and admin)
      description: >-
        Keyset paginated (join time, user id). Callers who cannot see the workspace answer 404.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceMemberPage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [Workspaces]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Add an organization member to a workspace
      description: >-
        Organization owners and admins may assign any workspace role. A workspace admin may assign editor and viewer
        only (403 for admin) and only in the own workspace. Editors and viewers: 403. The user must be an active,
        enabled member of the workspace's organization; any other or unknown user id answers 404 (no enumeration).
        An existing workspace membership answers 409 ALREADY_MEMBER.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddWorkspaceMemberRequest'}
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceMember'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: ALREADY_MEMBER
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /workspaces/{workspace_id}/members/{user_id}:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - in: path
        name: user_id
        required: true
        schema: {type: string, format: uuid}
    patch:
      tags: [Workspaces]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Change a workspace role
      description: >-
        Organization owners and admins may set any role. A workspace admin may set editor/viewer on editors and
        viewers; it never touches workspace admins (including itself): 403. Editors and viewers: 403. An unknown
        target is 404 for managers and 403 for editors and viewers.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeWorkspaceRoleRequest'}
      responses:
        '200':
          description: Role changed (or already set)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceMember'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      tags: [Workspaces]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Remove a workspace member or leave the workspace
      description: >-
        Same limits as the role change; every member may remove themselves (leave), including workspace admins.
      responses:
        '204': {description: Removed}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /workspaces/{workspace_id}/projects:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
    get:
      tags: [Projects]
      summary: List the projects of a workspace (workspace members, organization owner and admin)
      description: >-
        Live projects, or with `deleted=true` the trash. Keyset paginated by creation time and id; the cursor holds
        timestamp and id only and is bound to the workspace and the `deleted` switch (400 INVALID_CURSOR otherwise).
        Callers who cannot see the workspace answer 404.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Deleted'}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectPage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [Projects]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Create a project (organization owner/admin, workspace admin and editor)
      description: >-
        Viewers: 403; callers who cannot see the workspace: 404. The name follows the display-name rules after NFC
        normalization (422 VALIDATION_ERROR with details.fields ["name"]) and is unique among the live projects of
        the workspace by its NFC and case-folded form (409 PROJECT_NAME_TAKEN).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProjectRequest'}
      responses:
        '201':
          description: Created
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "prj-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: PROJECT_NAME_TAKEN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /projects/{project_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      tags: [Projects]
      summary: Get a project (also one in the trash)
      description: >-
        The workspace and organization come from the project row. Unknown ids, ids of other tenants and projects in
        workspaces the caller cannot see are indistinguishable: 404.
      responses:
        '200':
          description: The project
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "prj-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    patch:
      tags: [Projects]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Rename a project (organization owner/admin, workspace admin and editor)
      description: >-
        Requires If-Match (428 PRECONDITION_REQUIRED without, 412 VERSION_CONFLICT with a stale or malformed value; the
        response carries the current ETag). A project in the trash answers 409 PROJECT_DELETED, a taken name
        409 PROJECT_NAME_TAKEN.
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProjectRequest'}
      responses:
        '200':
          description: Renamed
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "prj-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: PROJECT_NAME_TAKEN or PROJECT_DELETED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '412':
          description: VERSION_CONFLICT
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '428':
          description: PRECONDITION_REQUIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      tags: [Projects]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Move a project to the trash (organization owner/admin and workspace admin)
      description: >-
        Soft delete; idempotent (an already deleted project answers 204 and is not changed). Editors and viewers: 403.
        The files stay with the project; a project in the trash is read-only. Restorable for the retention period
        (`CRAFTCLOUD_TRASH_RETENTION_DAYS`, default 30); nothing is purged yet.
      responses:
        '204': {description: In the trash}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /projects/{project_id}/restore:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    post:
      tags: [Projects]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Restore a project from the trash (organization owner/admin and workspace admin)
      description: >-
        Within the retention period only (410 RETENTION_EXPIRED afterwards); 409 PROJECT_NAME_TAKEN when a live
        project took the name meanwhile. Restoring a live project changes nothing (200).
      responses:
        '200':
          description: Restored
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "prj-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: PROJECT_NAME_TAKEN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '410':
          description: RETENTION_EXPIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /projects/{project_id}/files:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      tags: [Files]
      summary: List the file metadata of a project (workspace members, organization owner and admin)
      description: >-
        Live files, or with `deleted=true` the trash. Keyset paginated by creation time and id; the cursor is bound to
        the project and the `deleted` switch. Callers who cannot see the workspace: 404.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Deleted'}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FilePage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [Files]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Create file metadata (organization owner/admin, workspace admin and editor)
      description: >-
        Metadata only; contents and versions follow with the upload feature. The name is untrusted display metadata,
        never used as a path: NFC-normalized, 1 to 255 bytes, no control characters (including NUL), none of
        `/ \ : * ? " < > |`, not `.` or `..`, no leading or trailing whitespace, no trailing dot, no invisible format
        or bidirectional characters, no Windows device names (CON, PRN, AUX, NUL, COM1-9, LPT1-9, with any
        extension). Invalid names answer 422 with details.fields ["name"]. Names are unique among the live files of
        the project by their NFC and case-folded form (409 FILE_NAME_TAKEN). `app` matches `^[a-z0-9-]{1,32}$`,
        `format` matches `^[a-z0-9.+-]{1,64}$`. A project in the trash answers 409 PROJECT_DELETED.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateFileRequest'}
      responses:
        '201':
          description: Created
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "file-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/File'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: FILE_NAME_TAKEN or PROJECT_DELETED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /files/{file_id}:
    parameters:
      - {$ref: '#/components/parameters/FileId'}
    get:
      tags: [Files]
      summary: Get file metadata (also one in the trash)
      description: >-
        Organization, workspace and project come from the file row. Unknown ids, ids of other tenants, ids of other
        kinds (a project id) and files in workspaces the caller cannot see are indistinguishable: 404.
      responses:
        '200':
          description: The file metadata
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "file-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/File'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    patch:
      tags: [Files]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Rename a file (organization owner/admin, workspace admin and editor)
      description: >-
        Requires If-Match (428 without, 412 VERSION_CONFLICT with a stale or malformed value; the response carries the
        current ETag). A file in the trash answers 409 FILE_DELETED, a file of a project in the trash 409
        PROJECT_DELETED, a taken name 409 FILE_NAME_TAKEN. App and format cannot be changed.
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateFileRequest'}
      responses:
        '200':
          description: Renamed
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "file-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/File'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: FILE_NAME_TAKEN, FILE_DELETED or PROJECT_DELETED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '412':
          description: VERSION_CONFLICT
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '428':
          description: PRECONDITION_REQUIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      tags: [Files]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Move a file to the trash (organization owner/admin, workspace admin and editor)
      description: >-
        Soft delete; idempotent. Restorable for the retention period; nothing is purged yet. Viewers: 403. A file of
        a project in the trash answers 409 PROJECT_DELETED.
      responses:
        '204': {description: In the trash}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: PROJECT_DELETED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /files/{file_id}/restore:
    parameters:
      - {$ref: '#/components/parameters/FileId'}
    post:
      tags: [Files]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Restore a file from the trash (organization owner/admin, workspace admin and editor)
      description: >-
        Within the retention period only (410 RETENTION_EXPIRED afterwards); 409 FILE_NAME_TAKEN when a live file took
        the name meanwhile; 409 PROJECT_DELETED when the project is in the trash. Restoring a live file changes
        nothing (200).
      responses:
        '200':
          description: Restored
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "file-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/File'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: FILE_NAME_TAKEN or PROJECT_DELETED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '410':
          description: RETENTION_EXPIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /files/{file_id}/uploads:
    parameters:
      - {$ref: '#/components/parameters/FileId'}
    post:
      tags: [Uploads]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Create an upload session and reserve its quota (organization owner/admin, workspace admin and editor)
      description: >-
        Declares size and SHA-256 of the content that will follow with `PUT /uploads/{upload_id}/content`. Reserves
        the size against the workspace and organization quota (413 QUOTA_EXCEEDED; the message never names other
        workspaces) and checks the maximum file size of the server (413 PAYLOAD_TOO_LARGE). At most 10 open sessions per
        user and 200 per organization (409 UPLOAD_LIMIT). The session expires after `CRAFTCLOUD_UPLOAD_TTL_HOURS` (default
        24). The optional `Idempotency-Key` header (1 to 128 visible ASCII characters) makes a repeated request with the
        same file, size and hash return the same session (200); the same key with another request answers 409
        IDEMPOTENCY_KEY_REUSED. Viewers: 403; callers who cannot see the workspace: 404. A file or project in the trash
        answers 409 FILE_DELETED / PROJECT_DELETED. 503 STORAGE_UNAVAILABLE when no storage directory is configured.
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUploadRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Upload'}
        '200':
          description: Replay of an earlier request with the same Idempotency-Key
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Upload'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: UPLOAD_LIMIT, IDEMPOTENCY_KEY_REUSED, FILE_DELETED or PROJECT_DELETED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413':
          description: PAYLOAD_TOO_LARGE (above the maximum file size) or QUOTA_EXCEEDED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /uploads/{upload_id}:
    parameters:
      - {$ref: '#/components/parameters/UploadId'}
    get:
      tags: [Uploads]
      summary: Read an upload session (creator, workspace admin, organization owner/admin)
      description: >-
        An open session past its expiry is closed first (state `expired`). Unknown ids, ids of other tenants and
        sessions in workspaces the caller cannot see are indistinguishable: 404. Other members of the workspace: 403.
      responses:
        '200':
          description: The session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Upload'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      tags: [Uploads]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Abort an upload session (creator, workspace admin, organization owner/admin)
      description: >-
        Releases the reservation; a stored but uncommitted blob becomes orphaned (removed later by the cleanup job).
        Idempotent for closed sessions. While content is being received: 409 UPLOAD_IN_PROGRESS; after a commit:
        409 UPLOAD_CLOSED.
      responses:
        '204': {description: Aborted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: UPLOAD_IN_PROGRESS or UPLOAD_CLOSED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /uploads/{upload_id}/content:
    parameters:
      - {$ref: '#/components/parameters/UploadId'}
    put:
      tags: [Uploads]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Send the content of an upload (the creator, while still editor or better)
      description: >-
        Raw body (any content type), streamed into object storage. There is no global body limit or handler timeout on
        this route; instead the body is capped at the declared size (413 PAYLOAD_TOO_LARGE), a read that stalls for
        60 seconds cancels the upload (408 REQUEST_TIMEOUT), the whole transfer ends when the session expires (410
        UPLOAD_EXPIRED), after a grace period of 5 minutes an average rate below 16 KiB/s is cancelled (408
        REQUEST_TIMEOUT), and a short body is 422 LENGTH_MISMATCH. Verification, publishing and recording continue on
        the server even if the client disconnects at that point. The SHA-256 is
        computed while streaming and compared with the declared one (422 CHECKSUM_MISMATCH). Only one request can
        send content (409 UPLOAD_IN_PROGRESS); a session that failed, was aborted or has stored its content cannot be
        resumed (409 UPLOAD_CLOSED, expired: 410 UPLOAD_EXPIRED); create a new session instead. A full device answers
        507 INSUFFICIENT_STORAGE, missing storage 503 STORAGE_UNAVAILABLE. Every failure releases the reservation. After
        the bytes are stored the server checks again with fresh roles that the caller may still write and that
        file and project still exist; otherwise the stored object is deleted again (403/404, 409 FILE_DELETED). Success
        leaves a verified but uncommitted blob (state `stored`); making it a file version is a separate step.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: Stored; the response shows state `stored`
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Upload'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '400':
          description: UPLOAD_INTERRUPTED (the body ended with an error)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '408':
          description: REQUEST_TIMEOUT (the body stalled)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: UPLOAD_IN_PROGRESS, UPLOAD_CLOSED, FILE_DELETED or PROJECT_DELETED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '410':
          description: UPLOAD_EXPIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413':
          description: PAYLOAD_TOO_LARGE (more bytes than declared)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: LENGTH_MISMATCH or CHECKSUM_MISMATCH
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '507':
          description: INSUFFICIENT_STORAGE
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /organizations/{org_id}/usage:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
    get:
      tags: [Quota]
      summary: Storage quota and usage of an organization and its workspaces (organization owner and admin)
      description: >-
        `reserved_bytes` are held by open uploads and stored but uncommitted blobs, `committed_bytes` by file versions.
        `quota_bytes` null means unlimited. Workspaces are keyset paginated (creation time, id). Other members: 403;
        non-members: 404.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Usage
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsagePage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /organizations/{org_id}/audit:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
    get:
      tags: [Audit]
      summary: List the audit events of an organization (organization owner and admin)
      description: >-
        Append-only record of security-relevant actions: who (`actor_id`), what (`action`, a stable dotted code such as `member.add`), to which object (`target`), where (`workspace_id`), with which `result` (`success`, `denied`, `failed`) and the `request_id` of the request. Events contain identifiers and codes only: no names, e-mail addresses, tokens, passwords, file content or IP addresses (ADR-0016). Filters combine with AND: `action` matches the code and everything below it (`member` matches `member.add`), `from` is inclusive and `to` exclusive (RFC 3339). Keyset paginated by (time, id), newest first; equal timestamps keep a stable order; the cursor is bound to this listing. Denied requests and login failures are aggregated: one row per actor, action and 15-minute window with a `count`. Organization members without these roles: 403; non-members and other tenants: 404. The instance operator has no implicit access.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/AuditAction'}
        - {$ref: '#/components/parameters/AuditActor'}
        - {$ref: '#/components/parameters/AuditTarget'}
        - {$ref: '#/components/parameters/AuditWorkspace'}
        - {$ref: '#/components/parameters/AuditResult'}
        - {$ref: '#/components/parameters/AuditFrom'}
        - {$ref: '#/components/parameters/AuditTo'}
      responses:
        '200':
          description: One page, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditEventPage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /organizations/{org_id}/audit/export:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
    get:
      tags: [Audit]
      summary: Export the audit events of an organization as NDJSON (organization owner and admin)
      description: >-
        Streams the events selected by the same filters as the listing, one JSON object (the `AuditEvent` of the listing) per line, with bounded memory and at most 100000 events per request. If more match, the last line is a JSON object with `truncated: true` and a `next_cursor`; pass that cursor to continue. The export itself is recorded as an `audit.export` event (best-effort). Same access rules as the listing.
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/AuditAction'}
        - {$ref: '#/components/parameters/AuditActor'}
        - {$ref: '#/components/parameters/AuditTarget'}
        - {$ref: '#/components/parameters/AuditWorkspace'}
        - {$ref: '#/components/parameters/AuditResult'}
        - {$ref: '#/components/parameters/AuditFrom'}
        - {$ref: '#/components/parameters/AuditTo'}
      responses:
        '200':
          description: One NDJSON line per event, newest first
          headers:
            X-Content-Type-Options: {schema: {type: string, enum: [nosniff]}}
            Content-Disposition: {schema: {type: string}, description: 'attachment; filename="audit.ndjson"'}
          content:
            application/x-ndjson:
              schema: {$ref: '#/components/schemas/AuditEvent'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /workspaces/{workspace_id}/quota:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
    put:
      tags: [Quota]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Set the storage quota of a workspace (organization owner and admin)
      description: >-
        `quota_bytes` is required: a number of bytes or null for unlimited. A value above the organization quota is
        422. Lowering a quota never deletes data; it only blocks new reservations. Workspace admins: 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuotaRequest'}
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuotaResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/organizations/{org_id}/quota:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
    put:
      tags: [Quota, Admin]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Set the storage quota of an organization (instance operator only)
      description: >-
        `quota_bytes` is required: a number of bytes or null for unlimited. Existing data is never deleted by a lower
        quota. Other callers: 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuotaRequest'}
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuotaResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /files/{file_id}/versions:
    parameters:
      - {$ref: '#/components/parameters/FileId'}
    get:
      tags: [Versions]
      summary: List the versions of a file, newest first (workspace members, organization owner and admin)
      description: >-
        Keyset paginated by version number (the cursor holds only the number and is bound to the file). Callers who
        cannot see the workspace: 404.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VersionPage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [Versions]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Commit a stored upload as the next version (compare-and-set)
      description: >-
        Needs `If-None-Match: *` for the first version or `If-Match: "version:<uuid>"` with the current head (the
        content ETag, not the metadata ETag `"file-v<n>"`); neither: 428 PRECONDITION_REQUIRED, both: 422. `If-Match: *`, lists of
        tags and weak tags (`W/`) are 422 VALIDATION_ERROR, not preconditions. A head that
        differs, or a file that already has a version when `If-None-Match: *` is sent: 412 VERSION_CONFLICT with
        `details.current_version_id` and the current ETag header (ADR-0009); the upload stays stored and can be
        rebased, or committed with `If-None-Match: *` to another file of the same workspace (a copy). Only the creator
        of the upload may commit it, and only while still editor or better (others who see the workspace: 403;
        otherwise 404); roles are read fresh in the locking transaction. The upload must be `stored` and unexpired
        (409 UPLOAD_INCOMPLETE / UPLOAD_CLOSED, 410 UPLOAD_EXPIRED); file or project in the trash: 409. A commit moves
        the reserved bytes to committed (once). Retrying a finished commit with the same upload returns the same version
        with 200 whatever the preconditions are (the upload id is the idempotency token); an `Idempotency-Key` header, if
        sent, must equal the one the upload was created with (409 IDEMPOTENCY_KEY_REUSED). A quota lowered after the
        reservation does not cancel it. Moves the metadata ETag of the file too.
      parameters:
        - in: header
          name: If-Match
          required: false
          schema: {type: string}
          description: The content ETag of the current head
        - in: header
          name: If-None-Match
          required: false
          schema: {type: string}
          description: The value `*` for the first version
        - in: header
          name: Idempotency-Key
          required: false
          schema: {type: string}
          description: Must match the key of the upload when sent
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommitVersionRequest'}
      responses:
        '201':
          description: Committed
          headers:
            ETag: {schema: {type: string}, description: 'Content ETag "version:<uuid>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Version'}
        '200':
          description: Replay of an earlier commit of the same upload
          headers:
            ETag: {schema: {type: string}, description: 'Content ETag "version:<uuid>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Version'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: UPLOAD_INCOMPLETE, UPLOAD_CLOSED, FILE_DELETED, PROJECT_DELETED or IDEMPOTENCY_KEY_REUSED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '410':
          description: UPLOAD_EXPIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '412':
          description: VERSION_CONFLICT (details.current_version_id)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '428':
          description: PRECONDITION_REQUIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /files/{file_id}/versions/{version_id}:
    parameters:
      - {$ref: '#/components/parameters/FileId'}
      - {$ref: '#/components/parameters/VersionId'}
    get:
      tags: [Versions]
      summary: Get one version (workspace members, organization owner and admin)
      description: Unknown ids, versions of other files or tenants and callers who cannot see the workspace are indistinguishable (404).
      responses:
        '200':
          description: The version
          headers:
            ETag: {schema: {type: string}, description: 'Content ETag "version:<uuid>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Version'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /files/{file_id}/versions/{version_id}/restore:
    parameters:
      - {$ref: '#/components/parameters/FileId'}
      - {$ref: '#/components/parameters/VersionId'}
    post:
      tags: [Versions]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Make an older version the head again, as a new version (editor and better)
      description: >-
        Creates a new version that references the blob of the old one (`restored_from_version_id`); no new bytes are
        stored or counted. Requires `If-Match` with the current head (428 without, 422 with `If-None-Match`, 412 when
        stale). The old versions stay. A blob that failed verification answers 500 BLOB_CORRUPT. File or project in the
        trash: 409.
      parameters:
        - in: header
          name: If-Match
          required: false
          schema: {type: string}
          description: The content ETag of the current head
      responses:
        '201':
          description: Restored as a new version
          headers:
            ETag: {schema: {type: string}, description: 'Content ETag "version:<uuid>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Version'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: FILE_DELETED or PROJECT_DELETED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '412':
          description: VERSION_CONFLICT
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '428':
          description: PRECONDITION_REQUIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: BLOB_CORRUPT or INTERNAL
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
  /files/{file_id}/content:
    parameters:
      - {$ref: '#/components/parameters/FileId'}
    get:
      tags: [Versions]
      summary: Download the head version
      description: >-
        Streams the content with bounded memory. The caller's roles are re-checked for this request (viewers and better; others 404). The response is always `application/octet-stream` with `X-Content-Type-Options: nosniff`, `Content-Security-Policy: sandbox`, `Cache-Control: no-store`, an attachment disposition built from a sanitized name (ASCII fallback plus RFC 5987 `filename*`), `Repr-Digest` (SHA-256 of the whole version) and the content ETag. A single byte range is served as 206 (`Accept-Ranges: bytes`); several ranges, other units and malformed values are ignored (the whole content is sent), an unsatisfiable range is 416 with `Content-Range: bytes */<size>`. A full download is hashed while streaming and its last chunk is held back until the digest matches: on a mismatch or a short read the body ends with an error (the connection is cut, never a clean end), the blob is marked corrupt and later requests answer 500 BLOB_CORRUPT. Ranges are not verified by the server; clients check full downloads against Repr-Digest. A file or project in the trash answers 409 FILE_DELETED / PROJECT_DELETED, a file without version 404.
      parameters:
        - in: header
          name: Range
          required: false
          schema: {type: string}
          description: A single byte range `bytes=a-b`, `bytes=a-` or `bytes=-n`
        - in: header
          name: If-Range
          required: false
          schema: {type: string}
          description: >-
            Honors Range only if it equals exactly the strong content ETag `"version:<uuid>"` of the served version;
            anything else (another tag, weak tags, dates) sends the whole content with 200.
      responses:
        '200':
          description: The content
          headers:
            ETag: {schema: {type: string}, description: 'Content ETag "version:<uuid>"'}
            Repr-Digest: {schema: {type: string}, description: 'RFC 9530 digest of the whole representation: sha-256=:<base64>:'}
            Content-Disposition: {schema: {type: string}, description: 'attachment with a sanitized ASCII filename and filename*=UTF-8'''}
            X-Content-Type-Options: {schema: {type: string, enum: [nosniff]}}
            Content-Security-Policy: {schema: {type: string, enum: [sandbox]}}
            Accept-Ranges: {schema: {type: string, enum: [bytes]}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '206':
          description: One byte range
          headers:
            ETag: {schema: {type: string}, description: 'Content ETag "version:<uuid>"'}
            Repr-Digest: {schema: {type: string}, description: 'RFC 9530 digest of the whole representation: sha-256=:<base64>:'}
            Content-Disposition: {schema: {type: string}, description: 'attachment with a sanitized ASCII filename and filename*=UTF-8'''}
            X-Content-Type-Options: {schema: {type: string, enum: [nosniff]}}
            Content-Security-Policy: {schema: {type: string, enum: [sandbox]}}
            Accept-Ranges: {schema: {type: string, enum: [bytes]}}
            Content-Range: {schema: {type: string}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: FILE_DELETED or PROJECT_DELETED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '416':
          description: RANGE_NOT_SATISFIABLE
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: BLOB_CORRUPT or INTERNAL
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /files/{file_id}/versions/{version_id}/content:
    parameters:
      - {$ref: '#/components/parameters/FileId'}
      - {$ref: '#/components/parameters/VersionId'}
    get:
      tags: [Versions]
      summary: Download one version
      description: >-
        Streams the content with bounded memory. The caller's roles are re-checked for this request (viewers and better; others 404). The response is always `application/octet-stream` with `X-Content-Type-Options: nosniff`, `Content-Security-Policy: sandbox`, `Cache-Control: no-store`, an attachment disposition built from a sanitized name (ASCII fallback plus RFC 5987 `filename*`), `Repr-Digest` (SHA-256 of the whole version) and the content ETag. A single byte range is served as 206 (`Accept-Ranges: bytes`); several ranges, other units and malformed values are ignored (the whole content is sent), an unsatisfiable range is 416 with `Content-Range: bytes */<size>`. A full download is hashed while streaming and its last chunk is held back until the digest matches: on a mismatch or a short read the body ends with an error (the connection is cut, never a clean end), the blob is marked corrupt and later requests answer 500 BLOB_CORRUPT. Ranges are not verified by the server; clients check full downloads against Repr-Digest. A file or project in the trash answers 409 FILE_DELETED / PROJECT_DELETED, a file without version 404.
      parameters:
        - in: header
          name: Range
          required: false
          schema: {type: string}
          description: A single byte range `bytes=a-b`, `bytes=a-` or `bytes=-n`
        - in: header
          name: If-Range
          required: false
          schema: {type: string}
          description: >-
            Honors Range only if it equals exactly the strong content ETag `"version:<uuid>"` of the served version;
            anything else (another tag, weak tags, dates) sends the whole content with 200.
      responses:
        '200':
          description: The content
          headers:
            ETag: {schema: {type: string}, description: 'Content ETag "version:<uuid>"'}
            Repr-Digest: {schema: {type: string}, description: 'RFC 9530 digest of the whole representation: sha-256=:<base64>:'}
            Content-Disposition: {schema: {type: string}, description: 'attachment with a sanitized ASCII filename and filename*=UTF-8'''}
            X-Content-Type-Options: {schema: {type: string, enum: [nosniff]}}
            Content-Security-Policy: {schema: {type: string, enum: [sandbox]}}
            Accept-Ranges: {schema: {type: string, enum: [bytes]}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '206':
          description: One byte range
          headers:
            ETag: {schema: {type: string}, description: 'Content ETag "version:<uuid>"'}
            Repr-Digest: {schema: {type: string}, description: 'RFC 9530 digest of the whole representation: sha-256=:<base64>:'}
            Content-Disposition: {schema: {type: string}, description: 'attachment with a sanitized ASCII filename and filename*=UTF-8'''}
            X-Content-Type-Options: {schema: {type: string, enum: [nosniff]}}
            Content-Security-Policy: {schema: {type: string, enum: [sandbox]}}
            Accept-Ranges: {schema: {type: string, enum: [bytes]}}
            Content-Range: {schema: {type: string}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: FILE_DELETED or PROJECT_DELETED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '416':
          description: RANGE_NOT_SATISFIABLE
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: BLOB_CORRUPT or INTERNAL
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /organizations/{org_id}/invitations:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
    get:
      tags: [Invitations]
      summary: List invitations (organization owner and admin)
      description: >-
        Status is pending, accepted, revoked, expired or invalid (the inviter lost the right to grant the roles
        before acceptance). Neither tokens nor token hashes are ever returned. Keyset paginated (id only).
        Workspace admins: 403; non-members: 404.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvitationPage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [Invitations]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Invite a person by link (no e-mail is sent in this phase)
      description: >-
        Owners and admins may invite as admin or member (never owner), optionally with a workspace and any
        workspace role. A workspace admin may invite only as member, only into the own workspace, with at most
        editor, and only while the organization setting workspace_admin_invites_enabled is true (otherwise 403).
        The response contains the one-time invite_url (`<PUBLIC_URL>/invite#token=<token>`; the token is in the URL
        fragment and shown only here; only its SHA-256 is stored). The link is valid for 72 hours, single use and
        revocable; possession of the link is the proof of the e-mail address until e-mail delivery exists. One open
        invitation per organization and normalized address (409 INVITATION_PENDING), at most 1000 open invitations
        per organization (409 INVITATION_LIMIT), rate limited per user (429). 503 AUTH_UNAVAILABLE when
        CRAFTCLOUD_PUBLIC_URL is not configured. A workspace of another organization or an unknown workspace
        answers 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateInvitationRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedInvitation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: INVITATION_PENDING or INVITATION_LIMIT
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /organizations/{org_id}/invitations/{invitation_id}:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
      - in: path
        name: invitation_id
        required: true
        schema: {type: string, format: uuid}
    delete:
      tags: [Invitations]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Revoke an open invitation
      description: >-
        Organization owners and admins may revoke any open invitation, a workspace admin only invitations they
        created. Unknown, foreign and already closed invitations answer 404.
      responses:
        '204': {description: Revoked}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /invitations/accept:
    post:
      tags: [Invitations]
      security: []
      summary: Accept an invitation (token possession)
      description: >-
        Origin check like login; rate limited per client address (429). Every unusable token (unknown, malformed,
        expired, used, revoked, inviter no longer entitled, disabled target) answers an identical 400
        INVALID_INVITATION. For an address without account the body needs display_name and password (password policy
        incl. the e-mail local part; 422 VALIDATION_ERROR with details.fields otherwise): the account, the
        organization membership and the workspace role are created in one transaction and the caller is logged in
        (session cookie and csrf_token like login). For an existing account the caller must be logged in as exactly
        that account (anonymous: 401 LOGIN_REQUIRED; other account: 403 INVITATION_EMAIL_MISMATCH; with a cookie the
        CSRF header is required). An existing active member accepting an organization-only invitation gets 409
        ALREADY_MEMBER and the invitation stays open; with a workspace part the workspace role is added or raised,
        never lowered, and the organization role never changes. At acceptance the inviter's current roles are
        re-evaluated.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AcceptInvitationRequest'}
      responses:
        '200':
          description: Accepted; Set-Cookie only when an account was created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedInvitation'}
        '400':
          description: INVALID_INVITATION
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: LOGIN_REQUIRED (the address belongs to an existing account) or UNAUTHENTICATED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: INVITATION_EMAIL_MISMATCH or CSRF_FAILED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: ALREADY_MEMBER
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
components:
  parameters:
    OrgId:
      in: path
      name: org_id
      required: true
      schema: {type: string, format: uuid}
    ProjectId:
      in: path
      name: project_id
      required: true
      schema: {type: string, format: uuid}
    FileId:
      in: path
      name: file_id
      required: true
      schema: {type: string, format: uuid}
    VersionId:
      in: path
      name: version_id
      required: true
      schema: {type: string, format: uuid}
    UploadId:
      in: path
      name: upload_id
      required: true
      schema: {type: string, format: uuid}
    Deleted:
      in: query
      name: deleted
      required: false
      schema: {type: boolean, default: false}
      description: List the trash (soft-deleted items) instead of the live ones.
    WorkspaceId:
      in: path
      name: workspace_id
      required: true
      schema: {type: string, format: uuid}
    Limit:
      in: query
      name: limit
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      description: Page size; values above 100 are clamped, 0 or non-numeric values answer 422.
    Cursor:
      in: query
      name: cursor
      required: false
      schema: {type: string}
      description: Opaque cursor from next_cursor of the previous page; bound to the listing and scope (400 INVALID_CURSOR otherwise).
    AuditAction:
      in: query
      name: action
      required: false
      schema: {type: string, pattern: '^[a-z0-9_.]{1,64}$'}
      description: Action code prefix; matches the code itself and every code below it (`member` matches `member.add`).
    AuditActor:
      in: query
      name: actor
      required: false
      schema: {type: string, format: uuid}
      description: Only events of this acting user.
    AuditTarget:
      in: query
      name: target
      required: false
      schema: {type: string, format: uuid}
      description: Only events about this object id.
    AuditWorkspace:
      in: query
      name: workspace
      required: false
      schema: {type: string, format: uuid}
    AuditResult:
      in: query
      name: result
      required: false
      schema: {type: string, enum: [success, denied, failed]}
    AuditFrom:
      in: query
      name: from
      required: false
      schema: {type: string, format: date-time}
      description: Events at or after this time (inclusive).
    AuditTo:
      in: query
      name: to
      required: false
      schema: {type: string, format: date-time}
      description: Events before this time (exclusive); must be after `from`.
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-craftcloud_session
      description: >-
        Browser session cookie: HttpOnly, Secure, SameSite=Lax, Path=/, no Domain. The name is
        __Host-craftcloud_session; only when CRAFTCLOUD_PUBLIC_URL is plain http on a loopback host
        (local development) the cookie is named craftcloud_session and has no Secure attribute. The value is
        a random 32-byte token (base64url); the server stores only its SHA-256 hash. Unsafe requests with a
        session cookie also need the X-CSRF-Token header (see csrfToken) and a matching Origin.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        Value of csrf_token from POST /auth/login or GET /auth/session. Required, together with a same-origin
        Origin header (or no Origin and a Sec-Fetch-Site other than cross-site), on every unsafe request
        authenticated by the session cookie. Failure: 403 CSRF_FAILED.
    bearerAuth:
      type: http
      scheme: bearer
      description: PLACEHOLDER — not used until the desktop authorization flow (D13) has its own ADR.
  schemas:
    AuditEvent:
      type: object
      required: [id, created_at, last_at, count, org_id, actor_id, action, target, workspace_id, result, request_id, details]
      properties:
        id: {type: string, format: uuid}
        created_at: {type: string, format: date-time, description: When the event happened (first occurrence of an aggregated row).}
        last_at: {type: string, format: date-time, description: Latest occurrence; equals created_at for ordinary events.}
        count: {type: integer, minimum: 1, description: Occurrences folded into the row (aggregated denials and login failures).}
        org_id: {type: [string, 'null'], format: uuid, description: null for instance-level events.}
        actor_id: {type: [string, 'null'], format: uuid, description: null for the system (maintenance) and unknown accounts.}
        action: {type: string, example: member.add}
        target:
          type: [object, 'null']
          required: [type, id]
          properties:
            type: {type: [string, 'null'], example: user}
            id: {type: string, format: uuid}
        workspace_id: {type: [string, 'null'], format: uuid}
        result: {type: string, enum: [success, denied, failed]}
        request_id: {type: [string, 'null']}
        details:
          type: object
          description: >-
            Flat object of identifiers, fixed codes (such as a role), counters and flags. Never names, e-mail addresses,
            tokens, passwords, file content or IP addresses.
          additionalProperties:
            oneOf:
              - {type: string}
              - {type: integer}
              - {type: boolean}
    AuditEventPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/AuditEvent'}
        next_cursor: {type: [string, 'null']}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string, example: NOT_FOUND}
            message: {type: string}
            request_id: {type: [string, 'null']}
            details: {type: object}
    SetupCompleteRequest:
      type: object
      additionalProperties: false
      required: [bootstrap_token, email, display_name, password, organization]
      properties:
        bootstrap_token:
          type: string
          writeOnly: true
          minLength: 32
          description: Token from the operator-provided secret file.
        email:
          type: string
          maxLength: 320
          description: Trimmed and lowercased by the server; exactly one @, no whitespace or control characters.
        display_name: {type: string, minLength: 1, maxLength: 100}
        password:
          type: string
          writeOnly: true
          minLength: 12
          maxLength: 128
          description: Counted in characters. Must not equal the e-mail local part. Stored as an Argon2id hash.
        organization:
          type: object
          additionalProperties: false
          required: [name, slug]
          properties:
            name: {type: string, minLength: 1, maxLength: 100}
            slug: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$'}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string}
        password: {type: string, writeOnly: true}
    LoginResponse:
      type: object
      required: [user_id, csrf_token, expires_at]
      properties:
        user_id: {type: string, format: uuid}
        csrf_token: {type: string, description: Send as X-CSRF-Token on unsafe requests}
        expires_at: {type: string, format: date-time, description: Earliest of idle expiry from now and the absolute expiry}
    SessionInfo:
      type: object
      required: [user_id, email, display_name, instance_role, csrf_token, created_at, expires_at]
      properties:
        user_id: {type: string, format: uuid}
        email: {type: string}
        display_name: {type: string}
        instance_role: {type: [string, 'null'], enum: [operator, null]}
        csrf_token: {type: string}
