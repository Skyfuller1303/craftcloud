openapi: 3.1.0
info:
  title: CraftCloud Core API — proposal sketch
  version: 0.0.0-rfc
  description: >-
    RFC EXAMPLE ONLY. Not deployed, not an upstream contract, deliberately incomplete.
    Authorization details and full response schemas must be decided before implementation.
servers:
  - url: https://craftcloud.example.invalid/api/v1
security:
  - cookieAuth: []
tags:
  - name: Health
  - name: Setup
  - name: Discovery
  - name: Workspaces
  - name: Files
paths:
  /health/live:
    get:
      tags: [Health]
      security: []
      summary: Liveness only; no dependency details
      description: Path is relative to the server root, not /api/v1 (see CC-F15).
      servers:
        - url: https://craftcloud.example.invalid
      responses:
        '200': {description: Process is alive}
        '503': {$ref: '#/components/responses/Timeout'}
  /setup/status:
    get:
      tags: [Setup]
      security: []
      summary: Generic setup state without secrets (CC-F01)
      responses:
        '200':
          description: Setup state
          content:
            application/json:
              schema:
                type: object
                required: [setup_required]
                properties:
                  setup_required: {type: boolean}
  /setup/complete:
    post:
      tags: [Setup]
      security: []
      summary: One-shot creation of the initial instance operator (CC-F01)
      description: Request schema (bootstrap token, credentials, organization name) is deliberately not yet specified.
      responses:
        '201': {description: Initial operator created; setup routes are closed afterwards}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {description: Validation error}
  /info:
    get:
      tags: [Discovery]
      security: []
      summary: Discover supported server/API capabilities
      responses:
        '200':
          description: Server capabilities
          content:
            application/json:
              schema:
                type: object
                required: [api_version, features, server_mode]
                properties:
                  api_version: {type: string, example: '1.0'}
                  features:
                    type: array
                    items:
                      type: string
                      pattern: '^[a-z0-9._-]+$'
                      minLength: 1
                      maxLength: 64
                  server_mode:
                    type: string
                    enum: [development-prototype]
                    description: >-
                      Additive field (PR-001). `development-prototype` marks a local, non-production
                      server. Clients must treat unknown values as a controlled fallback, not an error.
        '503': {$ref: '#/components/responses/Timeout'}
  /workspaces:
    get:
      tags: [Workspaces]
      summary: List only authorized workspaces
      responses:
        '200':
          description: Authorized workspaces only
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Workspace'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /files/{file_id}:
    get:
      tags: [Files]
      summary: Get authorized file metadata, not binary content
      parameters:
        - in: path
          name: file_id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: File metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/File'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: craftcloud_session
      description: Browser session (HttpOnly, Secure, SameSite). Mutating requests also require a CSRF header; final names pending (ADR-0009).
    bearerAuth:
      type: http
      scheme: bearer
      description: PLACEHOLDER — not used until the desktop authorization flow (D13) has its own ADR.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string, example: NOT_FOUND}
            message: {type: string}
            request_id: {type: [string, 'null']}
            details: {type: object}
    Workspace:
      type: object
      required: [id, name, organization_id]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        organization_id: {type: string, format: uuid}
    File:
      type: object
      required: [id, project_id, name]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        name: {type: string}
        head_version_id: {type: [string, 'null'], format: uuid}
  responses:
    PayloadTooLarge:
      description: Request body exceeds the configured limit (code PAYLOAD_TOO_LARGE)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Timeout:
      description: Handler exceeded the time limit (code TIMEOUT)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Missing or invalid credentials
    NotFound:
      description: Resource not visible to requester
    Conflict:
      description: State conflict without precondition (e.g. setup already completed, idempotency key reused with a different payload)
