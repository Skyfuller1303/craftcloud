openapi: 3.1.0
info:
  title: CraftCloud Core API — proposal sketch
  version: 0.0.0-rfc
  description: >-
    RFC EXAMPLE ONLY. Not deployed, not an upstream contract, deliberately incomplete. Contains only operations that the server implements (checked by crates/craftcloud-api/tests/contract.rs); upload and version endpoints are added with their features.
    Authorization details and full response schemas must be decided before implementation.
servers:
  - url: https://craftcloud.example.invalid/api/v1
security:
  - cookieAuth: []
tags:
  - name: Health
  - name: Setup
  - name: Auth
  - name: Admin
  - name: Organizations
  - name: Members
  - name: Discovery
  - name: Workspaces
  - name: Invitations
  - name: Projects
  - name: Files
paths:
  /health/live:
    get:
      tags: [Health]
      security: []
      summary: Liveness only; no dependency details
      description: Path is relative to the server root, not /api/v1 (see CC-F15).
      servers:
        - url: https://craftcloud.example.invalid
      responses:
        '200': {description: Process is alive}
        '503': {$ref: '#/components/responses/Timeout'}
  /setup/status:
    get:
      tags: [Setup]
      security: []
      summary: Generic setup state without secrets (CC-F01)
      description: Reveals only whether setup is still required. Answers 503 SETUP_UNAVAILABLE when no database is configured or reachable.
      responses:
        '200':
          description: Setup state
          content:
            application/json:
              schema:
                type: object
                required: [setup_required]
                properties:
                  setup_required: {type: boolean}
        '500':
          description: Internal error (INTERNAL)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: SETUP_UNAVAILABLE (no database configured or reachable) or TIMEOUT
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /setup/complete:
    post:
      tags: [Setup]
      security: []
      summary: One-shot creation of the initial instance operator (CC-F01)
      description: >-
        Creates exactly one instance operator, one organization and the operator's owner membership in a
        single transaction. The bootstrap token comes from the file configured by the operator
        (CRAFTCLOUD_BOOTSTRAP_SECRET_FILE); the server never generates or prints one. No session is created.
        Order of checks: (1) 503 SETUP_UNAVAILABLE if no database is configured or reachable; (2) an
        unparsable body, unknown field or missing field (including a missing bootstrap_token) answers 422
        VALIDATION_ERROR without details, 415 or 413, before the token is looked at and independent of any
        state; (3) 403 INVALID_BOOTSTRAP_TOKEN for a wrong token and, identically, when no bootstrap secret
        is configured on the server (callers cannot tell the two apart; the reason is only logged), also
        independent of whether setup was completed; (4) 409 SETUP_ALREADY_COMPLETED, only for a valid
        token; (5) 422 VALIDATION_ERROR with details.fields for semantic field validation only. There is
        no rate limit on this route (tokens have at least 32 characters); a generic limiter follows with
        the session work.

        The request is subject to the global handler timeout (503 TIMEOUT) without exemption. If a request
        times out or the connection drops while the server was committing, setup may nevertheless have
        succeeded: the client must re-check GET /setup/status (setup_required false) before retrying.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetupCompleteRequest'}
      responses:
        '201':
          description: Initial operator and organization created; setup routes are closed afterwards
          content:
            application/json:
              schema:
                type: object
                required: [user_id, organization_id]
                properties:
                  user_id: {type: string, format: uuid}
                  organization_id: {type: string, format: uuid}
        '403':
          description: >-
            Wrong bootstrap token or no bootstrap secret configured (both INVALID_BOOTSTRAP_TOKEN, indistinguishable)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Setup already completed (SETUP_ALREADY_COMPLETED), only for a valid token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415':
          description: Content-Type is not application/json (UNSUPPORTED_MEDIA_TYPE)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: >-
            VALIDATION_ERROR. Without details when the body cannot be parsed (invalid JSON, unknown or missing
            field). With details.fields (invalid field names only, e.g. email, display_name, password,
            organization.name, organization.slug) for semantic field validation, which is only reached with a
            valid token. Values are never echoed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: Internal error (INTERNAL), for example a failed database operation or password hashing
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: >-
            SETUP_UNAVAILABLE (no database configured or reachable) or TIMEOUT (handler timeout; setup may
            have been committed, re-check GET /setup/status)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Log in with e-mail and password (CC-F02)
      description: >-
        Creates a session and sets the session cookie. Unknown e-mail, wrong password, accounts without a
        password and disabled accounts all answer an identical 401 INVALID_CREDENTIALS after the same amount
        of hashing work. Rate limits: requests per client address (IPv4 exact, IPv6 /64) and, counting only
        failed logins, per account and address (5 per 15 minutes) and per account over all addresses (50 per
        15 minutes); a successful login resets the counter of its address. Both answer 429 RATE_LIMITED with
        Retry-After, and unknown e-mail addresses behave exactly like registered ones. A login that presents a
        still valid session cookie revokes that old session. The session is only created if the password hash
        is still the verified one (a reset that commits meanwhile makes the login fail with 401). The Origin
        check applies (login CSRF); there is no CSRF token yet. No hard lockout.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Logged in; Set-Cookie carries the session cookie
          headers:
            Set-Cookie: {schema: {type: string}, description: Session cookie (see securitySchemes.cookieAuth)}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '403': {$ref: '#/components/responses/CsrfFailed'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/session:
    get:
      tags: [Auth]
      summary: Current session (CC-F02)
      description: Returns the authenticated account and the CSRF token. 401 UNAUTHENTICATED without a valid, unexpired, unrevoked session.
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionInfo'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/sessions:
    get:
      tags: [Auth]
      summary: List the own active sessions (device list)
      description: >-
        Active (not revoked, not expired) sessions of the current user, newest first, at most 100. Contains no
        network or device data (no IP address, no user agent) and never a token.
      responses:
        '200':
          description: Own active sessions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/sessions/{session_id}:
    delete:
      tags: [Auth]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Revoke one of the own sessions
      description: >-
        Only own sessions can be revoked. Another user's, unknown and already revoked sessions all answer 404.
        Revoking the current session also clears the cookie.
      parameters:
        - in: path
          name: session_id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Session revoked}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/CsrfFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/logout:
    post:
      tags: [Auth]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Log out the current session
      description: >-
        Revokes the session and clears the cookie. A 401 answer also carries a Set-Cookie that clears the
        stale cookie.
      responses:
        '204': {description: Logged out; Set-Cookie clears the session cookie}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/CsrfFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/logout-all:
    post:
      tags: [Auth]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Log out all sessions of the account
      description: Revokes every session of the account and clears the cookie (also on a 401 answer).
      responses:
        '204': {description: All sessions of the account revoked; the cookie is cleared}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/CsrfFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/password/change:
    post:
      tags: [Auth]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Change the own password
      description: >-
        Requires the current password (wrong: 403 INVALID_CURRENT_PASSWORD; rate limited to 5 per minute and
        user). Revokes all other sessions of the account and voids pending reset links; the current session
        stays valid. Policy violations of the new password answer 422 VALIDATION_ERROR with details.fields
        ["new_password"].
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses:
        '204': {description: Password changed}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: CSRF_FAILED or INVALID_CURRENT_PASSWORD
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/password-reset:
    post:
      tags: [Auth]
      security: []
      summary: Complete a password reset with a reset token
      description: >-
        Anonymous, rate limited per client address. Unknown, malformed, expired, used, voided and
        disabled-account tokens all answer an identical 400 INVALID_RESET_TOKEN. A valid token with a password
        that violates the policy answers 422 and stays usable. Success sets the password, consumes the token
        and revokes every session of the account. Tokens are single use and valid for one hour.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '204': {description: Password set; all sessions revoked}
        '400':
          description: INVALID_RESET_TOKEN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/users/{user_id}/password-reset:
    parameters:
      - in: path
        name: user_id
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Admin]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Issue a password reset link (instance operator only)
      description: >-
        Until the policy engine (PR-006) only the instance operator recorded by the one-time setup may call
        this (others: 403 FORBIDDEN). Issuing a link is a compromise response (ADR-0013): it immediately
        revokes every active session of the target account and voids older pending links of that account. The
        link is returned once; only a hash of its token is stored. The token sits in the URL fragment so it is
        not sent to servers or in Referer headers. Requires CRAFTCLOUD_PUBLIC_URL (otherwise 503
        AUTH_UNAVAILABLE). Disabled accounts: 409 ACCOUNT_DISABLED. Offline alternative:
        craftcloud-server admin issue-password-reset --email <address>.
      responses:
        '201':
          description: Reset link issued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResetLinkResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: CSRF_FAILED or FORBIDDEN (not the instance operator)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: ACCOUNT_DISABLED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      tags: [Admin]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Void pending password reset links (instance operator only)
      description: Voids every unused reset link of the account without touching its sessions. Idempotent.
      responses:
        '204': {description: Pending links voided (or none existed)}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: CSRF_FAILED or FORBIDDEN (not the instance operator)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /organizations:
    get:
      tags: [Organizations]
      summary: List the organizations the caller is a member of (CC-F04)
      description: >-
        Active memberships of the authenticated user, ordered by (created_at, id), keyset paginated. Cursors are
        opaque, bound to the listing and the user, and not signed (see api-conventions).
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MyOrganizationPage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [Organizations, Admin]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Create an organization (instance operator only)
      description: >-
        Creates the organization and the owner membership of owner_user_id (an existing, enabled user; may be the
        operator) in one transaction. Self-service creation does not exist (ADR-0013). Other callers: 403
        FORBIDDEN. Invalid name/slug, unknown or disabled owner and a taken slug answer 422 VALIDATION_ERROR with
        details.fields.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOrganizationRequest'}
      responses:
        '201':
          description: Created
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "org-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedOrganization'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: CSRF_FAILED or FORBIDDEN (not the instance operator)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /organizations/{org_id}:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
    get:
      tags: [Organizations]
      summary: Read an organization (members only)
      description: >-
        Non-members, the instance operator without membership and unknown ids all answer an identical 404
        NOT_FOUND (no existence leak). The ETag is the version for PATCH.
      responses:
        '200':
          description: The organization with the caller's role
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    patch:
      tags: [Organizations]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Rename an organization (owner and admin)
      description: >-
        Order of checks: authentication and CSRF, 404 (not a member), 403 FORBIDDEN (plain member), 422 invalid
        name, 428 PRECONDITION_REQUIRED without If-Match, 412 VERSION_CONFLICT if the If-Match ETag is not the
        current version (the current ETag is returned in the response header).
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: {type: string, example: '"org-v1"'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateOrganizationRequest'}
      responses:
        '200':
          description: Updated; the new ETag is in the header
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412':
          description: VERSION_CONFLICT
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '428':
          description: PRECONDITION_REQUIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /organizations/{org_id}/members:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
    get:
      tags: [Members]
      summary: List the members of an organization (any member)
      description: >-
        Ordered by join time and user id (stable, keyset paginated); cursors contain only a timestamp and ids, never
        names or e-mail addresses. Only active members are listed. Non-members and unknown organizations answer 404.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberPage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [Members]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Add an existing user as member (owner and admin)
      description: >-
        Owners may assign any role; admins only member and admin, never owner (403). Plain members: 403,
        non-members: 404. An unknown user id answers 404 only after the permission check passed (no user
        enumeration for others); an already active membership answers 409 ALREADY_MEMBER, a disabled account
        409 ACCOUNT_DISABLED. An invited or disabled membership row is reactivated with the given role. People without an account are onboarded by invitation (POST /organizations/{org_id}/invitations).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddMemberRequest'}
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: ALREADY_MEMBER or ACCOUNT_DISABLED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /organizations/{org_id}/members/{user_id}:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
      - in: path
        name: user_id
        required: true
        schema: {type: string, format: uuid}
    patch:
      tags: [Members]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Change a member's role (owner and admin)
      description: >-
        Owners may set any role. Admins may set member/admin on members and admins (including themselves) and never
        touch owners (403). The last *enabled* owner cannot be demoted (409 LAST_OWNER; owners whose account is
        disabled do not count); membership changes and renames of one organization are serialized so concurrent
        requests cannot leave it without an owner. Only active members can be changed. An unknown target is
        404 for owners and admins and 403 for plain members.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeRoleRequest'}
      responses:
        '200':
          description: Role changed (or already set)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: LAST_OWNER
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      tags: [Members]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Remove a member or leave the organization
      description: >-
        Owners may remove anybody, admins members and admins (not owners), and every member may remove themselves
        (leave). The user's workspace grants in the organization are removed with the membership. The last owner
        cannot be removed (409 LAST_OWNER). A membership row of any status (also invited or disabled) can be removed.
      responses:
        '204': {description: Removed}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: LAST_OWNER
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/organizations:
    get:
      tags: [Admin, Organizations]
      summary: Organization metadata of the whole instance (operator only)
      description: >-
        Id, slug, name, creation time and member count only: no member lists, no user data, no files. The operator
        has no access to organization contents through this route.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationSummaryPage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/users:
    get:
      tags: [Admin]
      summary: List the accounts of the instance (operator only)
      description: >-
        Instance-level account metadata, no organization data: id, address, display name, creation time, disabled flag,
        email_verified and, for accounts created by an invitation, the origin (organization, inviting user, invitation).
        email_verified is false for every account until an e-mail verification flow exists (also for the setup
        operator). Use `?unverified=true` to list accounts without verified address. This is the operator's tool
        against account squatting: an inviter who accepts their own link creates an instance-wide account for an
        address they may not own; the operator can see who created it and disable it
        (POST /admin/users/{user_id}/disable); recovery for the real owner of the address is a manual operator
        procedure (see the deployment guide). Keyset paginated
        (creation time, id; the cursor is bound to the filter and contains no personal data). Other callers: 403.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - in: query
          name: unverified
          required: false
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUserPage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/users/{user_id}/disable:
    post:
      tags: [Admin]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Disable an account (operator only)
      description: >-
        Revokes every session of the account, voids its pending reset links and refuses further logins. Idempotent.
        The instance operator cannot be disabled (409 CANNOT_DISABLE_OPERATOR). Memberships stay, so enabling the
        account restores access. Disabling is never blocked by the last-owner rule (a security response must not be
        blocked): the 200 response lists the organizations that are left without an enabled owner
        (orphaned_organization_ids, empty if none); the server logs a warning and the host operator can recover them
        with `craftcloud-server admin set-org-owner --org <slug> --email <address>`.
      parameters:
        - {in: path, name: user_id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Disabled (or already disabled); lists organizations without an enabled owner
          content:
            application/json:
              schema:
                type: object
                required: [orphaned_organization_ids]
                properties:
                  orphaned_organization_ids:
                    type: array
                    maxItems: 1000
                    items: {type: string, format: uuid}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: CANNOT_DISABLE_OPERATOR
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/users/{user_id}/enable:
    post:
      tags: [Admin]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Enable an account (operator only)
      description: Idempotent. Earlier sessions stay revoked.
      parameters:
        - {in: path, name: user_id, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Enabled (or already enabled)}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /info:
    get:
      tags: [Discovery]
      security: []
      summary: Discover supported server/API capabilities
      responses:
        '200':
          description: Server capabilities
          content:
            application/json:
              schema:
                type: object
                required: [api_version, features, server_mode]
                properties:
                  api_version: {type: string, example: '1.0'}
                  features:
                    type: array
                    items:
                      type: string
                      pattern: '^[a-z0-9._-]+$'
                      minLength: 1
                      maxLength: 64
                  server_mode:
                    type: string
                    enum: [development-prototype]
                    description: >-
                      Additive field (PR-001). `development-prototype` marks a local, non-production
                      server. Clients must treat unknown values as a controlled fallback, not an error.
        '503': {$ref: '#/components/responses/Timeout'}
  /organizations/{org_id}/workspaces:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
    get:
      tags: [Workspaces]
      summary: List the workspaces of an organization the caller may see
      description: >-
        Organization owners and admins see every workspace of the organization, other members only the workspaces
        they belong to (workspace_role is the caller's role there, null for managers without a grant). Keyset
        paginated (creation time, id). Non-members and unknown organizations answer 404.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspacePage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [Workspaces]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Create a workspace (organization owner and admin)
      description: >-
        Other members: 403, non-members and unknown organizations: 404. Invalid name/slug or a taken slug answer 422
        VALIDATION_ERROR with details.fields. There is no workspace deletion in this phase (see docs/gaps.md).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWorkspaceRequest'}
      responses:
        '201':
          description: Created
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "ws-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /workspaces/{workspace_id}:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
    get:
      tags: [Workspaces]
      summary: Get a workspace (organization owner/admin or workspace member)
      description: >-
        The organization is taken from the workspace, never from the client. Unknown ids, workspaces of other
        organizations and workspaces the caller may not see are indistinguishable: 404.
      responses:
        '200':
          description: The workspace
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "ws-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    patch:
      tags: [Workspaces]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Rename a workspace (workspace admin, organization owner and admin)
      description: >-
        Requires If-Match with the current ETag (428 PRECONDITION_REQUIRED without, 412 VERSION_CONFLICT with a stale
        value; the response carries the current ETag). Workspace editors and viewers: 403; callers who cannot see
        the workspace: 404.
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateWorkspaceRequest'}
      responses:
        '200':
          description: Updated; the new ETag is in the header
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "ws-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412':
          description: VERSION_CONFLICT
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '428':
          description: PRECONDITION_REQUIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /workspaces/{workspace_id}/members:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
    get:
      tags: [Workspaces]
      summary: List the members of a workspace (workspace members, organization owner and admin)
      description: >-
        Keyset paginated (join time, user id). Callers who cannot see the workspace answer 404.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceMemberPage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [Workspaces]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Add an organization member to a workspace
      description: >-
        Organization owners and admins may assign any workspace role. A workspace admin may assign editor and viewer
        only (403 for admin) and only in the own workspace. Editors and viewers: 403. The user must be an active,
        enabled member of the workspace's organization; any other or unknown user id answers 404 (no enumeration).
        An existing workspace membership answers 409 ALREADY_MEMBER.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddWorkspaceMemberRequest'}
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceMember'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: ALREADY_MEMBER
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /workspaces/{workspace_id}/members/{user_id}:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - in: path
        name: user_id
        required: true
        schema: {type: string, format: uuid}
    patch:
      tags: [Workspaces]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Change a workspace role
      description: >-
        Organization owners and admins may set any role. A workspace admin may set editor/viewer on editors and
        viewers; it never touches workspace admins (including itself): 403. Editors and viewers: 403. An unknown
        target is 404 for managers and 403 for editors and viewers.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeWorkspaceRoleRequest'}
      responses:
        '200':
          description: Role changed (or already set)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceMember'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      tags: [Workspaces]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Remove a workspace member or leave the workspace
      description: >-
        Same limits as the role change; every member may remove themselves (leave), including workspace admins.
      responses:
        '204': {description: Removed}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /workspaces/{workspace_id}/projects:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
    get:
      tags: [Projects]
      summary: List the projects of a workspace (workspace members, organization owner and admin)
      description: >-
        Live projects, or with `deleted=true` the trash. Keyset paginated by creation time and id; the cursor holds
        timestamp and id only and is bound to the workspace and the `deleted` switch (400 INVALID_CURSOR otherwise).
        Callers who cannot see the workspace answer 404.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Deleted'}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectPage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [Projects]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Create a project (organization owner/admin, workspace admin and editor)
      description: >-
        Viewers: 403; callers who cannot see the workspace: 404. The name follows the display-name rules after NFC
        normalization (422 VALIDATION_ERROR with details.fields ["name"]) and is unique among the live projects of
        the workspace by its NFC and case-folded form (409 PROJECT_NAME_TAKEN).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProjectRequest'}
      responses:
        '201':
          description: Created
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "prj-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: PROJECT_NAME_TAKEN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /projects/{project_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      tags: [Projects]
      summary: Get a project (also one in the trash)
      description: >-
        The workspace and organization come from the project row. Unknown ids, ids of other tenants and projects in
        workspaces the caller cannot see are indistinguishable: 404.
      responses:
        '200':
          description: The project
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "prj-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    patch:
      tags: [Projects]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Rename a project (organization owner/admin, workspace admin and editor)
      description: >-
        Requires If-Match (428 PRECONDITION_REQUIRED without, 412 VERSION_CONFLICT with a stale or malformed value; the
        response carries the current ETag). A project in the trash answers 409 PROJECT_DELETED, a taken name
        409 PROJECT_NAME_TAKEN.
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProjectRequest'}
      responses:
        '200':
          description: Renamed
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "prj-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: PROJECT_NAME_TAKEN or PROJECT_DELETED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '412':
          description: VERSION_CONFLICT
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '428':
          description: PRECONDITION_REQUIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      tags: [Projects]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Move a project to the trash (organization owner/admin and workspace admin)
      description: >-
        Soft delete; idempotent (an already deleted project answers 204 and is not changed). Editors and viewers: 403.
        The files stay with the project; a project in the trash is read-only. Restorable for the retention period
        (`CRAFTCLOUD_TRASH_RETENTION_DAYS`, default 30); nothing is purged yet.
      responses:
        '204': {description: In the trash}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /projects/{project_id}/restore:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    post:
      tags: [Projects]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Restore a project from the trash (organization owner/admin and workspace admin)
      description: >-
        Within the retention period only (410 RETENTION_EXPIRED afterwards); 409 PROJECT_NAME_TAKEN when a live
        project took the name meanwhile. Restoring a live project changes nothing (200).
      responses:
        '200':
          description: Restored
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "prj-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: PROJECT_NAME_TAKEN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '410':
          description: RETENTION_EXPIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /projects/{project_id}/files:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      tags: [Files]
      summary: List the file metadata of a project (workspace members, organization owner and admin)
      description: >-
        Live files, or with `deleted=true` the trash. Keyset paginated by creation time and id; the cursor is bound to
        the project and the `deleted` switch. Callers who cannot see the workspace: 404.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Deleted'}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FilePage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [Files]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Create file metadata (organization owner/admin, workspace admin and editor)
      description: >-
        Metadata only; contents and versions follow with the upload feature. The name is untrusted display metadata,
        never used as a path: NFC-normalized, 1 to 255 bytes, no control characters (including NUL), none of
        `/ \ : * ? " < > |`, not `.` or `..`, no leading or trailing whitespace, no trailing dot, no invisible format
        or bidirectional characters, no Windows device names (CON, PRN, AUX, NUL, COM1-9, LPT1-9, with any
        extension). Invalid names answer 422 with details.fields ["name"]. Names are unique among the live files of
        the project by their NFC and case-folded form (409 FILE_NAME_TAKEN). `app` matches `^[a-z0-9-]{1,32}$`,
        `format` matches `^[a-z0-9.+-]{1,64}$`. A project in the trash answers 409 PROJECT_DELETED.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateFileRequest'}
      responses:
        '201':
          description: Created
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "file-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/File'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: FILE_NAME_TAKEN or PROJECT_DELETED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /files/{file_id}:
    parameters:
      - {$ref: '#/components/parameters/FileId'}
    get:
      tags: [Files]
      summary: Get file metadata (also one in the trash)
      description: >-
        Organization, workspace and project come from the file row. Unknown ids, ids of other tenants, ids of other
        kinds (a project id) and files in workspaces the caller cannot see are indistinguishable: 404.
      responses:
        '200':
          description: The file metadata
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "file-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/File'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    patch:
      tags: [Files]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Rename a file (organization owner/admin, workspace admin and editor)
      description: >-
        Requires If-Match (428 without, 412 VERSION_CONFLICT with a stale or malformed value; the response carries the
        current ETag). A file in the trash answers 409 FILE_DELETED, a file of a project in the trash 409
        PROJECT_DELETED, a taken name 409 FILE_NAME_TAKEN. App and format cannot be changed.
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateFileRequest'}
      responses:
        '200':
          description: Renamed
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "file-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/File'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: FILE_NAME_TAKEN, FILE_DELETED or PROJECT_DELETED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '412':
          description: VERSION_CONFLICT
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '428':
          description: PRECONDITION_REQUIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      tags: [Files]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Move a file to the trash (organization owner/admin, workspace admin and editor)
      description: >-
        Soft delete; idempotent. Restorable for the retention period; nothing is purged yet. Viewers: 403. A file of
        a project in the trash answers 409 PROJECT_DELETED.
      responses:
        '204': {description: In the trash}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: PROJECT_DELETED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /files/{file_id}/restore:
    parameters:
      - {$ref: '#/components/parameters/FileId'}
    post:
      tags: [Files]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Restore a file from the trash (organization owner/admin, workspace admin and editor)
      description: >-
        Within the retention period only (410 RETENTION_EXPIRED afterwards); 409 FILE_NAME_TAKEN when a live file took
        the name meanwhile; 409 PROJECT_DELETED when the project is in the trash. Restoring a live file changes
        nothing (200).
      responses:
        '200':
          description: Restored
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "file-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/File'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: FILE_NAME_TAKEN or PROJECT_DELETED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '410':
          description: RETENTION_EXPIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /organizations/{org_id}/invitations:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
    get:
      tags: [Invitations]
      summary: List invitations (organization owner and admin)
      description: >-
        Status is pending, accepted, revoked, expired or invalid (the inviter lost the right to grant the roles
        before acceptance). Neither tokens nor token hashes are ever returned. Keyset paginated (id only).
        Workspace admins: 403; non-members: 404.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvitationPage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [Invitations]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Invite a person by link (no e-mail is sent in this phase)
      description: >-
        Owners and admins may invite as admin or member (never owner), optionally with a workspace and any
        workspace role. A workspace admin may invite only as member, only into the own workspace, with at most
        editor, and only while the organization setting workspace_admin_invites_enabled is true (otherwise 403).
        The response contains the one-time invite_url (`<PUBLIC_URL>/invite#token=<token>`; the token is in the URL
        fragment and shown only here; only its SHA-256 is stored). The link is valid for 72 hours, single use and
        revocable; possession of the link is the proof of the e-mail address until e-mail delivery exists. One open
        invitation per organization and normalized address (409 INVITATION_PENDING), at most 1000 open invitations
        per organization (409 INVITATION_LIMIT), rate limited per user (429). 503 AUTH_UNAVAILABLE when
        CRAFTCLOUD_PUBLIC_URL is not configured. A workspace of another organization or an unknown workspace
        answers 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateInvitationRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedInvitation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: INVITATION_PENDING or INVITATION_LIMIT
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /organizations/{org_id}/invitations/{invitation_id}:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
      - in: path
        name: invitation_id
        required: true
        schema: {type: string, format: uuid}
    delete:
      tags: [Invitations]
      security:
        - cookieAuth: []
          csrfToken: []
      summary: Revoke an open invitation
      description: >-
        Organization owners and admins may revoke any open invitation, a workspace admin only invitations they
        created. Unknown, foreign and already closed invitations answer 404.
      responses:
        '204': {description: Revoked}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /invitations/accept:
    post:
      tags: [Invitations]
      security: []
      summary: Accept an invitation (token possession)
      description: >-
        Origin check like login; rate limited per client address (429). Every unusable token (unknown, malformed,
        expired, used, revoked, inviter no longer entitled, disabled target) answers an identical 400
        INVALID_INVITATION. For an address without account the body needs display_name and password (password policy
        incl. the e-mail local part; 422 VALIDATION_ERROR with details.fields otherwise): the account, the
        organization membership and the workspace role are created in one transaction and the caller is logged in
        (session cookie and csrf_token like login). For an existing account the caller must be logged in as exactly
        that account (anonymous: 401 LOGIN_REQUIRED; other account: 403 INVITATION_EMAIL_MISMATCH; with a cookie the
        CSRF header is required). An existing active member accepting an organization-only invitation gets 409
        ALREADY_MEMBER and the invitation stays open; with a workspace part the workspace role is added or raised,
        never lowered, and the organization role never changes. At acceptance the inviter's current roles are
        re-evaluated.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AcceptInvitationRequest'}
      responses:
        '200':
          description: Accepted; Set-Cookie only when an account was created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedInvitation'}
        '400':
          description: INVALID_INVITATION
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: LOGIN_REQUIRED (the address belongs to an existing account) or UNAUTHENTICATED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: INVITATION_EMAIL_MISMATCH or CSRF_FAILED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: ALREADY_MEMBER
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
components:
  parameters:
    OrgId:
      in: path
      name: org_id
      required: true
      schema: {type: string, format: uuid}
    ProjectId:
      in: path
      name: project_id
      required: true
      schema: {type: string, format: uuid}
    FileId:
      in: path
      name: file_id
      required: true
      schema: {type: string, format: uuid}
    Deleted:
      in: query
      name: deleted
      required: false
      schema: {type: boolean, default: false}
      description: List the trash (soft-deleted items) instead of the live ones.
    WorkspaceId:
      in: path
      name: workspace_id
      required: true
      schema: {type: string, format: uuid}
    Limit:
      in: query
      name: limit
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      description: Page size; values above 100 are clamped, 0 or non-numeric values answer 422.
    Cursor:
      in: query
      name: cursor
      required: false
      schema: {type: string}
      description: Opaque cursor from next_cursor of the previous page; bound to the listing and scope (400 INVALID_CURSOR otherwise).
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-craftcloud_session
      description: >-
        Browser session cookie: HttpOnly, Secure, SameSite=Lax, Path=/, no Domain. The name is
        __Host-craftcloud_session; only when CRAFTCLOUD_PUBLIC_URL is plain http on a loopback host
        (local development) the cookie is named craftcloud_session and has no Secure attribute. The value is
        a random 32-byte token (base64url); the server stores only its SHA-256 hash. Unsafe requests with a
        session cookie also need the X-CSRF-Token header (see csrfToken) and a matching Origin.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        Value of csrf_token from POST /auth/login or GET /auth/session. Required, together with a same-origin
        Origin header (or no Origin and a Sec-Fetch-Site other than cross-site), on every unsafe request
        authenticated by the session cookie. Failure: 403 CSRF_FAILED.
    bearerAuth:
      type: http
      scheme: bearer
      description: PLACEHOLDER — not used until the desktop authorization flow (D13) has its own ADR.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string, example: NOT_FOUND}
            message: {type: string}
            request_id: {type: [string, 'null']}
            details: {type: object}
    SetupCompleteRequest:
      type: object
      additionalProperties: false
      required: [bootstrap_token, email, display_name, password, organization]
      properties:
        bootstrap_token:
          type: string
          writeOnly: true
          minLength: 32
          description: Token from the operator-provided secret file.
        email:
          type: string
          maxLength: 320
          description: Trimmed and lowercased by the server; exactly one @, no whitespace or control characters.
        display_name: {type: string, minLength: 1, maxLength: 100}
        password:
          type: string
          writeOnly: true
          minLength: 12
          maxLength: 128
          description: Counted in characters. Must not equal the e-mail local part. Stored as an Argon2id hash.
        organization:
          type: object
          additionalProperties: false
          required: [name, slug]
          properties:
            name: {type: string, minLength: 1, maxLength: 100}
            slug: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$'}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string}
        password: {type: string, writeOnly: true}
    LoginResponse:
      type: object
      required: [user_id, csrf_token, expires_at]
      properties:
        user_id: {type: string, format: uuid}
        csrf_token: {type: string, description: Send as X-CSRF-Token on unsafe requests}
        expires_at: {type: string, format: date-time, description: Earliest of idle expiry from now and the absolute expiry}
    SessionInfo:
      type: object
      required: [user_id, email, display_name, instance_role, csrf_token, created_at, expires_at]
      properties:
        user_id: {type: string, format: uuid}
        email: {type: string}
        display_name: {type: string}
        instance_role: {type: [string, 'null'], enum: [operator, null]}
        csrf_token: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    Organization:
      type: object
      required: [id, slug, name, role, version, workspace_admin_invites_enabled, created_at]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        name: {type: string}
        role: {type: string, enum: [owner, admin, member], description: The caller's role}
        version: {type: integer, minimum: 1}
        workspace_admin_invites_enabled: {type: boolean, description: Whether workspace admins may invite into their own workspace}
        created_at: {type: string, format: date-time}
    CreatedOrganization:
      type: object
      required: [id, slug, name, owner_user_id, version, created_at]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        name: {type: string}
        owner_user_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
    MyOrganizationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Organization'}
        next_cursor: {type: [string, 'null']}
    OrganizationSummaryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            required: [id, slug, name, member_count, created_at]
            properties:
              id: {type: string, format: uuid}
              slug: {type: string}
              name: {type: string}
              member_count: {type: integer}
              created_at: {type: string, format: date-time}
        next_cursor: {type: [string, 'null']}
    Member:
      type: object
      required: [user_id, display_name, email, role, joined_at]
      properties:
        user_id: {type: string, format: uuid}
        display_name: {type: string}
        email: {type: string}
        role: {type: string, enum: [owner, admin, member]}
        joined_at: {type: string, format: date-time}
    MemberPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Member'}
        next_cursor: {type: [string, 'null']}
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name, slug, owner_user_id]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        slug: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$'}
        owner_user_id: {type: string, format: uuid}
    UpdateOrganizationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        workspace_admin_invites_enabled: {type: boolean}
    AddMemberRequest:
      type: object
      additionalProperties: false
      required: [user_id, role]
      properties:
        user_id: {type: string, format: uuid}
        role: {type: string, enum: [owner, admin, member]}
    ChangeRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: {type: string, enum: [owner, admin, member]}
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          maxItems: 100
          items:
            type: object
            required: [id, created_at, last_seen_at, expires_at, current]
            properties:
              id: {type: string, format: uuid}
              created_at: {type: string, format: date-time}
              last_seen_at: {type: string, format: date-time}
              expires_at: {type: string, format: date-time, description: Earliest of idle expiry from the last recorded activity and the absolute expiry}
              current: {type: boolean}
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: {type: string, writeOnly: true}
        new_password: {type: string, writeOnly: true, minLength: 12, maxLength: 128}
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token: {type: string, writeOnly: true, description: The 43-character token from the reset link fragment}
        new_password: {type: string, writeOnly: true, minLength: 12, maxLength: 128}
    ResetLinkResponse:
      type: object
      required: [reset_url, expires_at]
      properties:
        reset_url: {type: string, description: "Shown once. Form: <public url>/reset-password#token=<token>"}
        expires_at: {type: string, format: date-time}
    Workspace:
      type: object
      required: [id, organization_id, slug, name, workspace_role, version, created_at]
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        slug: {type: string}
        name: {type: string}
        workspace_role: {type: [string, 'null'], enum: [admin, editor, viewer, null], description: "The caller's role in the workspace; null for organization managers without a grant"}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
    WorkspacePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Workspace'}
        next_cursor: {type: [string, 'null']}
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        slug: {type: string, description: 'Lowercase letters, digits and hyphens; unique within the organization'}
    UpdateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
    WorkspaceMember:
      type: object
      required: [user_id, display_name, email, role, joined_at]
      properties:
        user_id: {type: string, format: uuid}
        display_name: {type: string}
        email: {type: string}
        role: {type: string, enum: [admin, editor, viewer]}
        joined_at: {type: string, format: date-time}
    WorkspaceMemberPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/WorkspaceMember'}
        next_cursor: {type: [string, 'null']}
    AddWorkspaceMemberRequest:
      type: object
      additionalProperties: false
      required: [user_id, role]
      properties:
        user_id: {type: string, format: uuid}
        role: {type: string, enum: [admin, editor, viewer]}
    ChangeWorkspaceRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: {type: string, enum: [admin, editor, viewer]}
    Project:
      type: object
      required: [id, organization_id, workspace_id, name, version, created_by, created_at, updated_by, updated_at, deleted_at]
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 100}
        version: {type: integer, minimum: 1}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_by: {type: string, format: uuid}
        updated_at: {type: string, format: date-time}
        deleted_at: {type: [string, 'null'], format: date-time}
    ProjectPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Project'}
        next_cursor: {type: [string, 'null']}
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
    File:
      type: object
      required: [id, organization_id, workspace_id, project_id, name, app, format, size_bytes, sha256, head_version_id, version, created_by, created_at, updated_by, updated_at, deleted_at]
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 255, description: Untrusted display metadata; never a path}
        app: {type: string, pattern: '^[a-z0-9-]{1,32}$'}
        format: {type: string, pattern: '^[a-z0-9.+-]{1,64}$'}
        size_bytes: {type: integer, minimum: 0, description: 0 until a version exists}
        sha256: {type: [string, 'null'], description: Lowercase hex; null until a version exists}
        head_version_id: {type: [string, 'null'], format: uuid, description: Null until the first commit}
        version: {type: integer, minimum: 1}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_by: {type: string, format: uuid}
        updated_at: {type: string, format: date-time}
        deleted_at: {type: [string, 'null'], format: date-time}
    FilePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/File'}
        next_cursor: {type: [string, 'null']}
    CreateFileRequest:
      type: object
      additionalProperties: false
      required: [name, app, format]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        app: {type: string, pattern: '^[a-z0-9-]{1,32}$'}
        format: {type: string, pattern: '^[a-z0-9.+-]{1,64}$'}
    UpdateFileRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
    AdminUser:
      type: object
      required: [id, email, display_name, created_at, disabled, email_verified, origin]
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        display_name: {type: string}
        created_at: {type: string, format: date-time}
        disabled: {type: boolean}
        email_verified: {type: boolean}
        origin:
          description: Set for accounts created by accepting an invitation, otherwise null
          oneOf:
            - type: 'null'
            - type: object
              required: [organization_id, invited_by_user_id, invitation_id]
              properties:
                organization_id: {type: [string, 'null'], format: uuid}
                invited_by_user_id: {type: [string, 'null'], format: uuid}
                invitation_id: {type: string, format: uuid}
    AdminUserPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/AdminUser'}
        next_cursor: {type: [string, 'null']}
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, org_role]
      properties:
        email: {type: string, maxLength: 320}
        org_role: {type: string, enum: [admin, member]}
        workspace_id: {type: string, format: uuid, description: Requires workspace_role}
        workspace_role: {type: string, enum: [admin, editor, viewer], description: Requires workspace_id}
    CreatedInvitation:
      type: object
      required: [invitation_id, invite_url, expires_at]
      properties:
        invitation_id: {type: string, format: uuid}
        invite_url:
          type: string
          description: Shown once. `<PUBLIC_URL>/invite#token=<token>`; treat as a secret.
        expires_at: {type: string, format: date-time}
    Invitation:
      type: object
      required: [id, email, org_role, workspace_id, workspace_role, status, created_by, created_at, expires_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        org_role: {type: string, enum: [admin, member]}
        workspace_id: {type: [string, 'null'], format: uuid}
        workspace_role: {type: [string, 'null'], enum: [admin, editor, viewer, null]}
        status: {type: string, enum: [pending, accepted, revoked, expired, invalid]}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    InvitationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Invitation'}
        next_cursor: {type: [string, 'null']}
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {type: string, writeOnly: true}
        display_name: {type: string, minLength: 1, maxLength: 100, description: Required when no account exists for the address}
        password: {type: string, writeOnly: true, description: Required when no account exists for the address}
    AcceptedInvitation:
      type: object
      required: [user_id, organization_id, workspace_id, account_created, workspace_role_applied]
      properties:
        user_id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        workspace_id: {type: [string, 'null'], format: uuid}
        account_created: {type: boolean}
        workspace_role_applied: {type: boolean, description: False when an existing equal or higher workspace role was kept}
        csrf_token: {type: string, description: Only when an account was created and logged in}
        expires_at: {type: string, format: date-time, description: Session expiry, only when a session was issued}
  responses:
    ForbiddenOrCsrf:
      description: FORBIDDEN (authenticated but not allowed) or CSRF_FAILED
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InvalidCursor:
      description: The cursor is malformed or belongs to another listing or scope (INVALID_CURSOR)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PayloadTooLarge:
      description: Request body exceeds the configured limit (code PAYLOAD_TOO_LARGE)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Timeout:
      description: Handler exceeded the time limit (code TIMEOUT)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalError:
      description: Internal error (INTERNAL)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ServiceUnavailable:
      description: AUTH_UNAVAILABLE (no database configured or reachable, or CRAFTCLOUD_PUBLIC_URL missing where a link must be built) or TIMEOUT (handler timeout)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnsupportedMediaType:
      description: Content-Type is not application/json (UNSUPPORTED_MEDIA_TYPE)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    BodyInvalid:
      description: >-
        VALIDATION_ERROR. Without details when the body cannot be parsed (invalid JSON, unknown or missing
        field); with details.fields (field names only) for semantic validation such as the password policy.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InvalidCredentials:
      description: E-mail address or password is incorrect (INVALID_CREDENTIALS); identical for every kind of failure
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    CsrfFailed:
      description: CSRF header or Origin check failed (CSRF_FAILED)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: Too many requests (RATE_LIMITED); Retry-After gives the seconds to wait. Counters are in memory (single instance) and cleared by a restart.
      headers:
        Retry-After: {schema: {type: integer, minimum: 1}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: >-
        No valid session (UNAUTHENTICATED): missing, malformed, expired (idle 8 h or absolute 7 d by default) or revoked
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource not visible to requester (NOT_FOUND); unknown ids and ids of other tenants are indistinguishable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: State conflict without precondition (e.g. setup already completed, idempotency key reused with a different payload)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
