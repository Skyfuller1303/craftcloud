openapi: 3.1.0
info:
  title: CraftCloud Core API — proposal sketch
  version: 0.0.0-rfc
  description: >-
    RFC EXAMPLE ONLY. Not deployed, not an upstream contract, deliberately incomplete. Contains only operations that the server implements (checked by crates/craftcloud-api/tests/contract.rs); upload and version endpoints are added with their features.
    Authorization details and full response schemas must be decided before implementation.
servers:
  - url: https://craftcloud.example.invalid/api/v1
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: Health
  - name: Setup
  - name: Auth
  - name: Admin
  - name: Organizations
  - name: Members
  - name: Discovery
  - name: Workspaces
  - name: Invitations
  - name: Projects
  - name: Files
  - name: Uploads
  - name: Versions
  - name: Quota
  - name: Audit
paths:
  /health/live:
    get:
      tags: [Health]
      security: []
      summary: Liveness only; no dependency details
      description: Path is relative to the server root, not /api/v1 (see CC-F15).
      servers:
        - url: https://craftcloud.example.invalid
      responses:
        '200': {description: Process is alive}
        '503': {$ref: '#/components/responses/Timeout'}
  /health/ready:
    get:
      tags: [Health]
      security: []
      summary: Readiness for the reverse proxy and container health checks; no dependency details
      description: >-
        Path is relative to the server root, not /api/v1 (see CC-F15). Checks, with a short timeout each and a result
        cached for a few seconds: the database answers a query, the schema is migrated, and, when an object store is
        configured, a file can be written and read in it and it belongs to this database. 200 `ready`: send traffic.
        200 `degraded`: serving works, but database and object store disagree about their epoch (a restore is
        suspected) and destructive maintenance is blocked, or the object store was refused because it belongs to
        another database (only file uploads and downloads answer 503); the operator must look at `/admin/health`.
        During shutdown the answer is 503 at once (draining). 503 `NOT_READY`
        in the common error shape: do not send traffic. The body never names components, errors, counts or versions.
        Liveness (`/health/live`) does not depend on any of this, so a transient database outage never restarts the
        process.
      servers:
        - url: https://craftcloud.example.invalid
      responses:
        '200':
          description: Ready or degraded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
        '503':
          description: NOT_READY
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /setup/status:
    get:
      tags: [Setup]
      security: []
      summary: Generic setup state without secrets (CC-F01)
      description: Reveals only whether setup is still required. Answers 503 SETUP_UNAVAILABLE when no database is configured or reachable.
      responses:
        '200':
          description: Setup state
          content:
            application/json:
              schema:
                type: object
                required: [setup_required]
                properties:
                  setup_required: {type: boolean}
        '500':
          description: Internal error (INTERNAL)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: SETUP_UNAVAILABLE (no database configured or reachable) or TIMEOUT
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /setup/complete:
    post:
      tags: [Setup]
      security: []
      summary: One-shot creation of the initial instance operator (CC-F01)
      description: >-
        Creates exactly one instance operator, one organization and the operator's owner membership in a
        single transaction. The bootstrap token comes from the file configured by the operator
        (CRAFTCLOUD_BOOTSTRAP_SECRET_FILE); the server never generates or prints one. No session is created.
        Order of checks: (1) 503 SETUP_UNAVAILABLE if no database is configured or reachable; (2) an
        unparsable body, unknown field or missing field (including a missing bootstrap_token) answers 422
        VALIDATION_ERROR without details, 415 or 413, before the token is looked at and independent of any
        state; (3) 403 INVALID_BOOTSTRAP_TOKEN for a wrong token and, identically, when no bootstrap secret
        is configured on the server (callers cannot tell the two apart; the reason is only logged), also
        independent of whether setup was completed; (4) 409 SETUP_ALREADY_COMPLETED, only for a valid
        token; (5) 422 VALIDATION_ERROR with details.fields for semantic field validation only. There is
        no rate limit on this route (tokens have at least 32 characters); a generic limiter follows with
        the session work.

        The request is subject to the global handler timeout (503 TIMEOUT) without exemption. If a request
        times out or the connection drops while the server was committing, setup may nevertheless have
        succeeded: the client must re-check GET /setup/status (setup_required false) before retrying.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetupCompleteRequest'}
      responses:
        '201':
          description: Initial operator and organization created; setup routes are closed afterwards
          content:
            application/json:
              schema:
                type: object
                required: [user_id, organization_id]
                properties:
                  user_id: {type: string, format: uuid}
                  organization_id: {type: string, format: uuid}
        '403':
          description: >-
            Wrong bootstrap token or no bootstrap secret configured (both INVALID_BOOTSTRAP_TOKEN, indistinguishable)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Setup already completed (SETUP_ALREADY_COMPLETED), only for a valid token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415':
          description: Content-Type is not application/json (UNSUPPORTED_MEDIA_TYPE)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: >-
            VALIDATION_ERROR. Without details when the body cannot be parsed (invalid JSON, unknown or missing
            field). With details.fields (invalid field names only, e.g. email, display_name, password,
            organization.name, organization.slug) for semantic field validation, which is only reached with a
            valid token. Values are never echoed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: Internal error (INTERNAL), for example a failed database operation or password hashing
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: >-
            SETUP_UNAVAILABLE (no database configured or reachable) or TIMEOUT (handler timeout; setup may
            have been committed, re-check GET /setup/status)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Log in with e-mail and password (CC-F02)
      description: >-
        Creates a session and sets the session cookie. Unknown e-mail, wrong password, accounts without a
        password and disabled accounts all answer an identical 401 INVALID_CREDENTIALS after the same amount
        of hashing work. Rate limits: requests per client address (IPv4 exact, IPv6 /64) and, counting only
        failed logins, per account and address (5 per 15 minutes) and per account over all addresses (50 per
        15 minutes); a successful login resets the counter of its address. Both answer 429 RATE_LIMITED with
        Retry-After, and unknown e-mail addresses behave exactly like registered ones. A login that presents a
        still valid session cookie revokes that old session. The session is only created if the password hash
        is still the verified one (a reset that commits meanwhile makes the login fail with 401). The Origin
        check applies (login CSRF); there is no CSRF token yet. No hard lockout.
        With enabled TOTP, password verification only creates a five-minute challenge and returns
        401 SECOND_FACTOR_REQUIRED with error.details.challenge_id. No session is issued until
        POST /auth/login/second-factor succeeds. Challenges are bound to the account, client address and
        login kind, permit at most five attempts and are single use. Codes and challenge IDs must not be logged.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Logged in; Set-Cookie carries the session cookie
          headers:
            Set-Cookie: {schema: {type: string}, description: Session cookie (see securitySchemes.cookieAuth)}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '401': {$ref: '#/components/responses/LoginChallengeOrInvalid'}
        '403': {$ref: '#/components/responses/CsrfFailed'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/device/login:
    post:
      tags: [Auth]
      security: []
      summary: Create a desktop device session (AC-01)
      description: >-
        Requires TLS, except for an explicitly configured loopback public URL. Trusted-proxy rules apply.
        Uses the same password verification, unknown-account timing and rate-limit counters as browser login.
        No cookie is set. Both tokens contain 256 random bits and are stored only as SHA-256 hashes.
        With enabled TOTP, returns 401 SECOND_FACTOR_REQUIRED with error.details.challenge_id instead of
        tokens. The challenge lasts five minutes, permits five attempts and binds the validated device metadata,
        account, client address and device login kind. Complete it at /auth/device/login/second-factor.
        Browser challenges cannot be used here or vice versa. Cookie plus Bearer is rejected
        with 400 AMBIGUOUS_CREDENTIALS. Responses must not be cached or logged.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceLoginRequest'}
      responses:
        '200':
          description: Device session created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceLoginResponse'}
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '401':
          description: INVALID_CREDENTIALS or SECOND_FACTOR_REQUIRED with error.details.challenge_id
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/login/second-factor:
    post:
      tags: [Auth]
      security: []
      summary: Complete a browser login with TOTP or a recovery code (AC-02)
      description: >-
        Requires the unexpired browser challenge issued after password verification, from the same client
        address. Accepts exactly one of code or recovery_code. Successful proof atomically consumes the
        challenge and the TOTP timestep or recovery code before issuing the browser session.
        Origin checks and existing per-account and per-address login limits apply. Failed proofs count
        toward the login limits and the five-attempt challenge budget. Challenges invalidated by credential
        changes, reset or account disabling cannot create a session. Each account also keeps a persistent
        counter of consecutive failed proofs (TOTP and recovery codes alike, browser and device). After 100
        failures every further attempt answers 401 INVALID_CREDENTIALS, even with a valid code, until an
        operator clears the factor (reset link with reset_two_factor or the CLI); a successful proof resets
        the counter. Response is never cacheable.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SecondFactorLoginRequest'}
      responses:
        '200':
          description: Logged in; Set-Cookie carries the new session cookie
          headers:
            Set-Cookie: {schema: {type: string}, description: Session cookie}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '403': {$ref: '#/components/responses/CsrfFailed'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/device/login/second-factor:
    post:
      tags: [Auth]
      security: []
      summary: Complete a device login with TOTP or a recovery code (AC-02)
      description: >-
        Requires TLS except for a configured loopback instance, and a device challenge from the same
        client address. Device name, client kind and client id were validated and captured at the initial
        password step and cannot be replaced here. Browser challenges are rejected. Challenge lifetime,
        one-time proof consumption and login rate limits match the browser second-factor route.
        The persistent 100-failure account lock described for the browser route applies here as well.
        No cookie is issued; keep the resulting refresh token in the operating system keychain.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SecondFactorLoginRequest'}
      responses:
        '200':
          description: Device session created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceLoginResponse'}
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/2fa:
    get:
      tags: [Auth]
      summary: Read own second-factor status without secrets
      responses:
        '200':
          description: Current enrollment, server availability and remaining recovery-code count
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TwoFactorStatus'}
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/2fa/setup:
    post:
      tags: [Auth]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Start own TOTP enrollment after password reauthentication
      description: >-
        Generates a fresh 160-bit secret and stores it encrypted. Enrollment is not active until confirm.
        Render the otpauth URL as a QR code locally; never send it to an external QR service or persist it
        in browser storage. Missing current encryption key returns 503 TWO_FACTOR_UNAVAILABLE. 409 carries
        TWO_FACTOR_ALREADY_ENABLED (a factor is active) or TWO_FACTOR_SETUP_PENDING (another session holds a
        live pending setup); a vanished session or changed password answers 401 INVALID_CREDENTIALS.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TwoFactorSetupRequest'}
      responses:
        '200':
          description: Pending enrollment secret; no-store and never log this response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TwoFactorSetupResponse'}
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/TwoFactorForbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/2fa/confirm:
    post:
      tags: [Auth]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Activate pending TOTP enrollment and return recovery codes once
      description: >-
        Verifies RFC-6238 HMAC-SHA-1 TOTP, six digits, 30-second period, plus or minus one step.
        The accepted timestep cannot be reused. Activation and revocation of other browser and device
        sessions commit atomically. Ten recovery codes are returned exactly once; keep them offline.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TwoFactorConfirmRequest'}
      responses:
        '200':
          description: Enabled; recovery codes shown only in this response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecoveryCodesResponse'}
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/TwoFactorForbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/2fa/disable:
    post:
      tags: [Auth]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Disable own second factor with password and a second-factor proof
      description: >-
        Invalidates enrollment and recovery codes and revokes other browser and device sessions atomically.
        A wrong proof counts toward the persistent per-account failure cap (100, see the login second-factor
        routes). While the account is locked this route answers 401 INVALID_CREDENTIALS even with a valid
        proof; only an operator reset clears the factor.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TwoFactorDisableRequest'}
      responses:
        '204': {description: Second factor disabled}
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/TwoFactorForbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/2fa/recovery-codes:
    post:
      tags: [Auth]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Replace all own recovery codes after second-factor verification
      description: >-
        Accepts exactly one TOTP code or an unused recovery code. Invalidates every old recovery code
        and returns ten new codes once. Only salted hashes are stored; plaintext codes are never retrievable.
        A wrong proof counts toward the persistent 100-failure account cap, and a locked account is refused
        with 401 INVALID_CREDENTIALS until an operator reset.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SecondFactorProof'}
      responses:
        '200':
          description: Replacement recovery codes shown once
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecoveryCodesResponse'}
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/TwoFactorForbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/device/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Rotate a device session's access and refresh tokens
      description: >-
        Requires TLS except for an explicitly configured loopback instance. Rotation is atomic. The previous
        access token stops working immediately. Reusing any rotated refresh token revokes the whole family
        with reason refresh_reuse. There is no grace period or automatic retry: clients must serialize refresh
        requests and sign in again after a lost response. Refresh idle lifetime is extended to at most the
        original absolute expiry. Unknown, malformed, expired, revoked and reused tokens all answer
        401 REFRESH_TOKEN_INVALID. A refresh token is accepted only in the body, never in a URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: {type: string, writeOnly: true}
      responses:
        '200':
          description: Replacement tokens; retain the new refresh token in the operating system keychain
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceTokenResponse'}
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '401': {$ref: '#/components/responses/RefreshTokenInvalid'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/device/logout:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Revoke the device session authenticated by Bearer
      description: Requires TLS except for an explicitly configured loopback instance. Cookie authentication alone is not accepted.
      responses:
        '204': {description: Device session revoked}
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/devices:
    get:
      tags: [Auth]
      summary: List the own active desktop devices
      description: Contains display metadata only, never token hashes or tokens. No operator or organization-admin override.
      responses:
        '200':
          description: Own devices
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceList'}
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/devices/{id}:
    delete:
      tags: [Auth]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
        - bearerAuth: []
      summary: Revoke one of the own desktop device sessions
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Device revoked}
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/CsrfFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/session:
    get:
      tags: [Auth]
      summary: Current session (CC-F02)
      description: Returns the authenticated account and the CSRF token. 401 UNAUTHENTICATED without a valid, unexpired, unrevoked session.
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '200':
          description: Current session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionInfo'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/email-verification:
    post:
      tags: [Auth]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Send an address verification link to the current account
      description: >-
        Always returns the same generic 202 for verified and unverified accounts. Requires active email delivery;
        request limits are durable per recipient/template and actor. The token is encrypted in the outbox and never
        returned in the response.
      responses:
        '202': {description: Generic verification request accepted, content: {application/json: {schema: {$ref: '#/components/schemas/EmailRequestResponse'}}}}
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/email-verification/confirm:
    post:
      tags: [Auth]
      security: []
      summary: Confirm the current account address
      description: Requires a matching Origin for browser requests; optionally accepts a valid session and enforces CSRF for cookie credentials. Rate limited by client address.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailTokenRequest'}
      responses:
        '204': {description: Address verified}
        '400': {description: INVALID_EMAIL_TOKEN or invalid body, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/email-change:
    post:
      tags: [Auth]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Request a verified change to the current account address
      description: >-
        Requires the current password and, when TOTP is active, exactly one current TOTP or recovery code. The proof
        is rechecked and consumed under the account lock with the pending address and encrypted mail outbox writes.
        A confirmation link goes to the new address and a no-link security notice goes to the old address. The old
        address stays active until confirmation. A target already in use produces the same generic response as a queued request. Response never returns the link.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailChangeRequest'}
      responses:
        '202': {description: Generic request accepted, content: {application/json: {schema: {$ref: '#/components/schemas/EmailRequestResponse'}}}}
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/email-change/confirm:
    post:
      tags: [Auth]
      security: []
      summary: Confirm and apply a pending account address change
      description: Requires a matching Origin for browser requests; optionally accepts a valid session and enforces CSRF for cookie credentials. Rate limited by client address. Invalid, expired, consumed and stale proofs share one error.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailTokenRequest'}
      responses:
        '204': {description: Address changed and verified}
        '400': {description: INVALID_EMAIL_TOKEN or invalid body, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/email-delivery:
    get:
      tags: [Admin]
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: Read aggregate email delivery status (instance operator only)
      responses:
        '200': {description: Delivery status, content: {application/json: {schema: {$ref: '#/components/schemas/EmailDeliveryStatus'}}}}
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/email-delivery/test:
    post:
      tags: [Admin]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Queue a test message to the operator's own address
      responses:
        '202': {description: Test message queued, content: {application/json: {schema: {$ref: '#/components/schemas/EmailRequestResponse'}}}}
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/users/email-verification:
    post:
      tags: [Admin]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Queue verification messages for unverified accounts (instance operator only)
      description: >-
        Processes at most 500 eligible accounts after the optional cursor. Continue with `next_cursor` while it is
        non-null. A response with `limited=true` stopped at the durable actor limit; retry after `retry_after_seconds`
        using the returned cursor.
      parameters:
        - in: query
          name: after
          required: false
          schema: {type: string, format: uuid}
      responses:
        '202': {description: Batch accepted, content: {application/json: {schema: {$ref: '#/components/schemas/EmailVerificationBatchResponse'}}}}
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/profile:
    patch:
      tags: [Auth]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Change the own display name (AC-08b)
      description: >-
        Self-service profile edit. Only `display_name` can be changed: it is trimmed and must have 1 to 100 characters
        without control or invisible formatting characters, otherwise 422 VALIDATION_ERROR with details.fields
        ["display_name"]. The e-mail address cannot be changed here; it stays operator-managed until e-mail delivery
        exists. Records the audit event `auth.profile_updated` (actor and target: the caller) without the name value.
        Returns the updated account like `GET /auth/session`. A name that equals the current one changes nothing and
        records no audit event (still 200). Rate limited to 20 changes per minute and user (429 RATE_LIMITED).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProfileRequest'}
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '200':
          description: Updated account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionInfo'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/sessions:
    get:
      tags: [Auth]
      summary: List the own active sessions (device list)
      description: >-
        Active (not revoked, not expired) sessions of the current user, newest first, at most 100. Contains no
        network or device data (no IP address, no user agent) and never a token.
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '200':
          description: Own active sessions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/sessions/{session_id}:
    delete:
      tags: [Auth]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Revoke one of the own sessions
      description: >-
        Only own sessions can be revoked. Another user's, unknown and already revoked sessions all answer 404.
        Revoking the current session also clears the cookie.
      parameters:
        - in: path
          name: session_id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '204': {description: Session revoked}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/CsrfFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/logout:
    post:
      tags: [Auth]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Log out the current session
      description: >-
        Revokes the session and clears the cookie. A 401 answer also carries a Set-Cookie that clears the
        stale cookie.
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '204': {description: Logged out; Set-Cookie clears the session cookie}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/CsrfFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/logout-all:
    post:
      tags: [Auth]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Log out all sessions of the account
      description: Revokes every session of the account and clears the cookie (also on a 401 answer).
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '204': {description: All sessions of the account revoked; the cookie is cleared}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/CsrfFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/password/change:
    post:
      tags: [Auth]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Change the own password
      description: >-
        Requires the current password (wrong: 403 INVALID_CURRENT_PASSWORD; rate limited to 5 per minute and
        user). Revokes all other sessions of the account and voids pending reset links; the current browser session
        stays valid. All device sessions, including the caller when using Bearer, are revoked. Policy violations of the new password answer 422 VALIDATION_ERROR with details.fields
        ["new_password"].
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '204': {description: Password changed}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: CSRF_FAILED or INVALID_CURRENT_PASSWORD
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/password-reset:
    post:
      tags: [Auth]
      security: []
      summary: Complete a password reset with a reset token
      description: >-
        Anonymous, rate limited per client address. Unknown, malformed, expired, used, voided and
        disabled-account tokens all answer an identical 400 INVALID_RESET_TOKEN. A valid token with a password
        that violates the policy answers 422 and stays usable. Success sets the password, consumes the token
        and revokes every session of the account. Tokens are single use and valid for one hour.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '204': {description: Password set; all sessions revoked}
        '400':
          description: INVALID_RESET_TOKEN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/users/{user_id}/password-reset:
    parameters:
      - in: path
        name: user_id
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Admin]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Issue and deliver a password reset link (instance operator only)
      description: >-
        Until the policy engine (PR-006) only the instance operator recorded by the one-time setup may call
        this (others: 403 FORBIDDEN). Issuing a link is a compromise response (ADR-0013): it immediately
        revokes every active session of the target account and voids older pending links of that account. With
        active delivery the encrypted outbox sends the link and the response contains only the recipient. With
        delivery disabled the link is returned once; only its hash is stored. The token sits in the URL fragment so it is
        not sent to servers or in Referer headers. Requires CRAFTCLOUD_PUBLIC_URL (otherwise 503
        AUTH_UNAVAILABLE). Disabled accounts: 409 ACCOUNT_DISABLED. Offline alternative:
        craftcloud-server admin issue-password-reset --email <address>.
        Optional reset_two_factor=true also clears the target's TOTP enrollment and recovery codes
        when issuing the link, in the same transaction, and records auth.two_factor_reset.
        Omission preserves the existing second factor. Offline second-factor reset:
        craftcloud-server admin user reset-2fa <email>.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IssuePasswordResetRequest'}
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '201':
          description: Reset link issued with delivery disabled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResetLinkResponse'}
        '202':
          description: Reset link queued for delivery
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailQueuedResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: CSRF_FAILED or FORBIDDEN (not the instance operator)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: ACCOUNT_DISABLED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      tags: [Admin]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Void pending password reset links (instance operator only)
      description: Voids every unused reset link of the account without touching its sessions. Idempotent.
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '204': {description: Pending links voided (or none existed)}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: CSRF_FAILED or FORBIDDEN (not the instance operator)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /organizations:
    get:
      tags: [Organizations]
      summary: List the organizations the caller is a member of (CC-F04)
      description: >-
        Active memberships of the authenticated user, ordered by (created_at, id), keyset paginated. Cursors are
        opaque, bound to the listing and the user, and not signed (see api-conventions).
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MyOrganizationPage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [Organizations, Admin]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Create an organization (instance operator only)
      description: >-
        Creates the organization and the owner membership of owner_user_id (an existing, enabled user; may be the
        operator) in one transaction. Self-service creation does not exist (ADR-0013). Other callers: 403
        FORBIDDEN. Invalid name/slug, unknown or disabled owner and a taken slug answer 422 VALIDATION_ERROR with
        details.fields.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOrganizationRequest'}
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '201':
          description: Created
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "org-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedOrganization'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: CSRF_FAILED or FORBIDDEN (not the instance operator)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /organizations/{org_id}:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
    get:
      tags: [Organizations]
      summary: Read an organization (members only)
      description: >-
        Non-members, the instance operator without membership and unknown ids all answer an identical 404
        NOT_FOUND (no existence leak). The ETag is the version for PATCH.
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '200':
          description: The organization with the caller's role
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    patch:
      tags: [Organizations]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Rename an organization (owner and admin)
      description: >-
        Order of checks: authentication and CSRF, 404 (not a member), 403 FORBIDDEN (plain member), 422 invalid
        name, 428 PRECONDITION_REQUIRED without If-Match, 412 VERSION_CONFLICT if the If-Match ETag is not the
        current version (the current ETag is returned in the response header).
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: {type: string, example: '"org-v1"'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateOrganizationRequest'}
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '200':
          description: Updated; the new ETag is in the header
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412':
          description: VERSION_CONFLICT
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '428':
          description: PRECONDITION_REQUIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /organizations/{org_id}/members:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
    get:
      tags: [Members]
      summary: List the members of an organization (any member)
      description: >-
        Without administrative filters, preserves the existing active-member list and response shape. Any of `role`, `status`, `two_factor`, or `sort` requires an organization owner or admin and returns administrative status fields; status defaults to `all` in that mode. Sort is allow-listed and keyset paginated with cursors bound to organization and filters; cursors contain ids, never names or e-mail addresses. The optional `query` searches names and e-mail addresses, requires grant-management rights in at least one workspace (403 otherwise), and is rate limited per user (429). Non-members and unknown organizations answer 404.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {in: query, name: query, required: false, schema: {type: string, minLength: 2, maxLength: 100}}
        - {in: query, name: role, required: false, schema: {type: string, enum: [owner, admin, member, guest]}}
        - {in: query, name: status, required: false, schema: {type: string, enum: [active, invited, disabled, all]}}
        - {in: query, name: two_factor, required: false, schema: {type: string, enum: [enabled, disabled]}}
        - {in: query, name: sort, required: false, schema: {type: string, enum: [joined_asc, joined_desc, name_asc, name_desc]}}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberPage'}
        '400': {description: 'INVALID_CURSOR or AMBIGUOUS_CREDENTIALS', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [Members]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Add an existing user as member (owner and admin)
      description: >-
        Owners may assign any role; admins only member and admin, never owner (403). Plain members: 403,
        non-members: 404. An unknown user id answers 404 only after the permission check passed (no user
        enumeration for others); an already active membership answers 409 ALREADY_MEMBER, a disabled account
        409 ACCOUNT_DISABLED. An invited or disabled membership row is reactivated with the given role. People without an account are onboarded by invitation (POST /organizations/{org_id}/invitations).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddMemberRequest'}
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '201':
          description: Added
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: ALREADY_MEMBER or ACCOUNT_DISABLED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /organizations/{org_id}/members/{user_id}:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
      - in: path
        name: user_id
        required: true
        schema: {type: string, format: uuid}
    patch:
      tags: [Members]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Change a member's role (owner and admin)
      description: >-
        Owners may set any role. Admins may set member/admin on members and admins (including themselves) and never
        touch owners (403). The last *enabled* owner cannot be demoted (409 LAST_OWNER; owners whose account is
        disabled do not count); membership changes and renames of one organization are serialized so concurrent
        requests cannot leave it without an owner. Only active members can be changed. An unknown target is
        404 for owners and admins and 403 for plain members.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeRoleRequest'}
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '200':
          description: Role changed (or already set)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: LAST_OWNER
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      tags: [Members]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Remove a member or leave the organization
      description: >-
        Owners may remove anybody, admins members and admins (not owners), and every member may remove themselves
        (leave). The user's workspace grants in the organization are removed with the membership. The last owner
        cannot be removed (409 LAST_OWNER). A membership row of any status (also invited or disabled) can be removed.
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '204': {description: Removed}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: LAST_OWNER
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/organizations:
    get:
      tags: [Admin, Organizations]
      summary: Organization metadata of the whole instance (operator only)
      description: >-
        Id, slug, name, creation time and member count only: no member lists, no user data, no files. The operator
        has no access to organization contents through this route.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationSummaryPage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/maintenance:
    get:
      tags: [Admin]
      summary: Status of the maintenance job (operator only)
      description: >-
        The newest finished maintenance run: trigger (`scheduled` for the loop inside the server, `cli` for
        `craftcloud-server admin maintenance`), start and end time, duration, the counts per step and the error codes
        of steps that failed (`DATABASE_ERROR`). `last_run` is null until a run has finished; dry runs are not recorded.
        The report contains counts and error codes only: no organization, file, user or storage data. Other callers: 403.
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '200':
          description: The status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MaintenanceStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/health:
    get:
      tags: [Admin]
      summary: Detailed health of the instance (operator only)
      description: >-
        Status per component (database with pool usage, migrations, object store with binding state and free bytes
        of its volume), open and overdue upload sessions, the last maintenance run and whether an epoch conflict
        blocks destructive maintenance, the audit events dropped under load (counters of this process), server
        version and uptime, and the age of the last successful backup (from the audit event `backup.created` written
        by `craftcloud-server admin backup create`; null if there is none). Numbers, flags and error codes only: no organization, user, file or storage path. `free_bytes` is
        null when it cannot be measured (the server asks `df`; not available on Windows or in an image without it).
        Other callers: 403; anonymous callers: 401. Not cached.
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '200':
          description: The health view
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminHealth'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/audit:
    get:
      tags: [Audit]
      summary: List the instance-level audit events (operator only)
      description: >-
        Events that belong to no organization (setup, logins and login failures, operator actions, storage binding, maintenance). Organization events are not included: the operator has no implicit access to tenant data. Append-only record of security-relevant actions: who (`actor_id`), what (`action`, a stable dotted code such as `member.add`), to which object (`target`), where (`workspace_id`), with which `result` (`success`, `denied`, `failed`) and the `request_id` of the request. Events contain identifiers and codes only: no names, e-mail addresses, tokens, passwords, file content or IP addresses (ADR-0016). Filters combine with AND: `action` matches the code and everything below it (`member` matches `member.add`), `from` is inclusive and `to` exclusive (RFC 3339). Keyset paginated by (time, id), newest first; equal timestamps keep a stable order; the cursor is bound to this listing. Denied requests and login failures are aggregated: one row per actor, action and 15-minute window with a `count`. Other callers: 403.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/AuditAction'}
        - {$ref: '#/components/parameters/AuditActor'}
        - {$ref: '#/components/parameters/AuditTarget'}
        - {$ref: '#/components/parameters/AuditWorkspace'}
        - {$ref: '#/components/parameters/AuditResult'}
        - {$ref: '#/components/parameters/AuditFrom'}
        - {$ref: '#/components/parameters/AuditTo'}
      responses:
        '200':
          description: One page, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditEventPage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/audit/export:
    get:
      tags: [Audit]
      summary: Export the instance-level audit events as NDJSON (operator only)
      description: >-
        Like the organization export, for the instance-level events. Other callers: 403.
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/AuditAction'}
        - {$ref: '#/components/parameters/AuditActor'}
        - {$ref: '#/components/parameters/AuditTarget'}
        - {$ref: '#/components/parameters/AuditWorkspace'}
        - {$ref: '#/components/parameters/AuditResult'}
        - {$ref: '#/components/parameters/AuditFrom'}
        - {$ref: '#/components/parameters/AuditTo'}
      responses:
        '200':
          description: One NDJSON line per event, newest first
          headers:
            X-Content-Type-Options: {schema: {type: string, enum: [nosniff]}}
            Content-Disposition: {schema: {type: string}, description: 'attachment; filename="audit.ndjson"'}
          content:
            application/x-ndjson:
              schema: {$ref: '#/components/schemas/AuditEvent'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/users:
    get:
      tags: [Admin]
      summary: List the accounts of the instance (operator only)
      description: >-
        Instance-level account metadata, no organization data: id, address, display name, creation time, disabled flag,
        email_verified and, for accounts created by an invitation, the origin (organization, inviting user, invitation).
        email_verified reflects whether that account completed the e-mail verification flow (also for the setup
        operator). Use `?unverified=true` to list accounts without verified address. This is the operator's tool
        against account squatting: an inviter who accepts their own link creates an instance-wide account for an
        address they may not own; the operator can see who created it and disable it
        (POST /admin/users/{user_id}/disable); recovery for the real owner of the address is a manual operator
        procedure (see the deployment guide). Keyset paginated
        (creation time, id; the cursor is bound to the filter and contains no personal data). Other callers: 403.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - in: query
          name: unverified
          required: false
          schema: {type: boolean, default: false}
        - in: query
          name: query
          required: false
          schema: {type: string, minLength: 2, maxLength: 100}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUserPage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/users/{user_id}/devices:
    parameters:
      - in: path
        name: user_id
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Admin]
      summary: List one account's active device sessions (operator only)
      description: Returns device metadata and opaque device_ref values, newest first. Keyset paginated by (creation time, device_ref); a cursor stays valid when its boundary device was revoked in the meantime. Never returns session ids or credentials.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Active devices
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminDevicePage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/users/{user_id}/devices/{device_ref}:
    parameters:
      - in: path
        name: user_id
        required: true
        schema: {type: string, format: uuid}
      - in: path
        name: device_ref
        required: true
        schema: {type: string, pattern: '^ds_[a-f0-9]{64}$'}
    delete:
      tags: [Admin]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Revoke one account device session (operator only)
      description: Revokes the matching device session, deletes its file leases, and audits the operator actor.
      responses:
        '204': {description: Revoked; no response body}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /organizations/{org_id}/grants:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
    get:
      tags: [Organizations]
      summary: List active grants in an organization
      description: Owners/admins see all workspaces; workspace admins see only their own admin workspaces. Other members get 403; non-members and unknown organizations get 404. Cursor binds org and filters.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/WorkspaceIdQuery'}
        - {$ref: '#/components/parameters/UserIdQuery'}
        - {in: query, name: target_kind, required: false, schema: {type: string, enum: [project, file]}}
      responses:
        '200': {description: One page, oldest first, content: {application/json: {schema: {$ref: '#/components/schemas/GrantPage'}}}}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /organizations/{org_id}/locks:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
    get:
      tags: [Organizations]
      summary: List active file locks in an organization
      description: Owners/admins see all workspaces; workspace admins see only their own admin workspaces. Responses omit session ids and credentials.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/WorkspaceIdQuery'}
        - {$ref: '#/components/parameters/UserIdQuery'}
      responses:
        '200': {description: One page, oldest first, content: {application/json: {schema: {$ref: '#/components/schemas/LockPage'}}}}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/users/{user_id}/disable:
    post:
      tags: [Admin]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Disable an account (operator only)
      description: >-
        Revokes every session of the account, voids its pending reset links and refuses further logins. Idempotent.
        The instance operator cannot be disabled (409 CANNOT_DISABLE_OPERATOR). Memberships stay, so enabling the
        account restores access. Disabling is never blocked by the last-owner rule (a security response must not be
        blocked): the 200 response lists the organizations that are left without an enabled owner
        (orphaned_organization_ids, empty if none); the server logs a warning and the host operator can recover them
        with `craftcloud-server admin set-org-owner --org <slug> --email <address>`.
      parameters:
        - {in: path, name: user_id, required: true, schema: {type: string, format: uuid}}
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '200':
          description: Disabled (or already disabled); lists organizations without an enabled owner
          content:
            application/json:
              schema:
                type: object
                required: [orphaned_organization_ids]
                properties:
                  orphaned_organization_ids:
                    type: array
                    maxItems: 1000
                    items: {type: string, format: uuid}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: CANNOT_DISABLE_OPERATOR
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/users/{user_id}/enable:
    post:
      tags: [Admin]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Enable an account (operator only)
      description: Idempotent. Earlier sessions stay revoked.
      parameters:
        - {in: path, name: user_id, required: true, schema: {type: string, format: uuid}}
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '204': {description: Enabled (or already enabled)}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /info:
    get:
      tags: [Discovery]
      security: []
      summary: Discover supported server/API capabilities
      responses:
        '200':
          description: Server capabilities
          content:
            application/json:
              schema:
                type: object
                required: [api_version, features, server_mode, server_version, feature_flags, limits, formats]
                properties:
                  api_version: {type: string, example: '1.0'}
                  server_version: {type: string, example: '0.0.0'}
                  feature_flags:
                    type: object
                    required: [device_login, two_factor, grants, locks, figcraft_live]
                    properties:
                      device_login: {type: boolean}
                      two_factor: {type: boolean}
                      grants: {type: boolean}
                      locks: {type: boolean}
                      figcraft_live: {type: boolean}
                  limits:
                    type: object
                    required: [max_file_size, block_size]
                    properties:
                      max_file_size: {type: integer, minimum: 1, description: Configured maximum file size in bytes}
                      block_size: {type: integer, minimum: 1, description: Recommended streaming buffer size in bytes; uploads are single streaming PUT requests}
                  formats:
                    type: array
                    description: Descriptive extension registry; generic with an empty extension list accepts unknown formats. Contents remain opaque.
                    items:
                      type: object
                      required: [app, extensions]
                      properties:
                        app: {type: string}
                        extensions:
                          type: array
                          items: {type: string}
                  features:
                    type: array
                    items:
                      type: string
                      pattern: '^[a-z0-9._-]+$'
                      minLength: 1
                      maxLength: 64
                  server_mode:
                    type: string
                    enum: [development-prototype]
                    description: >-
                      Additive field (PR-001). `development-prototype` marks a local, non-production
                      server. Clients must treat unknown values as a controlled fallback, not an error.
        '503': {$ref: '#/components/responses/Timeout'}
  /organizations/{org_id}/workspaces:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
    get:
      tags: [Workspaces]
      summary: List the workspaces of an organization the caller may see
      description: >-
        Organization owners and admins see every workspace of the organization, other members only the workspaces
        they belong to (workspace_role is the caller's role there, null for managers without a grant). Keyset
        paginated (creation time, id). Non-members and unknown organizations answer 404.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspacePage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [Workspaces]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Create a workspace (organization owner and admin)
      description: >-
        Other members: 403, non-members and unknown organizations: 404. Invalid name/slug or a taken slug answer 422
        VALIDATION_ERROR with details.fields. There is no workspace deletion in this phase (see docs/gaps.md).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWorkspaceRequest'}
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '201':
          description: Created
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "ws-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /workspaces/{workspace_id}:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
    get:
      tags: [Workspaces]
      summary: Get a workspace (organization owner/admin or workspace member)
      description: >-
        The organization is taken from the workspace, never from the client. Unknown ids, workspaces of other
        organizations and workspaces the caller may not see are indistinguishable: 404.
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '200':
          description: The workspace
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "ws-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    patch:
      tags: [Workspaces]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Rename a workspace (workspace admin, organization owner and admin)
      description: >-
        Requires If-Match with the current ETag (428 PRECONDITION_REQUIRED without, 412 VERSION_CONFLICT with a stale
        value; the response carries the current ETag). Workspace editors and viewers: 403; callers who cannot see
        the workspace: 404.
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateWorkspaceRequest'}
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '200':
          description: Updated; the new ETag is in the header
          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "ws-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenOrCsrf'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412':
          description: VERSION_CONFLICT
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '428':
          description: PRECONDITION_REQUIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /workspaces/{workspace_id}/members:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
    get:
      tags: [Workspaces]
      summary: List the members of a workspace (workspace members, organization owner and admin)
      description: >-
        Keyset paginated (join time, user id). Callers who cannot see the workspace answer 404.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceMemberPage'}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/BodyInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [Workspaces]
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      summary: Add an organization member to a workspace
      description: >-
        Organization owners and admins may assign any workspace role. A workspace admin may assign editor and viewer
        only (403 for admin) and only in the own workspace. Editors and viewers: 403. The user must be an active,
        enabled member of the workspace's organization; any other or unknown user id answers 404 (no enumeration).
        An existing workspace membership answers 409 ALREADY_MEMBER.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddWorkspaceMemberRequest'}
      responses:
        '400': {$ref: '#/components/responses/AmbiguousCredentials'}
        '201':
          description: Added
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceMember'}
