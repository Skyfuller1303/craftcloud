          headers:
            ETag: {schema: {type: string}, description: 'Strong ETag "file-v<version>"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/File'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
