# CraftCloud behind your own Apache httpd (OPS-02). Template: nothing here is a secret.
#
# Placeholders in @...@ are replaced by the installer (install.sh --proxy apache).
# When you copy this file by hand, replace them yourself and read the comments.
#
# Required modules (the installer checks them and names the missing ones):
#   proxy, proxy_http, proxy_wstunnel, headers, rewrite, ssl
# On Debian and Ubuntu: a2enmod proxy proxy_http proxy_wstunnel headers rewrite ssl
#
# What this file does:
#   * redirects HTTP to HTTPS,
#   * terminates TLS for @DOMAIN@,
#   * forwards everything to CraftCloud on 127.0.0.1:@UPSTREAM_PORT@,
#   * forwards the FigCraft live path /figcraft/ (WebSocket) to 127.0.0.1:@FIGCRAFT_PORT@.
#
# The client address: CraftCloud trusts X-Forwarded-For only from this proxy.
# ProxyAddHeaders is off so that mod_proxy does not APPEND to a header the
# client sent; the header is set to the address of the connecting client
# instead. X-Forwarded-Host is never forwarded.
#
# LimitRequestBody: Apache cannot limit above 2 GiB, so no limit is set here
# (0) when the CraftCloud file size limit is larger. CraftCloud enforces the
# declared size, the limit (default 5 GiB) and the quota itself. The limit
# CraftCloud accepts is @MAX_BODY@ bytes.

@APACHE_LISTEN_HTTP@
@APACHE_LISTEN_HTTPS@

<VirtualHost *:@HTTP_PORT@>
    ServerName @DOMAIN@
    RewriteEngine On
    # certbot's HTTP challenge is answered before this redirect.
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/?(.*)$ https://%{SERVER_NAME}@PUBLIC_PORT_SUFFIX@/$1 [R=308,L]
</VirtualHost>

<VirtualHost *:@HTTPS_PORT@>
    ServerName @DOMAIN@

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile    @TLS_CERT@
    SSLCertificateKeyFile @TLS_KEY@

    Header always set Strict-Transport-Security "max-age=31536000"
    ServerSignature Off

    # No access log of URLs on purpose: invitation, reset and FigCraft join
    # links carry tokens in the path or query.
    LimitRequestBody @APACHE_LIMIT@

    ProxyPreserveHost On
    ProxyAddHeaders Off
    ProxyRequests Off
    ProxyTimeout 3600
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset Forwarded

    # Metrics have their own internal listener and are never published.
    RedirectMatch 404 ^/metrics(/|$)

    # FigCraft live sessions (WebSocket) go to the bundled FigCraft server.
    ProxyPass        /figcraft/ http://127.0.0.1:@FIGCRAFT_PORT@/figcraft/ upgrade=websocket timeout=86400
    ProxyPassReverse /figcraft/ http://127.0.0.1:@FIGCRAFT_PORT@/figcraft/

    ProxyPass        / http://127.0.0.1:@UPSTREAM_PORT@/ connectiontimeout=5 timeout=3600 flushpackets=on
    ProxyPassReverse / http://127.0.0.1:@UPSTREAM_PORT@/
</VirtualHost>
