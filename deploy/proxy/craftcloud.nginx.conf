# CraftCloud behind your own nginx (OPS-02). Template: nothing here is a secret.
#
# Placeholders in @...@ are replaced by the installer (install.sh --proxy nginx).
# When you copy this file by hand, replace them yourself and read the comments.
#
# What this file does:
#   * redirects HTTP to HTTPS,
#   * terminates TLS for @DOMAIN@,
#   * forwards everything to CraftCloud on 127.0.0.1:@UPSTREAM_PORT@,
#   * forwards the FigCraft live path /figcraft/ (WebSocket) to 127.0.0.1:@FIGCRAFT_PORT@,
#   * streams uploads without buffering them, up to @MAX_BODY@ bytes.
#
# The client address: CraftCloud trusts X-Forwarded-For only from this proxy,
# so the header is REPLACED with the address of the connecting client. If another
# proxy or a CDN sits in front of this nginx, set the real client address with
# ngx_http_realip_module (set_real_ip_from ...; real_ip_header ...) first.
# X-Forwarded-Host is never forwarded: CraftCloud builds links from its
# configured public URL.

map $http_upgrade $craftcloud_connection_upgrade {
    default upgrade;
    ''      close;
}

# Same defaults as the bundled Caddy: CraftCloud's own value wins, these fill in
# only what it did not set (the upstream copies are hidden and re-added once).
map $upstream_http_x_content_type_options $craftcloud_nosniff {
    ''      nosniff;
    default $upstream_http_x_content_type_options;
}
map $upstream_http_referrer_policy $craftcloud_referrer_policy {
    ''      same-origin;
    default $upstream_http_referrer_policy;
}

server {
    listen @HTTP_PORT@;
    listen [::]:@HTTP_PORT@;
    server_name @DOMAIN@;

    # Neither log may hold a URL: tokens travel in paths and queries. The error
    # log is limited to critical messages (an upstream error at the error level
    # would write the whole request line).
    access_log off;
    error_log /var/log/nginx/craftcloud-error.log crit;

    # certbot's HTTP challenge is answered by certbot before this redirect.
    location / {
        return 308 https://$host@PUBLIC_PORT_SUFFIX@$request_uri;
    }
}

server {
    listen @HTTPS_PORT@ ssl;
    listen [::]:@HTTPS_PORT@ ssl;
    server_name @DOMAIN@;

    ssl_certificate     @TLS_CERT@;
    ssl_certificate_key @TLS_KEY@;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:CraftCloudTLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options $craftcloud_nosniff always;
    add_header Referrer-Policy $craftcloud_referrer_policy always;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    server_tokens off;

    # No access log of URLs on purpose: invitation, reset and FigCraft join
    # links carry tokens in the path or query. The error log is limited to
    # critical messages for the same reason.
    access_log off;
    error_log /var/log/nginx/craftcloud-error.log crit;

    # Largest file CraftCloud accepts (default 5 GiB) plus a small reserve.
    # CraftCloud enforces the real limit and the quota itself.
    client_max_body_size @MAX_BODY@;
    # Upload bodies stream straight to CraftCloud on both PUT /content and
    # PUT /chunks/{ordinal}; POST /files/{id}/uploads carries only a bounded
    # JSON manifest (4 MiB maximum, checked again by the server).
    proxy_request_buffering off;
    proxy_buffering         off;
    client_body_timeout     3600s;
    send_timeout            3600s;

    # Metrics have their own internal listener and are never published.
    location ~ ^/metrics(/|$) {
        return 404;
    }

    # FigCraft live sessions (WebSocket) go to the bundled FigCraft server.
    location /figcraft/ {
        proxy_pass http://127.0.0.1:@FIGCRAFT_PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $craftcloud_connection_upgrade;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  "";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 5s;
    }

    location / {
        proxy_pass http://127.0.0.1:@UPSTREAM_PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $craftcloud_connection_upgrade;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  "";
        proxy_set_header Forwarded         "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 5s;
    }
}
