services:
  secrets-init:
    environment:
      COPY_GRAPH_CLIENT_SECRET: "1"
    secrets: [graph_client_secret]
  server:
    environment:
      CRAFTCLOUD_GRAPH_CLIENT_SECRET_FILE: /run/secrets/graph_client_secret
secrets:
  graph_client_secret:
    file: ${CRAFTCLOUD_GRAPH_CLIENT_SECRET_SOURCE:?set Graph client secret source file}
